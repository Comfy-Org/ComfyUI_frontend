services:
  docker-daemon:
    command: sudo dockerd

  comfyui:
    port: 8188
    command: COMFYUI_PORT="$PORT" scripts/start-comfyui-e2e.sh

  frontend:
    port: 5174
    command: pnpm dev:cloud --host 0.0.0.0 --port "$PORT"
    portal:
      title: ComfyUI Frontend (Cloud)
      description: Frontend dev server connected to the Comfy test cloud backend.

  frontend-local:
    port: 5173
    command: |
      set -euo pipefail
      for attempt in $(seq 1 600); do
        curl -fsS --connect-timeout 1 --max-time 2 \
          http://127.0.0.1:8188/system_stats >/dev/null 2>&1 && break
        sleep 1
      done
      if ! curl -fsS --connect-timeout 1 --max-time 2 \
        http://127.0.0.1:8188/system_stats >/dev/null 2>&1; then
        echo 'ComfyUI did not become ready within 10 minutes.' >&2
        exit 1
      fi
      exec env VITE_REMOTE_DEV=true DISABLE_VUE_PLUGINS=true \
        pnpm dev --host 0.0.0.0 --port "$PORT"
    portal:
      title: ComfyUI Frontend (Local)
      description: Frontend dev server connected to the local containerized ComfyUI backend.
