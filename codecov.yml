coverage:
  status:
    project:
      # Keep website coverage from lowering the existing frontend status.
      # Path-filtered CI skips the unit/e2e jobs on website-only PRs; without
      # fresh uploads the carried-forward sessions can drift a rounding step
      # from the base, so only compare when this status's flags were uploaded.
      default:
        target: auto
        flags:
          - unit
          - e2e
        flag_coverage_not_uploaded_behavior: pass

      website:
        target: auto
        threshold: '1%'
        informational: true
        flags:
          - website-unit
        paths:
          - apps/website/src/**
        flag_coverage_not_uploaded_behavior: pass

    patch:
      default:
        informational: true

      # Require 80% coverage on changed website lines.
      website:
        target: '80%'
        threshold: '0%'
        informational: false
        flags:
          - website-unit
        paths:
          - apps/website/src/**
        flag_coverage_not_uploaded_behavior: pass

comment:
  layout: 'header, diff, flags, files'
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Carry forward the last known coverage for a flag when its upload is missing or
# late. The `e2e` flag is uploaded by a separate workflow_run job that can fail
# or arrive after Codecov has already computed the patch status; without this,
# E2E-only code paths show up as patch misses and the patch status fails. See
# https://docs.codecov.com/docs/carryforward-flags
flags:
  unit:
    carryforward: true
  e2e:
    carryforward: true
  # Do not hide missing website coverage with stale data.
  website-unit:
    paths:
      - apps/website/src/**
    carryforward: false
