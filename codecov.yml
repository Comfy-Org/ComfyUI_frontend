coverage:
  status:
    project:
      # Scoped to the pre-existing uploads so that adding the website report
      # (which starts near 22%) cannot drag this status down and fail PRs
      # that never touched the website.
      default:
        target: auto
        flags:
          - unit
          - e2e

      website:
        target: auto
        threshold: '1%'
        informational: true
        flags:
          - website-unit
        paths:
          - apps/website/src/**
        flag_coverage_not_uploaded_behavior: pass

    patch:
      default:
        informational: true

      # The enforcing gate: lines changed under apps/website must be covered.
      # Deliberately patch-based — it asks "is the code you just wrote
      # tested?" rather than punishing authors for pre-existing gaps.
      website:
        target: '80%'
        threshold: '0%'
        informational: true
        flags:
          - website-unit
        paths:
          - apps/website/src/**
        flag_coverage_not_uploaded_behavior: pass

comment:
  layout: 'header, diff, flags, files'
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Carry forward the last known coverage for a flag when its upload is missing or
# late. The `e2e` flag is uploaded by a separate workflow_run job that can fail
# or arrive after Codecov has already computed the patch status; without this,
# E2E-only code paths show up as patch misses and the patch status fails. See
# https://docs.codecov.com/docs/carryforward-flags
flags:
  unit:
    carryforward: true
  e2e:
    carryforward: true
  # No carryforward: the website job is the sole authority for these paths, so
  # a missing upload must never be papered over with stale coverage.
  website-unit:
    paths:
      - apps/website/src/**
    carryforward: false
