# pinact configuration
# https://github.com/suzuki-shunsuke/pinact
version: 3

files:
  - pattern: .github/workflows/*.yaml
  - pattern: .github/workflows/*.yml
  - pattern: .github/actions/**/*.yaml
  - pattern: .github/actions/**/*.yml

# Actions that don't need SHA pinning (official GitHub actions are trusted)
ignore_actions:
  - name: actions/cache
    ref: 'v\d+'
  - name: actions/cache/restore
    ref: 'v\d+'
  - name: actions/cache/save
    ref: 'v\d+'
  - name: actions/checkout
    ref: 'v\d+'
  - name: actions/setup-node
    ref: 'v\d+'
  - name: actions/setup-python
    ref: 'v\d+'
  - name: actions/upload-artifact
    ref: 'v\d+'
  - name: actions/download-artifact
    ref: 'v\d+'
  - name: actions/github-script
    ref: 'v\d+'
  # Reusable workflows pinned to a github-workflows main commit, which has no version tag.
  - name: Comfy-Org/github-workflows/.*
    ref: '[0-9a-f]{40}'
