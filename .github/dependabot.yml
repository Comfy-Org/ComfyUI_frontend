version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    groups:
      vue:
        patterns:
          - 'vue*'
          - '@vue/*'
          - '@vueuse/*'
        update-types:
          - 'minor'
          - 'patch'
      vite-vitest:
        patterns:
          - 'vite*'
          - '@vitejs/*'
          - 'vitest*'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
        update-types:
          - 'minor'
          - 'patch'
      types:
        patterns:
          - '@types/*'
        update-types:
          - 'minor'
          - 'patch'
      storybook:
        patterns:
          - 'storybook*'
          - '@storybook/*'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      development-dependencies:
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # 20.10.x throws a sync NotSupportedError on external <script> append,
      # breaking GTM/Typeform loader tests (see #13733).
      - dependency-name: 'happy-dom'
        versions: ['>=20.10.0']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # NEVER let Dependabot bump the Comfy-Org/github-workflows reusables: a
      # caller pins them TWICE (`uses:` SHA + `workflows_ref:` input) and
      # Dependabot only rewrites `uses:`, splitting the pair. The
      # bump-*-callers workflows in github-workflows move both pins together.
      # Both entries are needed: Dependabot names a reusable by its FULL path,
      # and a bare `dependency-name` is an exact match (the exact form covers
      # `owner/repo`, the `/*` form the per-file names). Do NOT collapse to
      # 'Comfy-Org/github-workflows*'.
      - dependency-name: 'Comfy-Org/github-workflows'
      - dependency-name: 'Comfy-Org/github-workflows/*'
