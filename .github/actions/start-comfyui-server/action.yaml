name: Start ComfyUI Server
description: 'Start ComfyUI server in a container environment (assumes ComfyUI is pre-installed)'

inputs:
  front_end_root:
    description: 'Path to frontend dist directory'
    required: false
    default: '$GITHUB_WORKSPACE/dist'
  workflow_templates_version:
    description: 'Optional template package version required by served-template contract tests'
    required: false
    default: ''
  timeout:
    description: 'Timeout in seconds for server startup'
    required: false
    default: '600'

runs:
  using: 'composite'
  steps:
    - name: Install required workflow templates
      if: inputs.workflow_templates_version != ''
      shell: bash
      env:
        COMFY_TEMPLATE_VERSION: ${{ inputs.workflow_templates_version }}
      run: |
        set -euo pipefail
        if ! python3 -m pip --version >/dev/null 2>&1; then
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/comfy-e2e-get-pip.py
          python3 /tmp/comfy-e2e-get-pip.py
        fi
        python3 -m pip install "comfyui-workflow-templates==${COMFY_TEMPLATE_VERSION}"
    - name: Copy devtools and start server
      shell: bash
      run: |
        set -euo pipefail
        cp -r ./tools/devtools/* /ComfyUI/custom_nodes/ComfyUI_devtools/
        cd /ComfyUI && python3 main.py --cpu --multi-user --front-end-root "${{ inputs.front_end_root }}" &
        wait-for-it --service 127.0.0.1:8188 -t ${{ inputs.timeout }}
