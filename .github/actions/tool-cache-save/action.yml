name: 'Save tool caches'
description: >
  Saves tool caches under the key computed by tool-cache-restore. Run with
  `if: always()` so a failing run still publishes results for the files that
  passed.

inputs:
  cache-key:
    description: Key returned by tool-cache-restore
    required: true
  path:
    description: Newline-separated cache paths (same value passed to tool-cache-restore)
    required: true

runs:
  using: composite
  steps:
    - name: Save caches
      uses: actions/cache/save@v5
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.cache-key }}
