name: Explain Check
description: >
  Render one required check's outcome in a shape a human or an agent can act on
  without opening the run: what the verdict means, the findings themselves, the
  command that reproduces it locally, and where the full docs are.

  Writes to the job summary always, and upserts a section into the shared PR
  report comment when the token can write, so a fork PR degrades rather than
  failing.

  The convention: any required check that can fail for a reason not obvious
  from its name should call this. The checks nobody has to ask about
  (Playwright, Storybook, the Vercel preview) are the ones that
  already put a section in the PR comment; the ones people get stuck on are the
  ones whose docs live in a workflow header, a scripts/ README, or Notion.

inputs:
  slug:
    description: >
      Section identifier in the shared PR comment (e.g. "fallow",
      "custom-nodes-matrix"). Stable per check — it is the upsert key.
    required: true
  title:
    description: Human name of the check, e.g. "Fallow"
    required: true
  icon:
    description: Emoji shown beside the title
    required: false
    default: '🔎'
  status:
    description: 'One of: pass | fail | withheld | warn | running'
    required: true
  headline:
    description: >
      One sentence, in plain English, saying what this verdict means for the
      person reading it. Not a restatement of the status — the thing they would
      otherwise have to read the workflow source to learn. Omit when the
      title and findings already say it.
    required: false
  details-file:
    description: Path to a Markdown file with the findings themselves
    required: false
  reproduce:
    description: Shell command that reproduces this verdict locally
    required: false
  docs:
    description: Link or repo path to the full documentation
    required: false
  pr-number:
    description: PR number. Omit to write the job summary only.
    required: false
  token:
    description: Token with pull-requests write. Omit to write the summary only.
    required: false

runs:
  using: composite
  steps:
    - name: Render explainer
      id: render
      shell: bash
      env:
        INPUT_SLUG: ${{ inputs.slug }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_ICON: ${{ inputs.icon }}
        INPUT_STATUS: ${{ inputs.status }}
        INPUT_HEADLINE: ${{ inputs.headline }}
        INPUT_DETAILS_FILE: ${{ inputs.details-file }}
        INPUT_REPRODUCE: ${{ inputs.reproduce }}
        INPUT_DOCS: ${{ inputs.docs }}
      run: |
        set -euo pipefail

        case "$INPUT_STATUS" in
          pass)     badge='✅ Passed' ;;
          fail)     badge='❌ Failed' ;;
          # Deliberately distinct from `fail`: the check could not measure, which
          # is not the same claim as "your change broke something".
          withheld) badge='🟡 Withheld — could not measure' ;;
          warn)     badge='⚠️ Warning' ;;
          running)  badge='⏳ Running…' ;;
          *)
            echo "::error::explain-check: unknown status '$INPUT_STATUS' (expected pass|fail|withheld|warn|running)"
            exit 1
            ;;
        esac

        # The slug is the upsert key and part of a file path below; refuse
        # anything that could escape the workspace. Same rule as
        # upsert-comment-section.
        if ! [[ "$INPUT_SLUG" =~ ^[a-z0-9-]+$ ]]; then
          echo "::error::explain-check: slug '$INPUT_SLUG' must match ^[a-z0-9-]+$"
          exit 1
        fi

        body=$(mktemp)
        trap 'rm -f "$body"' EXIT
        {
          if [ -n "$INPUT_HEADLINE" ]; then
            printf '%s\n' "$INPUT_HEADLINE"
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          case "$INPUT_STATUS" in
            fail|warn)
              printf '\n> Review the findings below and [open the workflow run](%s) to fix the reported issues before merging.\n' "$run_url"
              ;;
            withheld)
              printf '\n> No verdict is available. [Open the workflow run](%s) to confirm the check was intentionally skipped, or fix the collection failure and re-run it.\n' "$run_url"
              ;;
          esac

          if [ -n "$INPUT_DETAILS_FILE" ] && [ -s "$INPUT_DETAILS_FILE" ]; then
            printf '\n'
            cat "$INPUT_DETAILS_FILE"
          fi

          if [ -n "$INPUT_REPRODUCE" ]; then
            printf '\n<details>\n<summary>Reproduce locally</summary>\n\n'
            printf '```bash\n%s\n```\n\n</details>\n' "$INPUT_REPRODUCE"
          fi

          if [ -n "$INPUT_DOCS" ]; then
            printf '\nFull docs: %s\n' "$INPUT_DOCS"
          fi
        } > "$body"

        heading=$(printf '## %s %s: %s' "$INPUT_ICON" "$INPUT_TITLE" "$badge")
        # Drop leading blank lines here and trailing ones via the substitution,
        # so a check that supplies nothing but a verdict renders as a bare
        # heading rather than an empty box. Mirrors renderPrReportSection.
        body_text=$(sed -e '/[^[:space:]]/,$!d' "$body")

        # Must live inside the workspace: read-and-upsert-comment-section guards
        # on hashFiles(), which only resolves paths under GITHUB_WORKSPACE and
        # would silently no-op on a RUNNER_TEMP path.
        out="$GITHUB_WORKSPACE/.explain-check-${INPUT_SLUG}.md"
        # Every section of the PR report reads as one status line with the rest
        # folded away, so the comment stays scannable as checks accumulate.
        {
          printf '%s\n' "$heading"
          if [ -n "$body_text" ]; then
            printf '\n<details>\n<summary>Details</summary>\n\n%s\n\n</details>\n' "$body_text"
          fi
        } > "$out"

        echo "file=$out" >> "$GITHUB_OUTPUT"

        # The summary is the fallback that always works — fork PRs carry a
        # read-only token, so the comment path below is skipped for them. It
        # stays expanded because for those runs it is the only place the
        # findings are readable at all.
        {
          printf '%s\n' "$heading"
          if [ -n "$body_text" ]; then
            printf '\n%s\n' "$body_text"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upsert section into the PR report
      if: ${{ inputs.pr-number != '' && inputs.token != '' }}
      # A comment failure must not turn a green check red, nor mask a red one.
      continue-on-error: true
      uses: ./.github/actions/read-and-upsert-comment-section
      with:
        pr-number: ${{ inputs.pr-number }}
        section-name: ${{ inputs.slug }}
        section-file: ${{ steps.render.outputs.file }}
        token: ${{ inputs.token }}
