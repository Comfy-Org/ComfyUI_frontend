# Outputs default to 'true' for non-pull_request events: granular path filtering
# is a PR-only optimization. This avoids the silent skip footgun where a job
# gated on e.g. `app-website-changes == 'true'` would never run on push.
# `evaluate-candidate` is the one exception, and only for the `should-run*`
# outputs.
#
# It compares a merge-group candidate's synthetic head with its parent, so the
# verdict covers that candidate alone. Opt in only from a workflow whose
# required check is emitted whatever the verdict; a check GitHub never creates
# leaves the queue waiting.
#
# Shared dependency files (.nvmrc, root package.json, pnpm-lock.yaml,
# pnpm-workspace.yaml) are folded into every app-* and packages-changes
# output so a lockfile bump correctly invalidates each granular gate. They
# are NOT folded into docs-changes.
#
# Two paths-filter steps are needed because predicate-quantifier=every is
# required for the negated globs in the `should-run*` outputs but breaks
# multi-pattern OR filters like `docs:` and `deps:`.
#
# `should-run-unit`, `should-run-e2e`, and `should-run-source` narrow
# `should-run` by the kind of test file a PR touches. Vitest owns `**/*.test.ts`
# everywhere (playwright.config.ts ignores that suffix) plus `**/__mocks__/**`,
# which no non-test source imports, and Playwright owns
# `browser_tests/**/*.spec.ts` plus its snapshots, plans, and configs. Helper
# and fixture files under `browser_tests/` stay relevant to every output: unit
# tests import fixture data from there, and the ecosystem matrix imports
# `browser_tests/assets/default.json` and `vitest.setup.ts`.
#
# Requires the caller to have checked out the repository.

name: 'Detect Path Changes'
description: >
  Computes typed *-changes outputs and a back-compat should-run for
  path-gated CI jobs.

inputs:
  evaluate-candidate:
    description: >
      Also evaluate the `should-run*` outputs for merge_group candidates, so
      they can be false there. Left off, they keep the unconditional 'true'.
    required: false
    default: 'false'

outputs:
  should-run:
    description: >
      Any file outside `apps/`, `docs/`, `.storybook/`, or `**/*.md` changed.
      With `evaluate-candidate` set to 'true', also evaluated for merge-queue
      candidates, over the range from the merge group's parent commit to this
      candidate's synthetic head.
    value: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || (github.event_name == 'merge_group' && inputs.evaluate-candidate != 'true') || steps.relevant.outputs.relevant == 'true' }}
  should-run-unit:
    description: >
      `should-run`, minus Playwright specs, snapshots, plans, and configs.
      Gates Vitest.
    value: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || (github.event_name == 'merge_group' && inputs.evaluate-candidate != 'true') || steps.relevant.outputs.unit == 'true' }}
  should-run-e2e:
    description: >
      `should-run`, minus `**/*.test.ts` and `**/__mocks__/**`. Gates
      Playwright suites, including the perf project.
    value: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || (github.event_name == 'merge_group' && inputs.evaluate-candidate != 'true') || steps.relevant.outputs.e2e == 'true' }}
  should-run-source:
    description: >
      `should-run`, minus both test-file sets. Gates jobs that only consume
      built or imported source: ecosystem matrix, size data, dist scans.
    value: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || (github.event_name == 'merge_group' && inputs.evaluate-candidate != 'true') || steps.relevant.outputs.source == 'true' }}
  app-website-changes:
    description: 'Shared deps, `apps/website/**`, or website e2e workflow support changed.'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' || steps.filter.outputs.app_website == 'true' }}
  app-billing-web-changes:
    description: 'Shared deps, `apps/billing-web/**`, or a billing-web workflow changed.'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' || steps.filter.outputs.app_billing_web == 'true' }}
  app-frontend-changes:
    description: 'Shared deps or `src/**` changed.'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' || steps.filter.outputs.app_frontend == 'true' }}
  packages-changes:
    description: 'Shared deps or `packages/**` changed.'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' || steps.filter.outputs.packages == 'true' }}
  storybook-changes:
    description: 'Shared deps or frontend/marketing Storybook infrastructure changed.'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' || steps.filter.outputs.storybook == 'true' }}
  docs-changes:
    description: '`docs/**` or any `**/*.md` changed (deps NOT folded in).'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
  dependency-changes:
    description: 'Root `.nvmrc`, `package.json`, `pnpm-lock.yaml`, or `pnpm-workspace.yaml` changed.'
    value: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}

runs:
  using: composite
  steps:
    - name: Filter typed changes
      if: ${{ github.event_name == 'pull_request' }}
      id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          app_website:
            - 'apps/website/**'
            - '.github/workflows/ci-website-e2e.yaml'
            - 'scripts/cicd/prepare-website-e2e-report.sh'
            - 'scripts/cicd/check-website-e2e-result.sh'
          app_billing_web:
            - 'apps/billing-web/**'
            - '.github/workflows/ci-billing-web-unit.yaml'
            - '.github/workflows/ci-billing-web-e2e.yaml'
          app_frontend:
            - 'src/**'
          packages:
            - 'packages/**'
          storybook:
            - '.storybook/**'
            - 'build/**'
            - 'vite.config.mts'
            - 'apps/website/.storybook/**'
            - 'apps/website-storybook-mcp/**'
            - '.github/workflows/ci-tests-storybook.yaml'
            - '.github/workflows/ci-tests-storybook-forks.yaml'
            - 'scripts/cicd/pr-storybook-deploy-and-comment.sh'
          docs:
            - 'docs/**'
            - '**/*.md'
          deps:
            - '.nvmrc'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'

    - name: Filter relevant changes
      if: ${{ github.event_name == 'pull_request' || (github.event_name == 'merge_group' && inputs.evaluate-candidate == 'true') }}
      id: relevant
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        predicate-quantifier: 'every'
        filters: |
          relevant: &relevant
            - '**'
            - '!apps/**'
            - '!docs/**'
            - '!.storybook/**'
            - '!**/*.md'
          unit: &unit
            - *relevant
            - '!browser_tests/**/*.spec.ts'
            - '!browser_tests/**/*-snapshots/**'
            - '!browser_tests/specs/**'
            - '!playwright*.config.ts'
          e2e:
            - *relevant
            - '!**/*.test.ts'
            - '!**/__mocks__/**'
          source:
            - *unit
            - '!**/*.test.ts'
            - '!**/__mocks__/**'
