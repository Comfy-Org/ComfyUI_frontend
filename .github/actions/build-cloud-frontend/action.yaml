name: Build Cloud Frontend
description: 'Build the cloud distribution and upload it as the frontend-dist-cloud artifact'
inputs:
  expected_commit:
    description: >-
      Frontend commit the built artifact must declare. Callers that check out
      the workflow SHA should pass it. Callers that check out some other ref
      may omit it, in which case the provenance assertion falls back to this
      checkout's own HEAD — the same value the build embeds, so it degrades to
      a tautology. The distribution, gate, and fixture assertions are unaffected.
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Build cloud frontend
      shell: bash
      run: pnpm build:cloud
      env:
        VITE_USE_LEGACY_DEFAULT_GRAPH: 'true'

    - name: Verify cloud frontend
      shell: bash
      # Never skip. Without expected_commit the provenance leg proves nothing;
      # the distribution assertion is what rejects a leftover localhost dist/.
      run: |
        set -euo pipefail
        EXPECTED_FRONTEND_COMMIT="${EXPECTED_FRONTEND_COMMIT:-$(git rev-parse HEAD)}" \
          pnpm test:assets-flag-artifact
      env:
        EXPECTED_FRONTEND_COMMIT: ${{ inputs.expected_commit }}
        EXPECTED_DISTRIBUTION: cloud

    - name: Upload cloud frontend
      uses: actions/upload-artifact@v6
      with:
        name: frontend-dist-cloud
        path: dist/
        retention-days: 1
