name: Harvest Snapshot Updates
description: >
  Finds the screenshots a PR's E2E run captured, or reports that the comment
  asked for a full rerun. Every Playwright job in that run uploads a
  `<artifact-prefix>*` artifact holding, on its golden path, the actual image
  of each screenshot assertion that failed its test's final attempt, plus a
  manifest (see tools/snapshot-updates-reporter). This action waits for the
  run for the PR head, requires an artifact from every Playwright job that
  ran, and fails with the reason when the run cannot supply them.

inputs:
  e2e-workflow:
    description: E2E workflow file name, e.g. ci-tests-e2e.yaml
    required: true
  head-sha:
    description: PR head commit the E2E run must belong to
    required: true
  artifact-prefix:
    description: Prefix of the per-job artifacts the E2E run uploads
    required: true
  job-prefix:
    description: Prefix of the job names that run Playwright in the E2E run
    required: true
  comment-body:
    description: Triggering comment; `/<command> full` requests a full rerun
    required: false
    default: ''
  wait-minutes:
    description: How long to wait for an in-progress E2E run
    required: false
    default: '45'

outputs:
  mode:
    description: >
      `harvest` when the E2E run's artifacts can be committed, `full` when
      the comment asked for a rerun with --update-snapshots.
    value: ${{ steps.plan.outputs.mode }}
  run-id:
    description: The E2E run to download the artifacts from, when harvesting
    value: ${{ steps.plan.outputs.run-id }}

runs:
  using: composite
  steps:
    - name: Locate the E2E run for the PR head
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        E2E_WORKFLOW: ${{ inputs.e2e-workflow }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        JOB_PREFIX: ${{ inputs.job-prefix }}
        COMMENT_BODY: ${{ inputs.comment-body }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
      run: |
        set -euo pipefail

        unavailable() {
          echo "::error::$1 Re-run the E2E workflow and trigger the update again, or comment the update command followed by \`full\` to rerun Playwright with --update-snapshots."
          exit 1
        }

        if grep -qE '^/[^[:space:]]+[[:space:]]+full([[:space:]]|$)' <<< "${COMMENT_BODY%%$'\n'*}"; then
          echo "mode=full" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${E2E_WORKFLOW}/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=20" \
          --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].id // empty')
        if [ -z "$run_id" ]; then
          unavailable "No E2E run exists for ${HEAD_SHA}."
        fi
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

        if ! timeout "${WAIT_MINUTES}m" gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null; then
          unavailable "The E2E run ${run_url} did not finish within ${WAIT_MINUTES} minutes."
        fi

        conclusions=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
          --jq '.jobs[] | select(.name | startswith(env.JOB_PREFIX)) | .conclusion')
        if printf '%s' "$conclusions" | grep -qvE '^(success|failure|skipped)$'; then
          unavailable "Some ${JOB_PREFIX} jobs in ${run_url} did not finish."
        fi
        ran=$(printf '%s' "$conclusions" | grep -cE '^(success|failure)$' || true)
        artifacts=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
          --jq '.artifacts[] | select((.name | startswith(env.ARTIFACT_PREFIX)) and (.expired | not)) | .name' | wc -l)
        if [ "$ran" -eq 0 ]; then
          unavailable "No ${JOB_PREFIX} jobs ran in ${run_url}."
        fi
        if [ "$artifacts" -ne "$ran" ]; then
          unavailable "${artifacts} of ${ran} ${JOB_PREFIX} jobs in ${run_url} left a usable ${ARTIFACT_PREFIX}* artifact."
        fi

        {
          echo "mode=harvest"
          echo "run-id=${run_id}"
        } >> "$GITHUB_OUTPUT"
