name: Harvest Snapshot Updates
description: >
  Reuses the screenshots a PR's E2E run already took. Every Playwright job in
  that run uploads a `<artifact-prefix>*` artifact holding the actual image of
  each failed screenshot assertion on its golden path, plus a manifest (see
  tools/snapshot-updates-reporter). This action waits for the run for the PR
  head, requires an artifact from every Playwright job that ran, and
  re-uploads the merged images as one artifact for commit-snapshot-updates.

inputs:
  e2e-workflow:
    description: E2E workflow file name, e.g. ci-tests-e2e.yaml
    required: true
  head-sha:
    description: PR head commit the E2E run must belong to
    required: true
  artifact-prefix:
    description: Prefix of the per-job artifacts the E2E run uploads
    required: true
  job-prefix:
    description: Prefix of the job names that run Playwright in the E2E run
    required: true
  output-artifact:
    description: Name of the artifact that receives the merged tree
    required: true
  comment-body:
    description: Triggering comment; `/<command> full` forces the fallback
    required: false
    default: ''
  wait-minutes:
    description: How long to wait for an in-progress E2E run
    required: false
    default: '45'
  token:
    description: Token with actions read access
    required: true

outputs:
  mode:
    description: >
      `harvest` when the merged tree was uploaded, `none` when the E2E run
      had no screenshot mismatches, `full` when the caller must rerun
      Playwright with --update-snapshots instead.
    value: ${{ steps.plan.outputs.mode || steps.merge.outputs.mode }}
  run-url:
    description: The E2E run the images came from (empty when none was found)
    value: ${{ steps.plan.outputs.run-url }}

runs:
  using: composite
  steps:
    - name: Locate the E2E run for the PR head
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        E2E_WORKFLOW: ${{ inputs.e2e-workflow }}
        HEAD_SHA: ${{ inputs.head-sha }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        JOB_PREFIX: ${{ inputs.job-prefix }}
        COMMENT_BODY: ${{ inputs.comment-body }}
        WAIT_MINUTES: ${{ inputs.wait-minutes }}
      run: |
        set -euo pipefail

        fallback() {
          echo "::notice::$1 Falling back to a full --update-snapshots rerun."
          echo "mode=full" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if printf '%s\n' "$COMMENT_BODY" | head -1 | grep -qE '^/[^[:space:]]+[[:space:]]+full([[:space:]]|$)'; then
          fallback "A full regeneration was requested."
        fi

        run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${E2E_WORKFLOW}/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=20" \
          --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0].id // empty')
        if [ -z "$run_id" ]; then
          fallback "No E2E run exists for ${HEAD_SHA}."
        fi
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
        {
          echo "run-id=${run_id}"
          echo "run-url=${run_url}"
        } >> "$GITHUB_OUTPUT"

        if ! timeout "${WAIT_MINUTES}m" gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 > /dev/null; then
          fallback "The E2E run ${run_url} did not finish within ${WAIT_MINUTES} minutes."
        fi

        conclusions=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
          --jq '.jobs[] | select(.name | startswith(env.JOB_PREFIX)) | .conclusion')
        if printf '%s' "$conclusions" | grep -qvE '^(success|failure|skipped)$'; then
          fallback "Some ${JOB_PREFIX} jobs in ${run_url} did not finish."
        fi
        ran=$(printf '%s' "$conclusions" | grep -cE '^(success|failure)$' || true)
        artifacts=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
          --jq '.artifacts[] | select((.name | startswith(env.ARTIFACT_PREFIX)) and (.expired | not)) | .name' | wc -l)
        if [ "$ran" -eq 0 ] || [ "$artifacts" -ne "$ran" ]; then
          fallback "${artifacts} of ${ran} ${JOB_PREFIX} jobs in ${run_url} left a usable ${ARTIFACT_PREFIX}* artifact."
        fi

    - name: Download snapshot updates
      if: steps.plan.outputs.mode != 'full'
      uses: actions/download-artifact@v8
      with:
        run-id: ${{ steps.plan.outputs.run-id }}
        github-token: ${{ inputs.token }}
        pattern: ${{ inputs.artifact-prefix }}*
        path: ${{ runner.temp }}/harvest-download

    - name: Merge snapshot updates
      id: merge
      if: steps.plan.outputs.mode != 'full'
      shell: bash
      env:
        DOWNLOAD_DIR: ${{ runner.temp }}/harvest-download
        MERGED_DIR: ${{ runner.temp }}/harvested-snapshots
      run: |
        set -euo pipefail

        count=$(jq -s 'map(length) | add' "$DOWNLOAD_DIR"/*/manifest.json)
        if [ "$count" -eq 0 ]; then
          echo "::notice::The E2E run finished with no screenshot mismatches; nothing to update."
          echo "mode=none" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        mkdir -p "$MERGED_DIR"
        for artifact in "$DOWNLOAD_DIR"/*/; do
          rsync -a --exclude manifest.json "$artifact" "$MERGED_DIR/"
        done
        echo "Harvested ${count} snapshot(s)"
        echo "mode=harvest" >> "$GITHUB_OUTPUT"

    - name: Upload harvested snapshots
      if: steps.merge.outputs.mode == 'harvest'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.output-artifact }}
        path: ${{ runner.temp }}/harvested-snapshots/
        retention-days: 1
