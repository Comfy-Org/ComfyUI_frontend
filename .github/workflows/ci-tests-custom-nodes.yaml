# Runs the custom-node regression suite against a backend that has the manifest
# packs actually installed, so the load/run tiers execute for real. This is a
# GATING check: if a pack fails to install or any tier is skipped, the job goes
# red - a regression gate that let a broken pack through as a "skip" would be
# pointless. Mark `custom-nodes-e2e-core` as a required status check in branch
# protection to block merges on failure.
#
# The gate is deterministic at the GIT level: ComfyUI core and every pack are
# pinned at verified commits, so no git surface moves underneath a PR. Python
# deps (core's and packs' requirements.txt) still resolve fresh per run and
# the runner image updates independently - a red that reproduces on a trivial
# PR right after a dependency release is environment, not the PR.
name: 'CI: Tests Custom Nodes'

on:
  pull_request:
    branches-ignore: [wip/*, draft/*, temp/*]
  push:
    branches: [main, master]
  merge_group:
  workflow_dispatch:
    inputs:
      detection_proof_row:
        description: 'Clean run or deliberate independent-tier break'
        required: false
        type: choice
        options: ['0', 'all', '1', '2', '3', '9']
        default: '0'
      branch:
        description: 'Frontend branch/ref to test (empty = the ref this workflow runs from)'
        required: false
        type: string
        default: ''
      grep:
        description: "Playwright -g filter, e.g. 'VideoHelperSuite' or 'Pack startup' (empty = full suite; the exact-count gate is skipped when set)"
        required: false
        type: string
        default: ''
      comfyui_ref:
        description: 'ComfyUI core ref to run against (empty = the verified pin)'
        required: false
        type: string
        default: ''

concurrency:
  # Dispatches get a per-run group: two manual runs (e.g. comparing branches)
  # must not cancel each other, while PR pushes keep the usual per-ref
  # supersede behavior.
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  # Path gating lives here, not in a trigger-level `paths:` filter: a required
  # check gated by trigger paths never creates a check run on an unrelated PR
  # and leaves branch protection stuck Pending. A job-level `if:` still creates
  # the check and marks it Skipped (= passing). Mirrors ci-tests-unit.yaml.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.changes.outputs.should-run }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        uses: ./.github/actions/changes-filter

  # Each job is intentionally one worker and unsharded. The five isolated
  # proof jobs may run concurrently because they own separate Core backends.
  custom-nodes-e2e-core:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        proof_row: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.detection_proof_row == 'all' && '["1","2","3","9"]' || format('["{0}"]', inputs.detection_proof_row || '0')) }}
    # Run only when non-docs code changed AND the PR is same-repo. Fork PRs can
    # edit the manifest's repo/pin URLs, and this job clones and pip-installs
    # whatever they point at (setup.py runs at install time), so an untrusted
    # fork must not be able to aim the clone at an attacker-controlled repo.
    # Fork PRs still get the environment-agnostic coverage via the main e2e
    # shards. A skipped job counts as passing, so this stays required-safe.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.should-run == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # workflow_dispatch may aim the suite at any frontend branch; every
          # other event tests its own ref exactly as before.
          ref: ${{ inputs.branch || github.ref }}

      - name: Fetch Detection Proof ancestry
        if: >-
          github.event_name == 'workflow_dispatch' &&
          matrix.proof_row != '0'
        shell: bash
        run: git fetch --no-tags --unshallow origin

      - name: Apply Detection Proof source break
        id: source-mutation
        if: >-
          github.event_name == 'workflow_dispatch' &&
          matrix.proof_row != '0' &&
          matrix.proof_row != '9'
        shell: bash
        env:
          ROW: ${{ matrix.proof_row }}
        run: |
          set -euo pipefail
          d=browser_tests/tests/customNodes/detection-proof
          p=$(printf '%s/row-%02d-'"*.patch" "$d" "$ROW")
          # shellcheck disable=SC2086
          p=$(ls $p 2>/dev/null | head -1 || true)
          [ -n "$p" ] || { echo "::error::no patch file for S$ROW"; exit 1; }
          git apply --check "$p"
          git apply "$p"
          grep -rq "DETECTION PROOF (row $ROW" src/
          echo "path=$p" >> "$GITHUB_OUTPUT"
          echo "digest=$(shasum -a 256 "$p" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          include_build_step: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      # Checks out ComfyUI, installs Python/torch/requirements and ComfyUI_devtools.
      # launch_server:false so we can add the manifest packs before booting.
      # comfyui_ref pins core so the gate is reproducible: this SHA is the
      # exact master commit the suite (incl. the KJNodes ledger entries and
      # per-pack node counts) was last verified green against. Bump it
      # deliberately, in its own PR, recalibrating ledgers/counts if the run
      # says so.
      - name: Setup ComfyUI server
        uses: ./.github/actions/setup-comfyui-server
        with:
          launch_server: 'false'
          # workflow_dispatch may override the pin (e.g. probing a core
          # candidate before a deliberate bump); every gating event stays
          # pinned.
          comfyui_ref: ${{ inputs.comfyui_ref || 'b08e6cf35fac50d3ca8470dffb3f9a1fbb7187d2' }}

      # Pack sources are SHA-pinned, so their content is fully determined by
      # the manifest: cache the checked-out trees (sans .git) and restore by
      # manifest hash, with a prefix fallback so a single-pack pin bump still
      # reuses every other pack. The per-pack .pin marker is the integrity
      # check - a stale or partial entry re-clones.
      - name: Restore manifest pack cache
        id: pack-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/cn-packs
          key: cn-packs-v2-${{ hashFiles('browser_tests/fixtures/data/customNodeManifest.core.json') }}
          restore-keys: cn-packs-v2-

      # Install every pack the manifest declares (DRY: a new pack row installs
      # itself here, no workflow change). A clone or dependency failure fails the
      # job - if a pack can't be installed, its coverage can't run, and that is a
      # gate failure, not something to paper over. The `jq | while` pipe hides
      # failures in a subshell, so read into an array and loop with `set -e`.
      - name: Install manifest custom nodes
        id: install
        shell: bash
        run: |
          set -euo pipefail
          # Pin the CPU torch stack that setup-comfyui-server installed so no
          # pack's requirements.txt can pull a GPU/incompatible torch onto this
          # --cpu runner. A pack that genuinely needs a different torch fails
          # the constrained install loudly rather than silently swapping it.
          pip freeze | grep -iE '^(torch|torchvision|torchaudio)==' \
            > /tmp/torch-constraints.txt || true
          manifest=browser_tests/fixtures/data/customNodeManifest.core.json
          mapfile -t entries < <(jq -c '.[]' "$manifest")
          for entry in "${entries[@]}"; do
            repo=$(jq -r '.repo' <<<"$entry")
            pin=$(jq -r '.pin' <<<"$entry")
            # Install under the manifest `pack` key, not basename(repo): node
            # attribution keys on the install dirname via python_module, and
            # the two only coincide by luck. Same charset the manifest loader
            # enforces - belt for anything that bypasses it.
            pack=$(jq -r '.pack' <<<"$entry")
            if ! [[ "$pack" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error::unsafe pack name: '$pack'"; exit 1
            fi
            # The gate tests exactly what was verified: a full SHA pin is
            # mandatory here, before anything installs.
            if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::$pack: pin must be a full commit SHA (got '$pin')"; exit 1
            fi
            dir="ComfyUI/custom_nodes/$pack"
            cache_dir="$HOME/.cache/cn-packs/$pack"
            # The pin marker is a SIBLING of the tree, never inside it - a
            # pack legitimately shipping a top-level .pin must install
            # identically on cached and fresh runs.
            if [ -f "$cache_dir.pin" ] && [ "$(cat "$cache_dir.pin")" = "$pin" ]; then
              echo "::group::restore $pack from cache ($pin)"
              cp -R "$cache_dir" "$dir"
            else
              echo "::group::install $pack"
              git clone --depth 1 "$repo" "$dir"
              git -C "$dir" fetch --depth 1 origin "$pin"
              git -C "$dir" checkout "$pin"
              # Repopulate the cache entry: tree without .git (nothing after
              # this point reads pack git state), pin written LAST so a
              # truncated copy fails the integrity check above.
              rm -rf "$cache_dir" "$cache_dir.pin"
              mkdir -p "$(dirname "$cache_dir")"
              cp -R "$dir" "$cache_dir"
              rm -rf "$cache_dir/.git"
              printf '%s' "$pin" > "$cache_dir.pin"
            fi
            if [ -f "$dir/requirements.txt" ]; then
              pip install -r "$dir/requirements.txt" -c /tmp/torch-constraints.txt
            fi
            echo "::endgroup::"
          done
          # Prune entries for packs no longer in the manifest: the prefix
          # fallback restores old entries and the save re-tars the whole
          # directory, so without this the entry grows monotonically and
          # eats the repo's shared cache budget.
          if [ -d "$HOME/.cache/cn-packs" ]; then
            current=$(jq -r '.[].pack' "$manifest")
            for entry in "$HOME/.cache/cn-packs"/*; do
              name=$(basename "$entry" .pin)
              grep -qxF "$name" <<<"$current" || rm -rf "$entry"
            done
          fi

      # Save only when this run rebuilt entries. An exact-key restore means
      # the stored tree is already current - actions/cache/save re-tars and
      # uploads unconditionally and only then hits the duplicate-key
      # rejection, so skipping here is what actually avoids the cost. Gating
      # on the INSTALL step (not the job) still saves when the suite fails,
      # while a failed or cancelled install can never freeze a partial tree
      # under the immutable key.
      - name: Save manifest pack cache
        if: always() && steps.install.outcome == 'success' && steps.pack-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cn-packs
          key: cn-packs-v2-${{ hashFiles('browser_tests/fixtures/data/customNodeManifest.core.json') }}

      - name: Apply Detection Proof execution break
        id: execution-mutation
        if: >-
          github.event_name == 'workflow_dispatch' &&
          matrix.proof_row == '9'
        shell: bash
        run: |
          set -euo pipefail
          f=ComfyUI/custom_nodes/was-node-suite-comfyui/WAS_Node_Suite.py
          perl -pi -e 's/(def return_constant_number\(self, number_type, number, number_as_text=None\):)/$1\n        raise ValueError("DETECTION PROOF (row 9): pack node runtime failure")/' "$f"
          grep -q 'DETECTION PROOF (row 9)' "$f"
          mutation='raise ValueError("DETECTION PROOF (row 9): pack node runtime failure")'
          echo "path=$f" >> "$GITHUB_OUTPUT"
          echo "digest=$(printf '%s' "$mutation" | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Bind Detection Proof identity
        if: >-
          github.event_name == 'workflow_dispatch' &&
          matrix.proof_row != '0'
        shell: bash
        env:
          E2E_PARENT: d02f676c9e0d371248274bbfc93dfc9c49a606b8
          MUTATION_DIGEST: ${{ steps.source-mutation.outputs.digest || steps.execution-mutation.outputs.digest }}
          MUTATION_PATH: ${{ steps.source-mutation.outputs.path || steps.execution-mutation.outputs.path }}
          PROOF_ROW: ${{ matrix.proof_row }}
        run: |
          set -euo pipefail
          PROOF_SHA=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$E2E_PARENT" HEAD || { echo "::error::E2E parent $E2E_PARENT is not an ancestor"; exit 1; }
          [ -n "$MUTATION_PATH" ] && [ -n "$MUTATION_DIGEST" ] || { echo '::error::mutation identity is incomplete'; exit 1; }
          case "$PROOF_ROW" in
            1) title='S1: every registered node mounts on the canvas renderer'; pat='ImpactInt: instance is missing declared input \\"value\\" \\(litegraph\\)' ;;
            2) title='S2: every registered node mounts on the DOM renderer'; pat=': Vue mounts ' ;;
            3) title='S3: every registered node survives save and reload'; pat='on (pristine|set-values) reload' ;;
            9) title='S9: every self-sufficient node executes'; pat='DETECTION PROOF \\(row 9\\): pack node runtime failure' ;;
          esac
          {
            echo "proof_sha=$PROOF_SHA"
            echo "e2e_parent_sha=$E2E_PARENT"
            echo "tier=S$PROOF_ROW"
            echo "test_identity=$title"
            echo "mutation_path=$MUTATION_PATH"
            echo "mutation_sha256=$MUTATION_DIGEST"
            echo "expected_failure_regex=$pat"
            echo 'workers=1'
            echo 'retries=0'
          } | tee tier-isolation-proof-identity.txt

      # The VHS run-tier workflow reads input/plain_video.mp4.
      - name: Stage run-tier assets
        shell: bash
        run: cp browser_tests/assets/plain_video.mp4 ComfyUI/input/plain_video.mp4

      # --cache-none so retried run-tier tests re-execute every node (a cached
      # node emits no `executing` event and would false-fail PARTIAL).
      - name: Start ComfyUI server
        shell: bash
        working-directory: ComfyUI
        run: |
          python main.py --cpu --multi-user --cache-none --front-end-root ../dist &
          wait-for-it --service 127.0.0.1:8188 -t 600

      - name: Run custom-node suite
        id: suite
        continue-on-error: >-
          ${{ github.event_name == 'workflow_dispatch' && matrix.proof_row != '0' }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: custom-nodes-results.json
          PROOF_ROW: ${{ matrix.proof_row }}
          # Through env, not inline interpolation: dispatch input must never
          # be shell-parsed.
          GREP_FILTER: ${{ inputs.grep }}
        run: |
          set -o pipefail
          # workers=1: the auto-run tier needs exclusive backend-queue access;
          # parallel workers interrupt each other's executions.
          # --project=custom-nodes: the `@custom-nodes`-tagged specs, which the
          # main e2e job's `chromium` project excludes (see playwright.config).
          # Json feeds the skip gate below; html writes playwright-report/
          # (the upload step's target) and folds in the retain-on-failure
          # traces. List keeps live diagnostics visible.
          grep_args=()
          case "$PROOF_ROW" in
            0) [ -n "${GREP_FILTER:-}" ] && grep_args=(--grep "$GREP_FILTER") ;;
            1|2|3|9|14)
              grep_args=(--grep 'all nodes by tier @custom-nodes.*S(1|2|3|9):')
              ;;
          esac
          pnpm exec playwright test browser_tests/tests/customNodes/ \
            --project=custom-nodes --reporter=list,json,html --workers=1 --retries=0 \
            "${grep_args[@]}" 2>&1 | tee custom-nodes.log

      # A skip here means a pack or devtools did not load: on this backend every
      # tier is meant to run, so a skip is a gate failure, not an honest pass.
      - name: Forbid failed, skipped, or flaky tests
        if: >-
          always() &&
          !(github.event_name == 'workflow_dispatch' && matrix.proof_row != '0')
        shell: bash
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          EXPECTED_TESTS: '32'
          GREP_FILTER: ${{ inputs.grep }}
        run: |
          set -euo pipefail
          # The JSON result is mandatory even when the suite step failed: the
          # gate must independently prove the failed, skipped, and flaky totals.
          if [ ! -f custom-nodes-results.json ]; then
            echo "::error::suite wrote no results json (${SUITE_OUTCOME:-unknown}) - the result gate could not run"
            exit 1
          fi
          collected=$(jq -er '[.stats.expected, .stats.unexpected, .stats.flaky, .stats.skipped] | add' custom-nodes-results.json)
          echo "collected tests: $collected"
          # A dispatch grep runs a deliberate subset; the exact-count gate
          # applies only to full runs (every gating event runs unfiltered).
          if [ -n "${GREP_FILTER:-}" ]; then
            echo "grep filter active ('$GREP_FILTER') - exact-count gate skipped for this manual subset run"
          elif [ "$collected" != "$EXPECTED_TESTS" ]; then
            echo "::error::collected $collected tests; expected exactly $EXPECTED_TESTS active Core custom-node tests"
            exit 1
          fi
          unexpected=$(jq -er '.stats.unexpected | numbers' custom-nodes-results.json)
          echo "failed tests: $unexpected"
          if [ "$unexpected" != "0" ]; then
            echo "::error::$unexpected test(s) failed - failed results are not acceptable in the gating job"
            jq -r '.. | objects
                     | select(has("title") and has("tests"))
                     | select(any(.tests[]?; .status == "unexpected"))
                     | .title' custom-nodes-results.json | sort -u | head -40
            exit 1
          fi
          skipped=$(jq -er '.stats.skipped | numbers' custom-nodes-results.json)
          echo "skipped tests: $skipped"
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped test(s) skipped - a manifest pack or devtools failed to load; skips are not acceptable in the gating job"
            jq -r '.. | objects
                     | select(has("title") and has("tests"))
                     | select(any(.tests[]?; .status == "skipped"))
                     | .title' custom-nodes-results.json | sort -u | head -40
            exit 1
          fi
          flaky=$(jq -er '.stats.flaky | numbers' custom-nodes-results.json)
          echo "flaky tests: $flaky"
          if [ "$flaky" != "0" ]; then
            echo "::error::$flaky test(s) passed only after retry - flaky results are not acceptable in the gating job"
            jq -r '.. | objects
                     | select(has("title") and has("tests"))
                     | select(any(.tests[]?; .status == "flaky"))
                     | .title' custom-nodes-results.json | sort -u | head -40
            exit 1
          fi

      - name: Assert deliberate failure independence
        if: >-
          always() &&
          github.event_name == 'workflow_dispatch' &&
          matrix.proof_row != '0'
        shell: bash
        env:
          PROOF_ROW: ${{ matrix.proof_row }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          set -euo pipefail
          [ -f custom-nodes-results.json ] || { echo "::error::proof wrote no JSON"; exit 1; }
          collected=$(jq -er '[.stats.expected, .stats.unexpected, .stats.flaky, .stats.skipped] | add' custom-nodes-results.json)
          expected=$(jq -er '.stats.expected' custom-nodes-results.json)
          unexpected=$(jq -er '.stats.unexpected' custom-nodes-results.json)
          skipped=$(jq -er '.stats.skipped' custom-nodes-results.json)
          flaky=$(jq -er '.stats.flaky' custom-nodes-results.json)
          expected_collected=4
          expected_passed=3
          expected_failed=1
          [ "$collected" = "$expected_collected" ] || { echo "::error::S$PROOF_ROW collected $collected tests, expected $expected_collected"; exit 1; }
          [ "$expected" = "$expected_passed" ] || { echo "::error::S$PROOF_ROW expected-pass count is $expected, expected $expected_passed"; exit 1; }
          [ "$unexpected" = "$expected_failed" ] || { echo "::error::S$PROOF_ROW failure count is $unexpected, expected $expected_failed"; exit 1; }
          [ "$skipped" = 0 ] && [ "$flaky" = 0 ] || { echo "::error::S$PROOF_ROW has skipped=$skipped flaky=$flaky"; exit 1; }
          [ "$SUITE_OUTCOME" = failure ] || { echo "::error::S$PROOF_ROW did not break its witness"; exit 1; }

          {
            jq -r '.. | objects | select(.status? == "unexpected") | .results[]? | .error?.message? // empty' custom-nodes-results.json
            jq -r '.. | objects | select(.status? == "unexpected") | .results[]?.attachments[]? | select(.contentType? == "application/json" and has("body")) | (.body | @base64d | fromjson) | if type == "array" then .[] else . end' custom-nodes-results.json
          } > tier-isolation-proof-evidence.txt
          case "$PROOF_ROW" in
            1) pat='ImpactInt: instance is missing declared input \\"value\\" \(litegraph\)' ;;
            2) pat=': Vue mounts ' ;;
            3) pat='on (pristine|set-values) reload' ;;
            9) pat='DETECTION PROOF \(row 9\): pack node runtime failure' ;;
            14) pat='widgets\[[0-9]+\]\.y: expected [^,]+, got ' ;;
          esac
          grep -Eq -- "$pat" tier-isolation-proof-evidence.txt || { echo "::error::S$PROOF_ROW failure was not attributable to its Detection Proof break"; exit 1; }

          case "$PROOF_ROW" in
            1) target_tier=S1; target_title="S1: every registered node mounts on the canvas renderer"; next_tier=S2 ;;
            2) target_tier=S2; target_title="S2: every registered node mounts on the DOM renderer"; next_tier=S3 ;;
            3) target_tier=S3; target_title="S3: every registered node survives save and reload"; next_tier=S9 ;;
            9) target_tier=S9; target_title="S9: every self-sufficient node executes"; next_tier= ;;
          esac
          jq -e --arg title "$target_title" '.. | objects | select(.title? == $title) | .tests[] | select(.status == "unexpected")' custom-nodes-results.json >/dev/null
          for title in \
            "S1: every registered node mounts on the canvas renderer" \
            "S2: every registered node mounts on the DOM renderer" \
            "S9: every self-sufficient node executes" \
            "S3: every registered node survives save and reload" \
            ; do
            [ "$title" = "$target_title" ] && continue
            jq -e --arg title "$title" '.. | objects | select(.title? == $title) | .tests[] | select(.status == "expected")' custom-nodes-results.json >/dev/null || {
              echo "::error::$title did not pass independently of the deliberate $target_tier failure"
              exit 1
            }
          done
          mapfile -t tier_sessions < <(grep -oE '\[tier-session\] pid=[0-9]+ tier=S(1|2|3|9) pageId=[^ ]+' custom-nodes.log)
          [ "${#tier_sessions[@]}" -eq 4 ] || { echo "::error::$target_tier proof recorded ${#tier_sessions[@]} tier sessions, expected 4"; exit 1; }
          page_ids=$(printf '%s\n' "${tier_sessions[@]}" | sed -E 's/.* pageId=([^ ]+).*/\1/' | sort -u | wc -l | tr -d ' ')
          [ "$page_ids" = 4 ] || { echo "::error::$target_tier proof reused an application page between tiers"; exit 1; }
          pids=$(printf '%s\n' "${tier_sessions[@]}" | sed -E 's/.* pid=([0-9]+).*/\1/' | sort -u | wc -l | tr -d ' ')
          if [ -n "$next_tier" ]; then
            [ "$pids" = 2 ] || { echo "::error::$target_tier proof used $pids Playwright workers, expected the failed worker plus one replacement"; exit 1; }
            target_pid=$(printf '%s\n' "${tier_sessions[@]}" | sed -nE "s/.*pid=([0-9]+) tier=$target_tier .*/\\1/p")
            next_pid=$(printf '%s\n' "${tier_sessions[@]}" | sed -nE "s/.*pid=([0-9]+) tier=$next_tier .*/\\1/p")
            [ -n "$target_pid" ] && [ -n "$next_pid" ] && [ "$target_pid" != "$next_pid" ] || { echo "::error::$next_tier did not run in a replacement worker after $target_tier failed"; exit 1; }
          else
            [ "$pids" = 1 ] || { echo "::error::$target_tier is last but proof used $pids Playwright workers"; exit 1; }
          fi
          echo "$target_tier: real break failed; every other tier passed in its own fresh-page test"

      # Renders what ran and what it found - to the job log as an aligned
      # table and to the run's Summary panel as markdown - so a dispatch
      # answers "which branch, against what, with what verdict" without
      # opening the artifact.
      - name: Publish results table
        if: always()
        shell: bash
        env:
          BRANCH_TESTED: ${{ inputs.branch || github.ref_name }}
          COMFYUI_REF_USED: ${{ inputs.comfyui_ref || 'b08e6cf35fac50d3ca8470dffb3f9a1fbb7187d2' }}
          GREP_FILTER: ${{ inputs.grep }}
        run: python3 scripts/cicd/custom-nodes-summary.py

      - name: Upload Playwright report and raw diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && matrix.proof_row != '0' && format('playwright-report-custom-nodes-row{0}', matrix.proof_row) || 'playwright-report-custom-nodes' }}
          path: |
            playwright-report/
            custom-nodes-results.json
            custom-nodes.log
            tier-isolation-proof-evidence.txt
            tier-isolation-proof-identity.txt
          retention-days: 7
          if-no-files-found: warn
