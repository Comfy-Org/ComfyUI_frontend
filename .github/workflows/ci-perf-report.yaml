name: 'CI: Performance Report'

on:
  push:
    branches: [main, core/*]
  pull_request:
    branches-ignore: [wip/*, draft/*, temp/*]
  schedule:
    - cron: '17 8 * * *'

concurrency:
  group: perf-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.changes.outputs.should-run-e2e }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        uses: ./.github/actions/changes-filter

  perf-tests:
    needs: changes
    if: ${{ needs.changes.outputs.should-run == 'true' && github.repository == 'Comfy-Org/ComfyUI_frontend' }}
    runs-on: ubuntu-latest
    # main runs 3 repeats; one unsharded job took ~36m of a 45m limit
    timeout-minutes: 30
    name: perf-tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: localhost 1/3
            id: localhost-1
            shard: 1/3
          - name: localhost 2/3
            id: localhost-2
            shard: 2/3
          - name: localhost 3/3
            id: localhost-3
            shard: 3/3
          - name: cloud
            id: cloud
            cloud: true
    container:
      image: ghcr.io/comfy-org/comfyui-ci-container:0.0.28
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          include_build_step: true

      - name: Start ComfyUI server
        uses: ./.github/actions/start-comfyui-server

      # Cloud-only surfaces such as the Agent panel are compiled out of the
      # localhost production artifact. Build the cloud frontend before
      # measuring them instead of timing out against a UI that cannot
      # expose the workload.
      - name: Build cloud frontend for cloud performance tests
        if: matrix.cloud
        run: pnpm build:cloud
        env:
          VITE_USE_LEGACY_DEFAULT_GRAPH: 'true'

      # PRs run each test twice to expose noise; main runs 3× so the
      # baseline saved to perf-data has enough samples to median over noise.
      - name: Run performance tests
        id: perf
        continue-on-error: true
        env:
          DISTRIBUTION: ${{ matrix.cloud && 'cloud' || 'localhost' }}
          PERF_REPEAT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '3' || '2' }}
          PERF_GREP: ${{ matrix.cloud && '--grep' || '--grep-invert' }}
          PERF_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          args=(--project=performance --workers=1 --repeat-each="$PERF_REPEAT" "$PERF_GREP" @cloud)
          if [ -n "$PERF_SHARD" ]; then args+=(--shard="$PERF_SHARD"); fi
          pnpm exec playwright test "${args[@]}"

      - name: Upload shard perf metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-metrics-${{ matrix.id }}
          path: test-results/perf-metrics.json
          retention-days: 1
          if-no-files-found: warn

      - name: Fail if performance tests failed
        if: steps.perf.outcome == 'failure' && github.event_name == 'push'
        run: |
          echo "::error::Performance tests failed; partial metrics were saved when available."
          exit 1

      - name: Warn if performance tests failed on a PR
        if: steps.perf.outcome == 'failure' && github.event_name == 'pull_request'
        run: echo "::warning::Performance tests failed; the metrics may be incomplete."

  perf-report:
    needs: perf-tests
    if: ${{ always() && needs.perf-tests.result != 'skipped' && github.repository == 'Comfy-Org/ComfyUI_frontend' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download shard perf metrics
        uses: actions/download-artifact@v8
        with:
          pattern: perf-metrics-*
          path: /tmp/perf-shards

      - name: Merge shard perf metrics
        run: |
          mkdir -p test-results
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = process.argv[1];
            const files = fs.existsSync(root)
              ? [path.join(root, "perf-metrics.json"), ...fs.readdirSync(root).sort()
                  .map((dir) => path.join(root, dir, "perf-metrics.json"))]
              : [];
            const reports = files
              .filter((file) => fs.existsSync(file) && fs.statSync(file).isFile())
              .map((file) => JSON.parse(fs.readFileSync(file, "utf8")));
            if (reports.length === 0) process.exit(0);
            fs.writeFileSync("test-results/perf-metrics.json", JSON.stringify({
              ...reports[0],
              measurements: reports.flatMap((report) => report.measurements)
            }));
          ' /tmp/perf-shards

      - name: Upload perf metrics
        if: hashFiles('test-results/perf-metrics.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: perf-metrics
          path: test-results/perf-metrics.json
          retention-days: 30

      # Save whenever metrics exist, not only when every perf test passed.
      # Gating on a test step's success let a single failing test
      # silently kill the baseline pipeline for months (issue #15545).
      - name: Save perf baseline to perf-data branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('test-results/perf-metrics.json') != ''
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

          cp test-results/perf-metrics.json /tmp/perf-metrics.json

          git fetch origin perf-data || {
            echo "Creating perf-data branch"
            git checkout --orphan perf-data
            git rm -rf . 2>/dev/null || true
            echo "# Performance Baselines" > README.md
            mkdir -p baselines
            git add README.md baselines
            git commit -m "Initialize perf-data branch"
            git push origin perf-data
            git fetch origin perf-data
          }

          git worktree add /tmp/perf-data origin/perf-data

          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          mkdir -p /tmp/perf-data/baselines
          cp /tmp/perf-metrics.json "/tmp/perf-data/baselines/perf-${TIMESTAMP}-${SHA}.json"

          # Keep only last 20 baselines
          cd /tmp/perf-data
          ls -t baselines/perf-*.json 2>/dev/null | tail -n +21 | xargs -r rm

          git -C /tmp/perf-data add baselines/
          git -C /tmp/perf-data commit -m "perf: add baseline for ${SHA}" || echo "No changes to commit"
          git -C /tmp/perf-data push origin HEAD:perf-data

          git worktree remove /tmp/perf-data --force 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  perf-baseline-freshness:
    if: github.event_name == 'schedule' && github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    concurrency:
      group: perf-freshness
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check perf baseline freshness
        run: |
          if ! git fetch --depth=1 origin perf-data; then
            echo "::error::The perf-data branch could not be read."
            exit 1
          fi
          NEWEST=$(git log -1 --format=%ct FETCH_HEAD)
          NOW=$(date +%s)
          AGE_SECONDS=$(( NOW - NEWEST ))
          AGE_DAYS=$(( AGE_SECONDS / 86400 ))
          echo "Newest perf-data commit is ${AGE_DAYS} day(s) old"
          if [ "$AGE_SECONDS" -gt $(( 7 * 86400 )) ]; then
            echo "::error::Perf baseline is stale (${AGE_DAYS} days old). CI has not saved a baseline in seven days. Inspect performance workflow failures and issue #15545."
            exit 1
          fi
