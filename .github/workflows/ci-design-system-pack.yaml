name: 'CI: Design System Pack Check'

on:
  pull_request:
    branches-ignore: [wip/*, draft/*, temp/*]
    paths:
      - 'packages/design-system/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-pack-contents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Typecheck
        run: pnpm -C packages/design-system typecheck

      - name: Verify packed tarball only contains public design system files
        shell: bash
        run: |
          set -euo pipefail
          PACKED=$(pnpm -C packages/design-system pack --dry-run --json)
          jq -e --slurpfile manifest packages/design-system/package.json '
            [.files[].path] as $packed
            | [$manifest[0].exports[] | objects | .types | ltrimstr("./")]
              - $packed
            | if length == 0 then true
              else error("Missing declarations in tarball: " + join(", "))
              end
          ' <<< "$PACKED" > /dev/null
          UNEXPECTED=$(
            jq -r '
                .files[].path
                | select(
                    . != "package.json"
                    and . != "LICENSE"
                    and . != "README.md"
                    and . != "src/workspaceAvatar.ts"
                    and . != "src/button.variants.ts"
                    and . != "src/select.variants.ts"
                    and . != "src/tag.variants.ts"
                    and . != "dist-types/workspaceAvatar.d.ts"
                    and . != "dist-types/button.variants.d.ts"
                    and . != "dist-types/select.variants.d.ts"
                    and . != "dist-types/tag.variants.d.ts"
                    and (startswith("src/css/") | not)
                    and (startswith("src/icons/") | not)
                  )
              ' <<< "$PACKED"
          )
          if [ -n "$UNEXPECTED" ]; then
            echo "::error title=Unexpected files in tarball::Packed tarball contains files outside the public design system files:" >&2
            echo "$UNEXPECTED" >&2
            exit 1
          fi
          echo 'Packed tarball contains only expected files.'
