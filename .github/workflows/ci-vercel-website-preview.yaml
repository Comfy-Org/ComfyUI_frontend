---
name: 'CI: Vercel Website Preview'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches-ignore:
      - 'core/**'
      - 'cloud/**'
    paths:
      - 'apps/website/**'
      - 'packages/design-system/**'
      - 'packages/tailwind-utils/**'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/design-system/**'
      - 'packages/tailwind-utils/**'

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_WEBSITE_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_TOKEN }}
  VERCEL_SCOPE: comfyui

concurrency:
  group: ${{ github.event_name == 'push' && 'website-production' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ALIAS_HOST: comfy-website-preview-pr-${{ github.event.pull_request.number }}.vercel.app
      WORKSHOP_TEST_LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'workshop-test') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=preview

      - name: Write preview build identity
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -n \
            --arg repository "$BUILD_REPOSITORY" \
            --arg sha "$BUILD_SHA" \
            --arg runId "$BUILD_RUN_ID" \
            --arg runAttempt "$BUILD_RUN_ATTEMPT" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository: $repository, sha: $sha, runId: $runId, runAttempt: $runAttempt, builtAt: $builtAt}' \
            > apps/website/public/__build.json

      - name: Build project artifacts
        env:
          WEBSITE_ASHBY_API_KEY: ${{ secrets.WEBSITE_ASHBY_API_KEY }}
          WEBSITE_ASHBY_JOB_BOARD_NAME: ${{ secrets.WEBSITE_ASHBY_JOB_BOARD_NAME }}
          WEBSITE_CLOUD_API_KEY: ${{ secrets.WEBSITE_CLOUD_API_KEY }}
          WORKSHOP_IN_BUILD: '1'
          PUBLIC_WORKSHOP_AUTH_FLAG: '1'
          PUBLIC_WORKSHOP_ROUTER_RUN: '1'
          PUBLIC_WORKSHOP_CLOUD_ENV: ${{ contains(github.event.pull_request.labels.*.name, 'workshop-test') && 'test' || 'staging' }}
        run: NODE_ENV=production VERCEL_ENV=preview vercel build

      - name: Fetch head commit metadata
        id: head-commit
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            })
            const author = data.author?.login || data.commit.author?.name || ''
            const message = (data.commit.message || '').split('\n', 1)[0]
            core.setOutput('author', author)
            core.setOutput('message', message)

      - name: Deploy project artifacts to Vercel
        id: deploy
        env:
          GIT_COMMIT_REF: ${{ github.event.pull_request.head.ref }}
          GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_AUTHOR_LOGIN: ${{ steps.head-commit.outputs.author }}
          GIT_COMMIT_MESSAGE: ${{ steps.head-commit.outputs.message }}
          GIT_PR_ID: ${{ github.event.pull_request.number }}
          GIT_REPO: ${{ github.repository }}
        run: |
          URL=$(vercel deploy --prebuilt --archive=tgz \
            --meta githubCommitRef="$GIT_COMMIT_REF" \
            --meta githubCommitSha="$GIT_COMMIT_SHA" \
            --meta githubCommitAuthorLogin="$GIT_AUTHOR_LOGIN" \
            --meta githubCommitMessage="$GIT_COMMIT_MESSAGE" \
            --meta githubPrId="$GIT_PR_ID" \
            --meta githubRepo="$GIT_REPO")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify immutable preview identity
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in {1..30}; do
            ACTUAL_SHA=$(curl -fsS \
              -H 'Cache-Control: no-cache' \
              "$DEPLOY_URL/__build.json?run=$GITHUB_RUN_ID-$attempt" |
              jq -r '.sha // empty') || true
            if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Immutable preview did not serve expected SHA $EXPECTED_SHA"
          exit 1

      - name: Alias deployment to stable PR hostname
        id: alias-set
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel alias set "$DEPLOY_URL" "$ALIAS_HOST" --scope="$VERCEL_SCOPE"

      - name: Publish preview outputs
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          ALIAS_OK: ${{ steps.alias-set.outcome == 'success' }}
        run: |
          if [[ "$ALIAS_OK" == "true" ]]; then
            STABLE_URL="https://$ALIAS_HOST"
          else
            STABLE_URL="$DEPLOY_URL"
          fi
          if [[ "$WORKSHOP_TEST_LABELLED" == "true" ]]; then
            BUILD_NOTE="Models is built and gated by PostHog (workshop-enabled), using **test** Cloud."
          else
            BUILD_NOTE="Models is built and gated by PostHog (workshop-enabled), using **staging** Cloud."
          fi
          mkdir -p temp/vercel-preview
          echo "$DEPLOY_URL" > temp/vercel-preview/url.txt
          echo "$STABLE_URL" > temp/vercel-preview/stable-url.txt
          echo "$BUILD_NOTE" > temp/vercel-preview/build-note.txt
          {
            echo "**Preview:** $STABLE_URL"
            if [[ "$ALIAS_OK" == "true" ]]; then
              echo "**This commit:** $DEPLOY_URL"
            else
              echo "_Stable alias update failed — URL reflects this commit only._"
            fi
            echo "$BUILD_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview metadata
        uses: actions/upload-artifact@v6
        with:
          name: vercel-preview
          path: temp/vercel-preview

  deploy-production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production

      - name: Capture the current production deployment
        id: previous-production
        run: |
          ALIAS=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/comfy.org?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID")
          PREVIOUS_DEPLOYMENT_ID=$(jq -er '.deploymentId' <<< "$ALIAS")
          DEPLOYMENT=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$PREVIOUS_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID")
          PREVIOUS_DEPLOYMENT_URL=$(jq -er \
            --arg deploymentId "$PREVIOUS_DEPLOYMENT_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            'select(.id == $deploymentId and (.projectId // .project.id) == $projectId) | .url' \
            <<< "$DEPLOYMENT")
          PREVIOUS_SHA=$(curl -fsS \
            -H 'Cache-Control: no-cache' \
            "https://$PREVIOUS_DEPLOYMENT_URL/__build.json?before=$GITHUB_RUN_ID" |
            jq -r '.sha // empty') || true
          echo "deployment-id=$PREVIOUS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "sha=${PREVIOUS_SHA:-unavailable}" >> "$GITHUB_OUTPUT"

      - name: Write production build identity
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -n \
            --arg repository "$BUILD_REPOSITORY" \
            --arg sha "$BUILD_SHA" \
            --arg runId "$BUILD_RUN_ID" \
            --arg runAttempt "$BUILD_RUN_ATTEMPT" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository: $repository, sha: $sha, runId: $runId, runAttempt: $runAttempt, builtAt: $builtAt}' \
            > apps/website/public/__build.json

      - name: Verify WEBSITE_CLOUD_API_KEY is present for production build
        env:
          WEBSITE_CLOUD_API_KEY: ${{ secrets.WEBSITE_CLOUD_API_KEY }}
        run: |
          if [ -z "${WEBSITE_CLOUD_API_KEY:-}" ]; then
            echo "::error title=Missing WEBSITE_CLOUD_API_KEY::Production builds require WEBSITE_CLOUD_API_KEY so /cloud/supported-nodes is generated from fresh Cloud API data. Add it as a GitHub Actions repo secret and to the Vercel project environment. See apps/website/README.md."
            exit 1
          fi

      - name: Build project artifacts
        env:
          WEBSITE_ASHBY_API_KEY: ${{ secrets.WEBSITE_ASHBY_API_KEY }}
          WEBSITE_ASHBY_JOB_BOARD_NAME: ${{ secrets.WEBSITE_ASHBY_JOB_BOARD_NAME }}
          WEBSITE_CLOUD_API_KEY: ${{ secrets.WEBSITE_CLOUD_API_KEY }}
          WORKSHOP_IN_BUILD: '1'
          PUBLIC_WORKSHOP_ROUTER_RUN: '1'
          PUBLIC_WORKSHOP_CLOUD_ENV: prod
          WEBSITE_INDEXABLE: '1'
        run: NODE_ENV=production VERCEL_ENV=production vercel build --prod

      - name: Verify the production build is indexable
        run: |
          INDEX=.vercel/output/static/index.html
          if [ ! -f "$INDEX" ]; then
            echo "::error title=Production build output missing::$INDEX was not built, so indexability cannot be checked."
            exit 1
          fi
          if grep -q 'name="robots"' "$INDEX"; then
            echo "::error title=Production build is noindex::$INDEX has a robots meta. VERCEL_ENV=production did not reach the Astro build. See apps/website/src/config/indexing.ts."
            exit 1
          fi

      - name: Deploy project artifacts to Vercel
        id: deploy
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
          GIT_REPO: ${{ github.repository }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz \
            --meta githubCommitSha="$GIT_COMMIT_SHA" \
            --meta githubRepo="$GIT_REPO" \
            --meta githubRunId="$GITHUB_RUN_ID")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify immutable and canonical production identity
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        timeout-minutes: 12
        run: |
          verify_marker() {
            local base_url="$1"
            local attempts="$2"
            local delay="$3"
            for ((attempt = 1; attempt <= attempts; attempt += 1)); do
              if MARKER=$(curl -fsS \
                -H 'Cache-Control: no-cache' \
                "${base_url%/}/__build.json?run=$GITHUB_RUN_ID-$attempt") &&
                jq -e \
                  --arg sha "$EXPECTED_SHA" \
                  --arg runId "$EXPECTED_RUN_ID" \
                  --arg runAttempt "$EXPECTED_RUN_ATTEMPT" \
                  '.sha == $sha and .runId == $runId and .runAttempt == $runAttempt' \
                  <<< "$MARKER" >/dev/null; then
                return 0
              fi
              sleep "$delay"
            done
            return 1
          }

          verify_marker "$DEPLOY_URL" 30 5 || {
            echo "::error::Immutable deployment did not serve expected SHA $EXPECTED_SHA"
            exit 1
          }
          verify_marker https://comfy.org 60 10 || {
            echo "::error::Canonical production did not promote expected SHA $EXPECTED_SHA"
            exit 1
          }
          curl -fsS -o /dev/null https://comfy.org/

      - name: Retain production transition evidence
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous-production.outputs.deployment-id }}
          PREVIOUS_SHA: ${{ steps.previous-production.outputs.sha }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          DEPLOYMENT_HOST=${DEPLOY_URL#https://}
          if [[ ! "$DEPLOYMENT_HOST" =~ ^[A-Za-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error::Unexpected immutable deployment URL: $DEPLOY_URL"
            exit 1
          fi
          DEPLOYMENT=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_HOST?teamId=$VERCEL_ORG_ID")
          DEPLOYED_DEPLOYMENT_ID=$(jq -er \
            --arg projectId "$VERCEL_PROJECT_ID" \
            'select((.projectId // .project.id) == $projectId) | .id' \
            <<< "$DEPLOYMENT")
          mkdir -p temp/website-production-transition
          jq -n \
            --arg previousDeploymentId "$PREVIOUS_DEPLOYMENT_ID" \
            --arg previousSha "$PREVIOUS_SHA" \
            --arg deployedDeploymentId "$DEPLOYED_DEPLOYMENT_ID" \
            --arg deploymentUrl "$DEPLOY_URL" \
            --arg deployedSha "$DEPLOYED_SHA" \
            --arg runId "$GITHUB_RUN_ID" \
            '{previousDeploymentId: $previousDeploymentId, previousSha: $previousSha, deployedDeploymentId: $deployedDeploymentId, deploymentUrl: $deploymentUrl, deployedSha: $deployedSha, runId: $runId}' \
            > temp/website-production-transition/transition.json
          {
            echo "**Production:** $DEPLOY_URL"
            echo "**Deployment ID:** $DEPLOYED_DEPLOYMENT_ID"
            echo "**Deployed SHA:** $DEPLOYED_SHA"
            echo "**Previous deployment:** $PREVIOUS_DEPLOYMENT_ID"
            echo "**Previous SHA:** $PREVIOUS_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production transition evidence
        uses: actions/upload-artifact@v6
        with:
          name: website-production-transition
          path: temp/website-production-transition/transition.json
          retention-days: 7
          if-no-files-found: error
