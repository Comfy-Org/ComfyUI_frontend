name: Validate Action SHA Pins

on:
  # pull_request builds against the base at event time, so a stale base can merge
  # green; push re-validates the merged tip. Not a required check, so a
  # merge_group run could never block a candidate and only cost a runner.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.pinact.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.pinact.yaml'

permissions:
  contents: read

jobs:
  validate-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: suzuki-shunsuke/pinact-action@3d49c6412901042473ffa78becddab1aea46bbea # v1.3.1
        with:
          skip_push: 'true'
