name: Validate Action SHA Pins

on:
  # pull_request builds against the base at event time, so a stale base can merge
  # green; merge_group rebuilds against main's tip and push catches queue bypasses.
  merge_group:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.pinact.yaml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.pinact.yaml'

permissions:
  contents: read

jobs:
  validate-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          skip_push: 'true'
