name: Validate Action SHA Pins

on:
  # pull_request builds against the base at event time, so a stale base can merge
  # green; push re-validates the merged tip. Not a required check, so a
  # merge_group run could never block a candidate and only cost a runner.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.pinact.yaml'
      - 'scripts/check-action-versions.ts'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.pinact.yaml'
      - 'scripts/check-action-versions.ts'

permissions:
  contents: read

jobs:
  validate-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: 'false'
          skip_push: 'true'

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - run: node scripts/check-action-versions.ts
