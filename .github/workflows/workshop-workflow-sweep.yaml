name: 'Workshop: Workflow Sweep'

on:
  schedule:
    - cron: '29 */6 * * *'
    - cron: '41 8 * * *'
  workflow_dispatch:
    inputs:
      execute:
        description: Run every published workflow's defaults on Cloud (paid)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PUBLIC_WORKSHOP_CLOUD_ENV: prod
  SWEEP_EXECUTE: ${{ github.event.schedule == '41 8 * * *' || inputs.execute == true }}

concurrency:
  group: workshop-live-prod
  cancel-in-progress: false
  queue: max

jobs:
  sweep:
    name: Published workflow pages
    if: github.repository == 'Comfy-Org/ComfyUI_frontend' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: workshop-prod
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Check pages, graphs and media, then run defaults when scheduled
        working-directory: apps/website
        env:
          COMFY_API_KEY: ${{ secrets.WORKSHOP_WORKFLOW_API_KEY || secrets.WORKSHOP_ROUTER_API_KEY }}
        run: |
          args=(--output "$RUNNER_TEMP/workflow-sweep")
          if [ "$SWEEP_EXECUTE" = true ]; then
            args+=(--execute --concurrency 4 --repeat workflows/product-photo-to-video=3)
          fi
          pnpm test:workflow-pages "${args[@]}"
      - name: Publish workflow report
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/workflow-sweep/workflow-sweep.md" ]; then
            cat "$RUNNER_TEMP/workflow-sweep/workflow-sweep.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish workflow evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: workshop-workflow-sweep-${{ github.run_id }}
          path: ${{ runner.temp }}/workflow-sweep/
          if-no-files-found: error
          retention-days: 30
