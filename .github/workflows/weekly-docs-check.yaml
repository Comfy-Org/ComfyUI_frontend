# Description: Automated weekly documentation accuracy check and update via Claude
name: 'Weekly Documentation Check'

permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  docs-check:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 50
          ref: main

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_cache: 'false'

      - name: Run Claude Documentation Review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          prompt: |
            Verify the repository's markdown against the current code and remove what has gone stale.
            Prefer deleting or trimming over rewriting. Do not add new documentation.

            INSTRUCTIONS:
            1. Run `pnpm markdown-references:check`. For each reported path or pnpm command, point the
               reference at the file or script that clearly replaced it; otherwise delete the stale
               sentence, list item, table row, or section.
            2. Fact-check docs/**/*.md, AGENTS.md and README.md files, and the skills, commands, and
               checks under .claude/ and .agents/ against the code. Look for:
               - Removed or renamed APIs, components, stores, settings, and configuration
               - Code examples that no longer match the code they describe
               - Instructions that contradict the implementation or the root AGENTS.md
            3. Fix each verified inaccuracy with the smallest edit that makes it true.
            4. Delete content that restates what the code already says or that goes stale quickly:
               file inventories, directory trees, counts, line numbers, and lists of components
               or exports.
            5. Do not document undocumented features, add sections, or create files. Do not modify
               source code.
            6. Leave anything you cannot verify unchanged and list it in the PR body.
            7. Run `pnpm markdown-references:check` again. No finding may remain in a file you edited.

            After making all changes, write a PR body to /tmp/pr-body-${{ github.run_id }}.md:
            - ## Summary: bullet points of what was trimmed, deleted, or corrected, and why each was stale
            - ## Unverified: claims you could not confirm and left unchanged
            If no changes were needed, write a brief message stating documentation is up to date.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 256 --allowedTools 'Bash(git status),Bash(git diff),Bash(git log),Bash(pnpm:*),Bash(npm:*),Bash(node:*),Bash(tsc:*),Bash(echo:*),Read,Write,Edit,Glob,Grep'"
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes needed"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected"
          fi

      - name: Create default PR body if not generated
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          if [ ! -f /tmp/pr-body-${{ github.run_id }}.md ]; then
            cat > /tmp/pr-body-${{ github.run_id }}.md <<'EOF'
          ## Automated Documentation Review

          This PR contains documentation updates identified by the weekly automated review.

          ### Review Process
          - `pnpm markdown-references:check` over all markdown
          - Fact-checking against the current codebase
          - Trimming or deleting stale content instead of adding new documentation

          ### What was checked
          - All markdown documentation in `docs/`
          - Project guidelines in `AGENTS.md`
          - README files throughout the repository
          - Skills, commands, and checks under `.claude/` and `.agents/`

          **Note**: This is an automated PR. Please review all changes carefully before merging.

          🤖 Generated by weekly documentation check workflow
          EOF
          fi

      - name: Create or Update Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          commit-message: 'docs: weekly documentation accuracy update'
          branch: docs/weekly-update
          delete-branch: true
          title: 'docs: Weekly Documentation Update'
          body-path: /tmp/pr-body-${{ github.run_id }}.md
          labels: |
            documentation
            automated
          draft: true
