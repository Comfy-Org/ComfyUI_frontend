name: i18n Update Nodes

on:
  workflow_dispatch:
    inputs:
      trigger_type:
        description: 'Type of trigger (manual or automatic)'
        required: false
        type: string
        default: 'manual'

jobs:
  update-locales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          include_build_step: true
      # Setup playwright environment
      - name: Setup ComfyUI Server (and start)
        uses: ./.github/actions/setup-comfyui-server
        with:
          launch_server: true
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Start dev server
        # Run electron dev server as it is a superset of the web dev server
        # We do want electron specific UIs to be translated.
        run: pnpm dev:electron &
      - name: Update en.json
        run: pnpm collect-i18n -- scripts/collect-i18n-node-defs.ts
        env:
          PLAYWRIGHT_TEST_URL: http://localhost:5173
      - name: Update translations
        run: pnpm locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          commit-message: 'test: demonstrate automated R0 grading'
          title: 'test: demonstrate automated R0 grading'
          body: |
            ## Summary

            Bot-authored, runbook-shaped test change stacked on #14889 to demonstrate all three R0 axes.

            - Path floor: R0 (`*.test.ts` and optional `src/locales/**` only)
            - Provenance: R0 (`comfy-pr-bot` plus the registered `r0-locale-demo` shape)
            - Reversibility: R0 (test touched, clean revert, green checks required)

            Test-only screenshot: N/A, test-only.

            Created by Codex
          branch: demo/risk-r0-locale-${{ github.run_id }}
          base: ci/pr-risk-grading
          labels: automated
          draft: true
