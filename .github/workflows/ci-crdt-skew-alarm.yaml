name: 'CI: CRDT Skew Alarm'

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CMP_PACKAGE: '@comfyorg/comfy-multi-player'
  CRDT_TEST_DIR: src/workbench/extensions/agent/crdt/

jobs:
  skew-alarm:
    name: follower suite against ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: [workspace, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Install workspace
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Resolve published release
        id: release
        run: |
          version="$(npm view "$CMP_PACKAGE@latest" version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install published baseline
        if: matrix.source == 'release'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node .github/scripts/crdt-skew-override.mjs --spec "$RELEASE_VERSION"
          pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify resolved package
        env:
          SOURCE: ${{ matrix.source }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, realpathSync } from 'node:fs'
          import { resolve } from 'node:path'
          const installed = realpathSync('node_modules/' + process.env.CMP_PACKAGE)
          const local = resolve('packages/comfy-multi-player')
          assert.equal(installed === local, process.env.SOURCE === 'workspace')
          const manifest = JSON.parse(readFileSync(installed + '/package.json', 'utf8'))
          if (process.env.SOURCE === 'release') assert.equal(manifest.version, process.env.RELEASE_VERSION)
          console.log(process.env.SOURCE, manifest.version, installed)
          NODE

      - name: Run the agent CRDT follower suite
        id: tests
        continue-on-error: true
        run: pnpm test:unit --reporter=json --outputFile="$RUNNER_TEMP/vitest.json" "$CRDT_TEST_DIR"

      - name: Publish pass/fail counts
        id: verdict
        if: ${{ !cancelled() }}
        env:
          CMP_SHA: ${{ github.sha }}
          CMP_SPEC: ${{ matrix.source }}
          PINNED_VERSION: ${{ steps.release.outputs.version }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          node .github/scripts/crdt-skew-report.mjs \
            --report "$RUNNER_TEMP/vitest.json" \
            --out "$RUNNER_TEMP/crdt-skew-alarm.json"

      - name: Upload the skew report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: crdt-skew-alarm-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/crdt-skew-alarm.json
            ${{ runner.temp }}/vitest.json
          retention-days: 30
          if-no-files-found: warn

      - name: Ring the alarm
        if: ${{ !cancelled() && steps.verdict.outputs.verdict != 'no-skew-signal' }}
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          SOURCE: ${{ matrix.source }}
        run: |
          echo "::error::$SOURCE comparison: $VERDICT"
          exit 1
