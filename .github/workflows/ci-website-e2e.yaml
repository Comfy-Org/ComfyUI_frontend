name: 'CI: Website E2E'

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [wip/*, draft/*, temp/*]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app-website-changes: ${{ steps.changes.outputs.app-website-changes }}
      packages-changes: ${{ steps.changes.outputs.packages-changes }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        uses: ./.github/actions/changes-filter

  website-e2e-shard:
    needs: changes
    if: ${{ needs.changes.outputs.app-website-changes == 'true' || needs.changes.outputs.packages-changes == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_cache: 'false'

      - name: Build website
        env:
          NODE_ENV: production
          WORKSHOP_IN_BUILD: '1'
          PUBLIC_WORKSHOP_ROUTER_RUN: '1'
          PUBLIC_WORKSHOP_CLOUD_ENV: test
          WEBSITE_GITHUB_STARS_OVERRIDE: 110000
          # Un-hides the mobile download email form so e2e can exercise it;
          # requests are intercepted in the specs, the key is never contacted.
          PUBLIC_CUSTOMERIO_WRITE_KEY: test-e2e-write-key
        run: pnpm --filter @comfyorg/website build

      - name: Run Playwright tests (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        id: tests
        run: pnpm --filter @comfyorg/website test:e2e --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: ${{ github.workspace }}/apps/website/blob-report

      - name: Upload blob report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: website-blob-report-${{ matrix.shardIndex }}
          path: apps/website/blob-report/
          if-no-files-found: error
          retention-days: 1

  website-e2e-report:
    needs: [changes, website-e2e-shard]
    if: ${{ always() && (needs.changes.outputs.app-website-changes == 'true' || needs.changes.outputs.packages-changes == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      test-outcome: ${{ steps.outcome.outputs.result }}
      report-url: ${{ steps.deploy.outputs.url }}
      screenshot-failures: ${{ steps.failures.outputs.screenshot }}
      other-failures: ${{ steps.failures.outputs.other }}
      is-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        run: corepack enable && corepack prepare

      - name: Download blob reports
        id: blob-reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: apps/website/all-blob-reports
          pattern: website-blob-report-*
          merge-multiple: true

      - name: Validate and merge blob reports
        id: outcome
        working-directory: apps/website
        env:
          SHARDS_RESULT: ${{ needs.website-e2e-shard.result }}
          BLOB_REPORTS_OUTCOME: ${{ steps.blob-reports.outcome }}
        run: ../../scripts/cicd/prepare-website-e2e-report.sh all-blob-reports 4

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && needs.website-e2e-shard.result != 'cancelled' && steps.outcome.outputs.result != 'infrastructure' }}
        with:
          name: website-playwright-report
          path: |
            apps/website/playwright-report/
            apps/website/results.json
            apps/website/test-results/
          retention-days: 30

      - name: Deploy report to Cloudflare
        id: deploy
        if: >-
          ${{
            always() &&
            needs.website-e2e-shard.result != 'cancelled' &&
            steps.outcome.outputs.result != 'infrastructure' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.fork == false
            )
          }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH=$(echo "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g;s/--*/-/g;s/^-\|-$//g')
          DEPLOY_OK=false
          for i in 1 2 3; do
            echo "Deployment attempt $i of 3..."
            OUTPUT=$(pnpx wrangler@^4.0.0 pages deploy apps/website/playwright-report \
              --project-name=comfyui-website-e2e \
              --branch="$BRANCH" 2>&1) && { DEPLOY_OK=true; break; } || echo "$OUTPUT"
            [ "$i" -lt 3 ] && sleep 10
          done
          echo "$OUTPUT"
          if [ "$DEPLOY_OK" != "true" ]; then
            echo "::error::All 3 deployment attempts failed"
            exit 1
          fi
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev\S*' | head -1)
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Categorize failures
        id: failures
        if: always() && needs.website-e2e-shard.result != 'cancelled' && steps.outcome.outputs.result == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const report = JSON.parse(fs.readFileSync('apps/website/results.json', 'utf8'))

            function isFailed(t) { return t.status === 'unexpected' || t.status === 'flaky' }
            function isVisual(spec) {
              return spec.file?.includes('visual') ||
                spec.tests?.some(t => t.results?.some(r => r.error?.message?.includes('toHaveScreenshot')))
            }
            function specsOf(suite) {
              return [
                ...(suite.specs || []),
                ...(suite.suites || []).flatMap(specsOf)
              ]
            }

            const failed = specsOf(report)
              .flatMap(spec => (spec.tests || [])
              .filter(isFailed)
              .map(() => isVisual(spec)))

            const screenshotFailures = failed.filter(Boolean).length
            core.setOutput('screenshot', screenshotFailures)
            core.setOutput('other', failed.length - screenshotFailures)

      - name: Write job summary
        if: always() && needs.website-e2e-shard.result != 'cancelled'
        uses: actions/github-script@v9
        env:
          TEST_OUTCOME: ${{ steps.outcome.outputs.result }}
          REPORT_URL: ${{ steps.deploy.outputs.url }}
          SCREENSHOT_FAILURES: ${{ steps.failures.outputs.screenshot }}
          OTHER_FAILURES: ${{ steps.failures.outputs.other }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME
            const passed = outcome === 'success'
            const infrastructure = outcome === 'infrastructure'
            const reportUrl = process.env.REPORT_URL
            const screenshotFailures = parseInt(process.env.SCREENSHOT_FAILURES) || 0
            const otherFailures = parseInt(process.env.OTHER_FAILURES) || 0

            const lines = ['## 🌐 Website E2E', '']

            if (passed) {
              lines.push('> [!TIP]', '> All tests passed.')
            } else if (infrastructure) {
              lines.push(
                '> [!CAUTION]',
                '> A shard failed before producing a report, so the suite did not fully run. No pass/fail counts are available.'
              )
            } else {
              lines.push('> [!CAUTION]', '> Some tests failed.')
            }

            const rows = [
              ['Status', passed ? '✅ Passed' : infrastructure ? '💥 Infrastructure failure' : '❌ Failed'],
              ['Report', reportUrl ? `[View Report](${reportUrl})` : '_unavailable_']
            ]
            if (!passed && !infrastructure) {
              rows.push(
                ['Screenshot diffs', String(screenshotFailures)],
                ['Other failures', String(otherFailures)]
              )
            }
            lines.push(
              '',
              '| | |',
              '|---|---|',
              ...rows.map(([k, v]) => `| **${k}** | ${v} |`)
            )

            await core.summary.addRaw(lines.join('\n')).write()

  website-e2e:
    if: ${{ always() }}
    needs: [changes, website-e2e-shard, website-e2e-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check website E2E result
        env:
          SHOULD_RUN: ${{ needs.changes.outputs.app-website-changes == 'true' || needs.changes.outputs.packages-changes == 'true' }}
          SHARD_RESULT: ${{ needs.website-e2e-shard.result }}
          REPORT_RESULT: ${{ needs.website-e2e-report.result }}
          TEST_OUTCOME: ${{ needs.website-e2e-report.outputs.test-outcome }}
        run: scripts/cicd/check-website-e2e-result.sh

  post-starting-comment:
    needs: changes
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork == false
      && (needs.changes.outputs.app-website-changes == 'true' || needs.changes.outputs.packages-changes == 'true')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    concurrency:
      group: website-pr-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/upsert-comment-section
        with:
          pr-number: ${{ github.event.pull_request.number }}
          section-name: e2e
          comment-marker: '<!-- COMFYUI_FRONTEND_PR_REPORT -->'
          token: ${{ secrets.GITHUB_TOKEN }}
          section-content: |-
            ## 🌐 Website E2E
            <!-- WEBSITE_E2E_STATUS -->

            > [!NOTE]
            > Tests are running… [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  post-result-comment:
    needs: website-e2e-report
    if: always() && !cancelled() && needs.website-e2e-report.outputs.is-pr == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    concurrency:
      group: website-pr-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Build e2e section content
        id: content
        uses: actions/github-script@v9
        env:
          TEST_OUTCOME: ${{ needs.website-e2e-report.outputs.test-outcome }}
          REPORT_URL: ${{ needs.website-e2e-report.outputs.report-url }}
          SCREENSHOT_FAILURES: ${{ needs.website-e2e-report.outputs.screenshot-failures }}
          OTHER_FAILURES: ${{ needs.website-e2e-report.outputs.other-failures }}
        with:
          script: |
            const outcome = process.env.TEST_OUTCOME
            const passed = outcome === 'success'
            const infrastructure = outcome === 'infrastructure'
            const reportUrl = process.env.REPORT_URL
            const screenshotFailures = parseInt(process.env.SCREENSHOT_FAILURES) || 0
            const otherFailures = parseInt(process.env.OTHER_FAILURES) || 0

            const lines = ['## 🌐 Website E2E', '<!-- WEBSITE_E2E_STATUS -->', '']

            if (passed) {
              lines.push('> [!TIP]', '> All tests passed.')
            } else if (infrastructure) {
              lines.push(
                '> [!CAUTION]',
                '> A shard failed before producing a report, so the suite did not fully run. No pass/fail counts are available.'
              )
            } else {
              lines.push('> [!CAUTION]', '> Some tests failed.')
            }

            const rows = [
              ['Status', passed ? '✅ Passed' : infrastructure ? '💥 Infrastructure failure' : '❌ Failed'],
              ['Report', reportUrl ? `[View Report](${reportUrl})` : '_unavailable_']
            ]
            if (!passed && !infrastructure) {
              rows.push(
                ['Screenshot diffs', String(screenshotFailures)],
                ['Other failures', String(otherFailures)]
              )
            }
            lines.push(
              '',
              '| | |',
              '|---|---|',
              ...rows.map(([k, v]) => `| **${k}** | ${v} |`)
            )

            if (screenshotFailures > 0) {
              const s = screenshotFailures === 1 ? '' : 's'
              lines.push('', `- [ ] Update website screenshots (${screenshotFailures} screenshot diff${s})`)
            }
            if (otherFailures > 0) {
              lines.push(
                '',
                '> [!WARNING]',
                `> ${otherFailures} non-screenshot failure${otherFailures === 1 ? '' : 's'} — these require manual review.`
              )
            }

            core.setOutput('section-content', lines.join('\n'))

      - uses: ./.github/actions/upsert-comment-section
        with:
          pr-number: ${{ github.event.pull_request.number }}
          section-name: e2e
          comment-marker: '<!-- COMFYUI_FRONTEND_PR_REPORT -->'
          token: ${{ secrets.GITHUB_TOKEN }}
          section-content: ${{ steps.content.outputs.section-content }}
