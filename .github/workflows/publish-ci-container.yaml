name: Publish CI container

on:
  push:
    branches: [main]
    paths: ['tools/ci-container/VERSION']
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full main commit SHA to recover (empty = current main)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish-ci-container
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Comfy-Org/ComfyUI_frontend' &&
      github.ref == 'refs/heads/main' &&
      vars.CI_CONTAINER_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select reviewed source
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$REVISION" origin/main
          cp tools/ci-container/publish.sh "$RUNNER_TEMP/publish-ci-container.sh"
          git checkout --detach "$REVISION"

      - name: Free space for image layers
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_cache: 'false'

      - name: Build frontend
        run: pnpm exec vite build
        env:
          DISTRIBUTION: localhost
          VITE_USE_LEGACY_DEFAULT_GRAPH: 'true'

      - name: Publish or recover verified image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          bash "$RUNNER_TEMP/publish-ci-container.sh"
