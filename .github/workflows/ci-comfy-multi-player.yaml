# Description: Gates for @comfyorg/comfy-multi-player (packages/comfy-multi-player),
# imported from the standalone repository's ci.yml. The step names and commands
# are a contract shared with publish-comfy-multi-player.yaml and pinned by
# packages/comfy-multi-player/test/ci-release-contract.test.ts and the CodeRabbit
# rule generated from packages/comfy-multi-player/.agents/checks/purity.md.
name: 'CI: comfy-multi-player'

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permutation-exhaustive:
    name: exhaustive op-pool permutations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/comfy-multi-player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Exhaustive permutations
        run: pnpm run test:exhaustive

  ci:
    name: build / purity / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/comfy-multi-player
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify conformance corpus
        run: pnpm run verify:corpus

      - name: Build
        run: pnpm run build

      - name: Verify package contents
        run: pnpm run verify:package

      - name: Type-check gate
        run: pnpm run typecheck

      - name: Lint gate
        run: pnpm run lint

      - name: Purity gate
        run: pnpm run check:purity

      - name: Statelessness gate
        run: pnpm run check:stateless

      - name: Profile-claim staleness gate
        run: pnpm run check:profile-claims

      # The root .coderabbit.yaml carries a generated region of path_instructions
      # built from the <!-- coderabbit-instructions --> blocks in the package's
      # .agents/checks/*.md. This fails when the committed region no longer
      # matches them. CodeRabbit reads the config at the PR head, so a drifted
      # config still reviews the PR that drifted it — this blocks the merge, it
      # does not prevent the drift.
      - name: CodeRabbit config drift gate
        run: pnpm run check:coderabbit

      # Module-graph gate. Exits 2 (INCONCLUSIVE) rather than green when it
      # cruises too few modules to mean anything — see .agents/checks/import-graph.md.
      - name: Import-graph gate
        run: pnpm run check:imports

      # Offline only: asserts the citation sites and docs/upstream-pins.json
      # agree on one SHA and that nothing cites upstream by a moving branch.
      # Reachability of each pinned SHA needs the network and is a maintainer
      # step (`pnpm run check:pins --verify-remote`), because a check that
      # cannot reach GitHub must report INCONCLUSIVE rather than pass.
      - name: Citation-pin gate (FC-10)
        run: pnpm run check:pins

      - name: Tests
        # check:stateless already runs this behavioral probe explicitly.
        # No `--`: pnpm forwards it literally, after which vitest ignores --exclude.
        run: pnpm test --exclude test/stateless.test.ts

      - name: Clock ordering matrix
        run: pnpm run test:clock-matrix
