name: 'PR: Marketing Storybook Preview'

on:
  workflow_run:
    workflows: ['CI: Marketing Storybook Preview']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.repository == 'Comfy-Org/ComfyUI_frontend' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve current PR
        id: pr
        uses: ./.github/actions/resolve-pr-from-workflow-run
      - uses: actions/download-artifact@v8
        if: steps.pr.outputs.skip != 'true'
        with:
          name: marketing-storybook-static
          path: marketing-storybook-static
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate static preview
        if: steps.pr.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('marketing-storybook-static')
          assert (root / 'iframe.html').is_file()
          assert json.loads((root / 'build-info.json').read_text())['commit'] == os.environ['SOURCE_SHA']
          assert not any(path.name in {'_worker.js', 'functions', 'wrangler.toml', 'wrangler.json', 'wrangler.jsonc'} or path.is_symlink() for path in root.rglob('*'))
          PY
      - uses: actions/setup-node@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        if: steps.pr.outputs.skip != 'true'
        with:
          version: 11.13.1
          run_install: false
      - name: Deploy isolated preview
        if: steps.pr.outputs.skip != 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SOURCE_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          set -o pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Marketing preview requires the existing Cloudflare Pages credentials.'
            exit 1
          fi
          pnpm dlx wrangler@4 pages deploy marketing-storybook-static \
            --project-name=comfy-storybook --branch="marketing-pr-$PR_NUMBER" \
            --commit-hash="$SOURCE_SHA" 2>&1 | tee marketing-deploy.log
          URL=$(sed -n 's/.*\(https:\/\/[^ ]*\.pages.dev\).*/\1/p' marketing-deploy.log | head -1)
          [[ "$URL" =~ ^https://[a-zA-Z0-9.-]+\.pages\.dev$ ]]
          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"
          printf '{"commit":"%s","url":"%s"}\n' "$SOURCE_SHA" "$URL" > marketing-preview.json
          printf '### Marketing Storybook\n[Component catalog preview](%s)\nSource commit: `%s`\n' "$URL" "$SOURCE_SHA" > marketing-preview.md
      - uses: actions/upload-artifact@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          name: marketing-storybook-preview
          path: marketing-preview.json
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/post-pr-report-comment
        if: steps.pr.outputs.skip != 'true'
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          report-file: marketing-preview.md
          comment-marker: '<!-- COMFYUI_MARKETING_STORYBOOK_PREVIEW -->'
          token: ${{ github.token }}
