# Description: Refreshes the apps/website Ashby roles and cloud nodes
# snapshots and opens a PR. Merging the PR triggers the existing Vercel
# website production deploy via ci-vercel-website-preview.yaml.
#
# The `ashby-webhook` dispatch source is the Comfy-Org/comfy-router Worker
# serving comfy.org/api/webhooks/ashby, which calls this workflow's dispatch
# endpoint when Ashby reports a job posting change.
name: 'Release: Website'

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'What triggered this run'
        required: false
        default: manual
        type: choice
        # Comfy-Org/comfy-router sends `ashby-webhook` verbatim. Renaming or
        # removing that option makes GitHub reject its dispatch with a 422,
        # and nothing in this repo would report it.
        options:
          - manual
          - ashby-webhook

concurrency:
  group: release-website
  # GitHub keeps at most one running and one pending run per group, so a burst
  # of Ashby events collapses into a single follow-up run. Cancelling instead
  # would risk killing a run between pushing the branch and opening the PR.
  cancel-in-progress: false

jobs:
  refresh-snapshots:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      # The webhook fires on the event; the job board API this workflow reads
      # is a separate surface that trails it. It answers
      # `max-age=60, stale-while-revalidate=60`, so an edge hit can serve
      # pre-change data for 120s — hence 120 rather than 60. Ashby documents
      # no bound on its own emitter-to-read-model lag, so this does not
      # guarantee freshness. If it proves short the symptom is a run that
      # fetches pre-change data, writes nothing, and leaves the committed
      # snapshot behind until the next Ashby event or manual run; the step at
      # the end of this job annotates that case. The live careers page is
      # unaffected either way: it re-fetches Ashby on every production build.
      - name: Let the Ashby job board catch up
        if: inputs.source == 'ashby-webhook'
        run: sleep 120

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Compare against whatever the open refresh PR already proposes, not
      # against main, so a run that changes nothing leaves that PR alone. This
      # only establishes the baseline; the "Decide" step below is what stops
      # the run reaching create-pull-request, which rebuilds the branch from
      # current main and force-pushes whenever the two trees differ — and on
      # this repo main moves dozens of commits between runs, so it always
      # differs, snapshots or no snapshots.
      - name: Adopt the open refresh branch as the comparison baseline
        env:
          BRANCH: chore/refresh-website-snapshots
          GH_TOKEN: ${{ github.token }}
        run: |
          # `ls-remote --exit-code` answers 2 for "no such branch" and
          # something else for "could not ask". Treating those alike would let
          # a network blip silently reinstate main as the baseline and
          # force-push the churn this step exists to avoid.
          set +e
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null
          probe=$?
          set -e
          if [ "$probe" -eq 2 ]; then
            echo "No refresh branch; comparing against main."
            exit 0
          fi
          if [ "$probe" -ne 0 ]; then
            echo "::error title=Could not check for a refresh branch::git ls-remote exited $probe. Refusing to continue, because falling back to main would force-push a timestamp-only update over the open PR."
            exit 1
          fi
          # Closing a PR does not delete its branch, and neither does merging
          # unless the repo auto-deletes. Adopting a branch with no open PR
          # would make the refreshed data match the baseline, skip the PR step,
          # and leave main stale on a green run — the exact silent staleness
          # this workflow exists to end.
          #
          # Captured the same way as the ls-remote probe above, and for the
          # same reason: an empty result from a failed `gh` is not the same
          # answer as an empty result from a successful one.
          set +e
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')
          queried=$?
          set -e
          if [ "$queried" -ne 0 ]; then
            echo "::error title=Could not check for an open refresh PR::gh pr list exited $queried. Refusing to continue rather than guess, because treating this as 'no PR' would force-push over an open one."
            exit 1
          fi
          if [ -z "$open_pr" ]; then
            echo "::warning title=Ignoring a stale refresh branch::$BRANCH exists with no open PR, so its PR was closed or merged without the branch being deleted. Comparing against main instead; this run will open a fresh PR if the data has moved. Delete the branch to silence this."
            exit 0
          fi
          git fetch --depth=1 origin "$BRANCH"
          for f in apps/website/src/data/ashby-roles.snapshot.json \
                   apps/website/src/data/cloud-nodes.snapshot.json; do
            git checkout FETCH_HEAD -- "$f" \
              || echo "::notice::$f is not on $BRANCH; using the copy from main."
          done

      # Per file, because the two are judged independently below: a cloud pull
      # that failed must not let its own file decide anything.
      - name: Record the baseline snapshot digests
        id: baseline
        run: |
          # Assigned before they are echoed, so `set -e` can see the failure:
          # inline in the echo, a missing snapshot still exits 0 with a digest
          # of whatever survived — pipefail included — and the comparison
          # below then disagrees for a reason that is not the data.
          set -o pipefail
          ashby=$(sha256sum apps/website/src/data/ashby-roles.snapshot.json | cut -d' ' -f1)
          cloud=$(sha256sum apps/website/src/data/cloud-nodes.snapshot.json | cut -d' ' -f1)
          echo "ashby=$ashby" >> "$GITHUB_OUTPUT"
          echo "cloud=$cloud" >> "$GITHUB_OUTPUT"

      - name: Refresh Ashby snapshot
        uses: ./.github/actions/ashby-pull
        with:
          api_key: ${{ secrets.WEBSITE_ASHBY_API_KEY }}
          job_board_name: ${{ secrets.WEBSITE_ASHBY_JOB_BOARD_NAME }}

      # Non-blocking: the cloud nodes refresh calls a different API for a
      # different page. Letting it fail the job would throw away an already
      # regenerated Ashby snapshot, so a Comfy Cloud outage would silently
      # cost every careers update for as long as it lasted.
      - name: Refresh cloud nodes snapshot
        id: cloud-nodes
        continue-on-error: true
        uses: ./.github/actions/cloud-nodes-pull
        with:
          api_key: ${{ secrets.WEBSITE_CLOUD_API_KEY }}

      # The adopt step left the open PR's copy of this file in the tree. If the
      # pull failed, that copy is all the PR would carry — and once main has
      # moved on, which the registry-loss instructions in apps/website/README.md
      # tell people to do, proposing it reverts somebody's commit inside a PR
      # whose stated subject is Ashby. Losing the branch's pending cloud delta
      # is the lesser harm: the next successful pull regenerates it from live
      # data, and a run that finds no Ashby change leaves the branch untouched
      # anyway.
      - name: Drop a cloud snapshot this run did not produce
        if: steps.cloud-nodes.outcome == 'failure'
        run: git checkout HEAD -- apps/website/src/data/cloud-nodes.snapshot.json

      - name: Decide whether a snapshot actually changed
        id: changed
        run: |
          set -o pipefail
          ashby=$(sha256sum apps/website/src/data/ashby-roles.snapshot.json | cut -d' ' -f1)
          cloud=$(sha256sum apps/website/src/data/cloud-nodes.snapshot.json | cut -d' ' -f1)
          any=false
          if [ "$ashby" != "$ASHBY_BASELINE" ]; then
            any=true
          fi
          # Skipped when the pull failed: the step above reset this file to
          # main, which differs from the adopted baseline whenever the open PR
          # carried a cloud change — so comparing it would report a change this
          # run did not make and reopen the PR around a reverted file.
          if [ "$CLOUD_REFRESHED" = 'true' ] && [ "$cloud" != "$CLOUD_BASELINE" ]; then
            any=true
          fi
          echo "any=$any" >> "$GITHUB_OUTPUT"
          if [ "$any" = 'false' ]; then
            echo "Snapshots match the baseline; not touching the refresh branch."
          fi
        env:
          ASHBY_BASELINE: ${{ steps.baseline.outputs.ashby }}
          CLOUD_BASELINE: ${{ steps.baseline.outputs.cloud }}
          CLOUD_REFRESHED: ${{ steps.cloud-nodes.outcome != 'failure' }}

      # Usually benign — the snapshot keeps only title, department, location
      # and URL, so editing a description or compensation legitimately changes
      # nothing here. Annotated anyway, because this is also what the job
      # board trailing the webhook looks like, and without a record the wait
      # above can never be shown to be too short.
      - name: Note a webhook run that found nothing
        if: >-
          inputs.source == 'ashby-webhook' &&
          steps.changed.outputs.any == 'false'
        run: |
          echo "::notice title=Ashby event produced no snapshot change::The job board API returned data matching the committed snapshot, so no PR was opened. Most likely the edit did not touch a field the snapshot stores (it holds title, department, location and URL only), or an earlier run in this burst already captured it. The remaining possibility is that the job board trailed the webhook by longer than the wait at the top of this workflow — suspect that only if it recurs for edits that did change one of those fields."

      - name: Create Pull Request
        if: steps.changed.outputs.any == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          commit-message: 'chore(website): refresh Ashby and cloud nodes snapshots'
          title: 'chore(website): refresh Ashby and cloud nodes snapshots'
          body: |
            Automated refresh of remote-data snapshots used by the website
            build:

            - `apps/website/src/data/ashby-roles.snapshot.json` — Ashby job
              board API
            - `apps/website/src/data/cloud-nodes.snapshot.json` — Comfy Cloud
              `/api/object_info`

            **Merging this PR is what puts the change on comfy.org** — the
            careers page is rendered from Ashby at build time, so the site does
            not update until a production deploy runs.

            **Flow:**
            1. `Release: Website` ran (`${{ github.event_name }}`${{ inputs.source && format(', source `{0}`', inputs.source) || '' }}).
            2. This PR opens with the regenerated snapshots.
            3. `CI: Vercel Website Preview` deploys a preview for review.
            4. Merging to `main` triggers the production Vercel deploy.

            This PR only exists because a snapshot actually changed; runs that
            find no role or node change write nothing and open nothing.

            > [!WARNING]
            > **Do not commit to `chore/refresh-website-snapshots`.** Any run
            > that finds new snapshot data rebuilds this branch from `main`
            > and force-pushes it, overwriting anything pushed here. And if
            > the data later matches `main` — because someone refreshed it
            > another way — this PR is closed and the branch deleted. Runs
            > that find nothing new leave the branch alone entirely. To fix
            > something, push to your own branch and open a separate PR.

            The snapshot fallback in `apps/website/src/utils/ashby.ts` and
            `apps/website/src/utils/cloudNodes.ts` remains intact: builds
            without the respective API keys continue to use the committed
            snapshot (with a warning annotation in CI).

            Triggered by workflow run `${{ github.run_id }}`.
          branch: chore/refresh-website-snapshots
          base: main
          labels: |
            Release:Website
          delete-branch: true

      # Runs last so the Ashby half is already safely in a PR: the Cloud
      # failure must not cost a role change, but it still has to turn the run
      # red, or a revoked WEBSITE_CLOUD_API_KEY is green forever. `always()`
      # because a PR step that failed first would otherwise skip this and take
      # the only explanation of the Cloud failure with it.
      - name: Fail if the cloud nodes refresh was skipped
        if: always() && steps.cloud-nodes.outcome == 'failure'
        run: |
          echo "::error title=Cloud nodes snapshot not refreshed::The Comfy Cloud pull failed, so any PR from this run carries Ashby changes only and apps/website/src/data/cloud-nodes.snapshot.json is left at whatever main holds. Either the Cloud API is unreachable or WEBSITE_CLOUD_API_KEY is invalid, or the registry-loss guard refused the write because packs lost their registry metadata — the step log says which. For the guard, see 'Refreshing the snapshot' in apps/website/README.md; it is cleared by a local re-run with WEBSITE_ALLOW_REGISTRY_LOSS=1 committed to main, not by re-running this workflow."
          exit 1
