---
name: Cloud Backport Tag

# Tags a cloud release branch `cloud/v<package.json version>` once a labelled
# backport PR merges into it.
#
# The tag is created through the Git refs REST API instead of `git push`.
# Pushing a ref with the default GITHUB_TOKEN runs GitHub's workflow-file
# check, which on this repo times out and rejects the push:
#   "Unable to determine if workflow can be created or updated due to
#    timeout; `workflows` scope may be required."
# (actions/checkout#2287). Every cloud tag run from 2026-09-17 onward failed
# that way, so cloud/1.53 and cloud/1.54 shipped a week of untagged backports.
# Creating the ref via the API points at a commit that already exists on the
# branch and does not go through that check.
#
# `workflow_dispatch` re-creates a missing tag at the current head of a
# cloud/x.y branch when the PR-triggered run was lost or failed.

on:
  pull_request:
    types: ['closed']
    branches: [cloud/*]
  workflow_dispatch:
    inputs:
      branch:
        description: 'cloud/x.y branch to tag at its current head'
        required: true
        type: string

# Serialize runs per cloud branch so two merges cannot race on the same tag.
# `queue: max` keeps every pending run: each merge tags its own package.json
# version, so the default single-slot queue would drop an older version's tag
# when several backports merge in a burst.
concurrency:
  group: cloud-backport-tag-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.base.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  create-tag:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'backport'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Create tag for cloud backport
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.base.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$BRANCH" =~ ^cloud/([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Base branch '$BRANCH' is not a cloud/x.y branch"
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"

          # Manual runs tag the branch head; PR runs tag the merge commit.
          if [[ -z "$SHA" ]]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          fi

          VERSION=$(gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=${SHA}" \
            -H 'Accept: application/vnd.github.raw+json' | jq -r '.version')
          if [[ ! "$VERSION" =~ ^${MAJOR}\.${MINOR}\.([0-9]+)(-.+)?$ ]]; then
            echo "::error::Version '${VERSION}' does not match cloud branch '${BRANCH}'"
            exit 1
          fi

          TAG="cloud/v${VERSION}"

          if EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            echo "::notice::Tag ${TAG} already exists at ${EXISTING}; skipping"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${SHA}" \
            --jq '.ref'; then
            # Two runs for the same branch can both pass the existence check
            # above; the loser gets 409 Conflict. Treat that as a no-op.
            if EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
              echo "::notice::Tag ${TAG} was created concurrently at ${EXISTING}; skipping"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Failed to create tag ${TAG} at ${SHA}"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "Created tag: ${TAG}"
            echo "Branch: ${BRANCH}"
            echo "Version: ${VERSION}"
            echo "Commit: ${SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
