---
name: Cloud Backport Tag

# Tags a cloud release branch `cloud/v<package.json version>` once a labelled
# backport PR merges into it.
#
# The tag is created through the Git refs REST API instead of `git push`.
# Pushing a ref with the default GITHUB_TOKEN runs GitHub's workflow-file
# check, which on this repo times out and rejects the push:
#   "Unable to determine if workflow can be created or updated due to
#    timeout; `workflows` scope may be required."
# (actions/checkout#2287). Every cloud tag run from 2026-09-17 onward failed
# that way, so cloud/1.53 and cloud/1.54 shipped a week of untagged backports.
# Creating the ref via the API points at a commit that already exists on the
# branch and does not go through that check.
#
# `workflow_dispatch` re-creates a missing tag at an explicit historical
# commit, or at the current branch head when no commit is supplied.

on:
  pull_request:
    types: ['closed']
    branches: [cloud/*]
  workflow_dispatch:
    inputs:
      branch:
        description: 'cloud/x.y branch whose release version should be tagged'
        required: true
        type: string
      commit:
        description: 'Optional 40-character commit SHA (defaults to branch head)'
        required: false
        type: string

# Give each merged commit and manual recovery its own group. Branch-level
# concurrency keeps only one pending run and can silently drop an older tag
# when several backports merge in a burst.
concurrency:
  group: cloud-backport-tag-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  create-tag:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'backport'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create tag for cloud backport
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.base.ref }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.event.pull_request.merge_commit_sha }}
        run: bash scripts/cicd/cloud-backport-tag.sh
