name: Publish Package Snapshot

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: >-
    publish-package-snapshot-${{ github.event.pull_request.number }}-${{
    github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  publish_snapshot:
    name: Publish PR Snapshots to npm
    # Forks never receive NPM_TOKEN, so a snapshot can only come from a branch
    # in this repository.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'publish-snapshot') &&
      (github.event.action != 'labeled' || github.event.label.name == 'publish-snapshot')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request merge commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # No NODE_AUTH_TOKEN and no id-token: write anywhere in this job.
      # build and smoke:pack are scripts this pull request can rewrite, so
      # neither the registry token nor a mintable OIDC token may be in scope
      # while they run. Snapshots are therefore published without provenance;
      # the real release path keeps it.
      - name: Select and build every changed package
        id: prepare
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT_VERSION="0.0.0-pr-${PR_NUMBER}-${HEAD_SHA:0:7}"
          SELECTED="$RUNNER_TEMP/snapshot-packages.tsv"
          : > "$SELECTED"
          # ingest-types first: the other packages resolve it through a
          # workspace range that npm rewrites at pack time.
          for PACKAGE in ingest-types billing-contract account-core; do
            case "$PACKAGE" in
              account-core) EXPECTED_NAME='@comfyorg/account-core' ;;
              billing-contract) EXPECTED_NAME='@comfyorg/billing-contract' ;;
              ingest-types) EXPECTED_NAME='@comfyorg/ingest-types' ;;
            esac
            PACKAGE_JSON="packages/$PACKAGE/package.json"
            if [ ! -f "$PACKAGE_JSON" ]; then
              continue
            fi
            if git diff --quiet HEAD^1 HEAD -- "packages/$PACKAGE"; then
              continue
            fi
            NAME=$(node -p "require('./$PACKAGE_JSON').name")
            if [ "$NAME" != "$EXPECTED_NAME" ]; then
              echo "::error title=Package name mismatch::$PACKAGE_JSON name '$NAME' is not '$EXPECTED_NAME'" >&2
              exit 1
            fi
            if [ "$(node -p "String(require('./$PACKAGE_JSON').private === true)")" = "true" ]; then
              echo "::notice title=Snapshot skipped::packages/$PACKAGE still sets \"private\": true, so no snapshot was published."
              continue
            fi
            node -e '
              const fs = require("node:fs")
              const [file, version] = process.argv.slice(1)
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"))
              manifest.version = version
              fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`)
            ' "$PACKAGE_JSON" "$SNAPSHOT_VERSION"
            pnpm --filter "$NAME" run --if-present build
            pnpm --filter "$NAME" run --if-present smoke:pack
            printf '%s\t%s\n' "$PACKAGE" "$NAME" >> "$SELECTED"
          done
          {
            echo "version=$SNAPSHOT_VERSION"
            echo "selected=$SELECTED"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the prepared snapshots
        id: snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SELECTED: ${{ steps.prepare.outputs.selected }}
          SNAPSHOT_VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # A re-run replays the event payload, so HEAD_SHA can name a commit
          # the branch has moved past. Publishing it would point pr-<N> at an
          # older snapshot than the one the comment already advertises.
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')
          if [ "$CURRENT_SHA" != "$HEAD_SHA" ]; then
            echo "::error title=Stale snapshot run::This run was triggered for ${HEAD_SHA}, but pull request #${PR_NUMBER} now points at ${CURRENT_SHA}. Publishing would move the ${DIST_TAG} dist-tag backwards, so nothing was published." >&2
            exit 1
          fi
          INSTALL_LINES=$(mktemp)
          while IFS=$'\t' read -r PACKAGE NAME <&3; do
            # The build and smoke:pack scripts ran after the selection step
            # checked these manifests, so check them again against the fixed
            # table rather than trusting what the loop was handed.
            case "$PACKAGE" in
              account-core) EXPECTED_NAME='@comfyorg/account-core' ;;
              billing-contract) EXPECTED_NAME='@comfyorg/billing-contract' ;;
              ingest-types) EXPECTED_NAME='@comfyorg/ingest-types' ;;
              *)
                echo "::error title=Unknown package::'$PACKAGE' is not a releasable package" >&2
                exit 1
                ;;
            esac
            PACKAGE_JSON="packages/$PACKAGE/package.json"
            ACTUAL_NAME=$(node -p "require('./$PACKAGE_JSON').name")
            ACTUAL_VERSION=$(node -p "require('./$PACKAGE_JSON').version")
            ACTUAL_PRIVATE=$(node -p "String(require('./$PACKAGE_JSON').private === true)")
            if [ "$NAME" != "$EXPECTED_NAME" ] || [ "$ACTUAL_NAME" != "$EXPECTED_NAME" ]; then
              echo "::error title=Package name mismatch::$PACKAGE_JSON name '$ACTUAL_NAME' (selected as '$NAME') is not '$EXPECTED_NAME'" >&2
              exit 1
            fi
            if [ "$ACTUAL_VERSION" != "$SNAPSHOT_VERSION" ]; then
              echo "::error title=Version mismatch::$PACKAGE_JSON version '$ACTUAL_VERSION' is not the snapshot version '$SNAPSHOT_VERSION'" >&2
              exit 1
            fi
            if [ "$ACTUAL_PRIVATE" = "true" ]; then
              echo "::error title=Package is private::$PACKAGE_JSON sets \"private\": true after the build scripts ran" >&2
              exit 1
            fi
            STATUS=0
            PUBLISHED=$(npm view "${NAME}@${SNAPSHOT_VERSION}" version 2>&1) || STATUS=$?
            if [ "$STATUS" -eq 0 ] && [ -n "$PUBLISHED" ]; then
              echo "::notice title=Snapshot already published::${NAME}@${SNAPSHOT_VERSION} is already on npm, so this re-run reuses it."
            elif [ "$STATUS" -eq 0 ] || printf '%s' "$PUBLISHED" | grep -q 'E404'; then
              pnpm -C "packages/$PACKAGE" publish \
                --access public \
                --tag "$DIST_TAG" \
                --no-git-checks \
                --ignore-scripts
            else
              echo "::error title=Registry lookup failed::$PUBLISHED" >&2
              exit "$STATUS"
            fi
            echo "- \`npm i ${NAME}@${DIST_TAG}\` (\`${SNAPSHOT_VERSION}\`)" >> "$INSTALL_LINES"
          done 3< "$SELECTED"
          COMMENT_FILE="$RUNNER_TEMP/snapshot-comment.md"
          if [ -s "$INSTALL_LINES" ]; then
            {
              echo "Snapshot packages published for \`${HEAD_SHA:0:7}\`:"
              echo ""
              cat "$INSTALL_LINES"
              echo ""
            } > "$COMMENT_FILE"
          else
            echo "::notice title=No snapshot published::No publishable package changed in this pull request."
            {
              echo "No snapshot for \`${HEAD_SHA:0:7}\`: no publishable package changed in this pull request."
              echo ""
            } > "$COMMENT_FILE"
          fi
          echo "comment_file=$COMMENT_FILE" >> "$GITHUB_OUTPUT"

      - name: Restore snapshot versions
        if: always()
        run: git checkout -- packages

      - name: Comment the snapshot status on the pull request
        uses: ./.github/actions/upsert-comment-section
        with:
          pr-number: ${{ github.event.pull_request.number }}
          section-name: package-snapshots
          section-content-file: ${{ steps.snapshot.outputs.comment_file }}
          token: ${{ github.token }}
