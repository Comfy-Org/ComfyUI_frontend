name: 'CI: Dashboard Deploy'

on:
  workflow_run:
    workflows: ['CI: Tests E2E']
    types:
      - completed

concurrency:
  group: dashboard-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.repository == 'Comfy-Org/ComfyUI_frontend' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download merged Playwright report
        uses: dawidd6/action-download-artifact@0bd50d53a6d7fb5cb921e607957e9cc12b4ce392 # v12
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: playwright-report-chromium
          path: dashboard-site/playwright-report
          if_no_artifact_found: warn

      - name: Download packaged coverage report
        uses: dawidd6/action-download-artifact@0bd50d53a6d7fb5cb921e607957e9cc12b4ce392
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: e2e-coverage-html
          path: dashboard-site/coverage
          if_no_artifact_found: warn

      - name: Check both reports were found
        id: report
        run: |
          if [ -f dashboard-site/playwright-report/index.html ] && [ -f dashboard-site/coverage/index.html ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Playwright or coverage report missing; keeping the existing Pages deployment." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble dashboard index
        if: steps.report.outputs.found == 'true'
        run: cp tools/cicd-dashboard/index.html dashboard-site/index.html

      - name: Upload to GitHub Pages
        if: steps.report.outputs.found == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dashboard-site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.report.outputs.found == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
