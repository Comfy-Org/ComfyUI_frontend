# Description: Generates and updates website translations using OpenAI
name: 'i18n: Update Website'

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/src/locales/en/*.json'
      - 'apps/website/src/config/locales.ts'
      - 'apps/website/src/config/translation.ts'
      - 'scripts/i18n/config.ts'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: i18n-update-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-locales:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup ComfyUI Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build on the open translation PR
        id: base
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSLATION_BRANCH: i18n/website-locales
        run: |
          set -euo pipefail
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          open_pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$TRANSLATION_BRANCH" \
            --jq '.[0].html_url // empty')
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -z "$open_pr" ]; then exit 0; fi
          git fetch --no-tags origin "refs/heads/$TRANSLATION_BRANCH"
          echo "branch_sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          if git -c user.name=github-actions -c user.email=github-actions@github.com \
            merge --no-edit FETCH_HEAD; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
          fi

      - name: Update translations
        id: translate
        continue-on-error: true
        run: pnpm --filter @comfyorg/website locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit updated locales
        id: commit
        run: |
          git add apps/website/src/locales/
          if git diff --cached --quiet; then exit 0; fi
          ./scripts/cicd/check-json.sh
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m 'fix(website): update locale catalogs'
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Publish updated locales
        if: steps.commit.outputs.committed == 'true' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.PR_GH_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TRANSLATION_BRANCH: i18n/website-locales
          COMMITTED: ${{ steps.commit.outputs.committed }}
          MAIN_SHA: ${{ steps.base.outputs.main_sha }}
          OPEN_PR: ${{ steps.base.outputs.open_pr }}
          BRANCH_SHA: ${{ steps.base.outputs.branch_sha }}
          MERGED: ${{ steps.base.outputs.merged }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$SOURCE_BRANCH" != main ]; then
            git push "$remote" "HEAD:refs/heads/$SOURCE_BRANCH"
            exit 0
          fi
          if git diff --quiet "$MAIN_SHA" HEAD; then
            if [ -n "$OPEN_PR" ]; then
              gh pr close "$OPEN_PR" --delete-branch --comment 'Main already has every translation on this branch.'
            fi
            exit 0
          fi
          if [ "$COMMITTED" != true ] && [ "$MERGED" = true ]; then
            echo "No new translations for $OPEN_PR"
            exit 0
          fi
          lease=--force
          if [ -n "$BRANCH_SHA" ]; then
            lease="--force-with-lease=refs/heads/$TRANSLATION_BRANCH:$BRANCH_SHA"
          fi
          git push "$lease" "$remote" "HEAD:refs/heads/$TRANSLATION_BRANCH"
          if [ -n "$OPEN_PR" ]; then
            echo "Updated $OPEN_PR"
            exit 0
          fi
          body=$(printf '## Summary\n\nTranslations of new or changed English website copy, generated by [this workflow run](%s).\n\nLater runs merge main into this branch and translate only what changed, so translations edited here are kept.\n' "$RUN_URL")
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TRANSLATION_BRANCH" \
            --title 'fix(website): update locale catalogs' --body "$body" \
            --label area:i18n --assignee benceruleanlu

      - name: Fail if translation did not finish
        if: steps.translate.outcome == 'failure'
        run: |
          echo "::error::Website translation did not finish; the Update translations step lists what failed."
          exit 1
