# Description: Generates missing/stale locale strings in
# apps/website/src/i18n/translations.ts using OpenAI, gated by the pipeline's
# own AI review pass (see apps/website/scripts/i18n/review.ts). Manual dispatch
# only for now — auto-triggering on every PR is a follow-up once the team has
# reviewed output quality, mirroring how i18n-update-core.yaml graduated from
# manual runs to PR-triggered ones.
name: 'i18n: Update Website Strings'

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to translate and push results onto'
        required: true
        type: string

concurrency:
  group: i18n-update-website-strings-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  update-website-translations:
    # Checkout uses the dispatcher-supplied branch as its ref, and the steps
    # below run that ref's code with OPENAI_API_KEY — restrict it to this
    # pipeline's own branch convention so dispatch can't be pointed at an
    # arbitrary branch to exfiltrate the secret, mirroring the branch-prefix
    # gate i18n-update-core.yaml uses for its own dispatched translation runs.
    if: github.repository == 'Comfy-Org/ComfyUI_frontend' && startsWith(github.event.inputs.branch, 'i18n/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          ref: ${{ github.event.inputs.branch }}

      - name: Setup ComfyUI Frontend
        uses: ./.github/actions/setup-frontend

      - name: Update website translations
        id: translate
        run: pnpm --filter website i18n:translate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Format
        run: pnpm format

      - name: Commit and push generated translations
        env:
          TARGET_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git add apps/website/src/i18n/
          if git diff --cached --quiet; then
            echo "No new translations generated."
            exit 0
          fi
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m 'Update website translations'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
