# Description: Generates and updates website translations using OpenAI
name: 'i18n: Update Website'

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/src/locales/en/*.json'
      - 'apps/website/src/config/locales.ts'
      - 'apps/website/src/config/translation.ts'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-update-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-locales:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup ComfyUI Frontend
        uses: ./.github/actions/setup-frontend

      - name: Update translations
        id: translate
        continue-on-error: true
        run: pnpm --filter @comfyorg/website locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit updated locales
        id: commit
        run: |
          git add apps/website/src/locales/
          if git diff --cached --quiet; then exit 0; fi
          ./scripts/cicd/check-json.sh
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m 'fix(website): update locale catalogs'
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Publish updated locales
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_GH_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          TRANSLATION_BRANCH: i18n/website-locales
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "$SOURCE_BRANCH" != main ]; then
            git push "$remote" "HEAD:refs/heads/$SOURCE_BRANCH"
            exit 0
          fi
          git push --force "$remote" "HEAD:refs/heads/$TRANSLATION_BRANCH"
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TRANSLATION_BRANCH" \
            --state open --json url --jq '.[0].url // empty')
          if [ -n "$open_pr" ]; then
            echo "Updated $open_pr"
            exit 0
          fi
          body=$(printf '## Summary\n\nTranslations of new or changed English website copy, generated by [this workflow run](%s).\n\nEvery run regenerates this branch from main, so merge it before editing a translation by hand.\n' "$RUN_URL")
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TRANSLATION_BRANCH" \
            --title 'fix(website): update locale catalogs' --body "$body" \
            --label area:i18n --assignee benceruleanlu

      - name: Fail if some strings were not translated
        if: steps.translate.outcome == 'failure'
        run: |
          echo "::error::Some website strings were not translated; the Update translations step lists them. Everything else was published, and the rest retry on the next run."
          exit 1
