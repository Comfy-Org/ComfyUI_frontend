name: 'i18n: Update Website'

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/src/locales/en/*.json'
      - 'apps/website/src/config/locales.ts'
      - 'apps/website/src/config/translation.ts'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: i18n-update-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-locales:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRANSLATION_BRANCH: bl/website-locale-updates
      TARGET_BRANCH: main
    steps:
      - name: Choose the publication route
        id: route
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            echo 'create_pr=true' >> "$GITHUB_OUTPUT"
          else
            echo 'create_pr=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check for a translation PR awaiting review
        id: pending
        if: steps.route.outputs.create_pr == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pending_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" --head "$TRANSLATION_BRANCH" \
            --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false)][0].url // empty')
          if [ -n "$pending_pr" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "::notice::Website translations are awaiting review: $pending_pr"
          fi

      - name: Checkout repository
        if: steps.pending.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup ComfyUI Frontend
        if: steps.pending.outputs.skip != 'true'
        uses: ./.github/actions/setup-frontend

      - name: Update translations
        if: steps.pending.outputs.skip != 'true'
        run: pnpm --filter @comfyorg/website locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate updated locales
        id: locales
        if: steps.pending.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git add apps/website/src/locales/
          if git diff --cached --quiet; then exit 0; fi
          bash ./scripts/cicd/check-json.sh
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify the translation inputs are current
        id: source
        if: steps.locales.outputs.changed == 'true' && steps.route.outputs.create_pr == 'true'
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "$TARGET_BRANCH"
          if ! git diff --quiet HEAD FETCH_HEAD -- \
            apps/website/src/locales scripts/i18n \
            apps/website/src/config/locales.ts \
            apps/website/src/config/translation.ts; then
            echo '::error::Translation inputs changed during generation; retry against the current branch.'
            exit 1
          fi

      - name: Create the translation PR
        if: steps.locales.outputs.changed == 'true' && steps.route.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          branch: ${{ env.TRANSLATION_BRANCH }}
          base: ${{ env.TARGET_BRANCH }}
          add-paths: apps/website/src/locales/
          commit-message: 'fix(website): update locale catalogs'
          title: 'fix(website): update locale catalogs'
          draft: true
          body: |
            ## Summary

            Translate missing or changed website copy using the shared locale pipeline.

            ## Verification

            Generated and validated in [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Review the translated copy before merging.

      - name: Commit updated branch locales
        if: steps.locales.outputs.changed == 'true' && steps.route.outputs.create_pr == 'false'
        run: |
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m 'Update website locales'

      - name: Push updated locales
        if: steps.locales.outputs.changed == 'true' && steps.route.outputs.create_pr == 'false'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          PR_GH_TOKEN: ${{ secrets.PR_GH_TOKEN }}
        run: |
          git push "https://x-access-token:${PR_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$TARGET_BRANCH"
