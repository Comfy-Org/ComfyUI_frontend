# Description: Generates and updates website translations using OpenAI
name: 'i18n: Update Website'

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/src/locales/en/*.json'
      - 'apps/website/src/config/locales.ts'
      - 'apps/website/src/config/translation.ts'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i18n-update-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-locales:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - name: Setup ComfyUI Frontend
        uses: ./.github/actions/setup-frontend

      - name: Update translations
        id: translate
        continue-on-error: true
        run: pnpm --filter @comfyorg/website locale
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Open the translation PR
        if: github.ref_name == 'main'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          branch: i18n/website-locales
          add-paths: apps/website/src/locales/
          commit-message: 'fix(website): update locale catalogs'
          title: 'fix(website): update locale catalogs'
          labels: area:i18n
          assignees: benceruleanlu
          body: |
            ## Summary

            Translations of new or changed English website copy, generated by [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Every run regenerates this branch from main, so merge it before editing a translation by hand.

      - name: Commit updated locales
        id: commit
        if: github.ref_name != 'main'
        run: |
          git add apps/website/src/locales/
          if git diff --cached --quiet; then exit 0; fi
          ./scripts/cicd/check-json.sh
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m 'Update website locales'
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Push updated locales
        if: steps.commit.outputs.committed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          PR_GH_TOKEN: ${{ secrets.PR_GH_TOKEN }}
        run: |
          git push "https://x-access-token:${PR_GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Fail if some strings were not translated
        if: steps.translate.outcome == 'failure'
        run: |
          echo "::error::Some website strings were not translated; the Update translations step lists them. Everything else was published, and the rest retry on the next run."
          exit 1
