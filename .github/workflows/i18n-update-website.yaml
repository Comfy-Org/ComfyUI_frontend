# Description: Generates and updates marketing site translations (apps/website).
#
# Pushes English; CI translates. Rebuilds the English content-of-record from
# translations.ts, works out what each locale is missing, fills the gaps with the
# repo's own translator, drops anything failing a deterministic check, and opens
# a PR for a human to review and merge.
#
# Nothing here flips a locale or a page to indexable. That stays a separate,
# reviewed change to INDEXABLE_PAGES in src/config/locales.ts, so a translation
# run can never put a half-finished page in front of Google on its own.
#
# Mirrors `i18n-update-hub.yml` in Comfy-Org/workflow_templates, deliberately:
# one shape for both properties, so knowing one means knowing the other.
name: 'i18n: Update Website Translations'

on:
  workflow_dispatch:
    inputs:
      locale:
        description: 'Single locale to translate (blank = all). e.g. ja'
        required: false
        default: ''
  # Pick up copy that shipped since the last run.
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: i18n-update-website
  # Queue overlapping runs rather than cancelling, so the nightly cron cannot
  # kill a manually dispatched backfill halfway through a paid model run.
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-translations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PR_GH_TOKEN }}

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Resolve target locales. The dispatch input arrives via env rather than
      # being spliced into the script, and must match the configured allowlist,
      # so it can neither inject shell nor request a locale the site cannot serve.
      - name: Resolve target locales
        id: locales
        env:
          INPUT_LOCALE: ${{ github.event.inputs.locale }}
        run: |
          set -euo pipefail
          supported="ja zh-CN"
          if [ -z "${INPUT_LOCALE}" ]; then
            echo "targets=${supported}" >> "$GITHUB_OUTPUT"
          elif echo "${supported}" | tr ' ' '\n' | grep -qx -- "${INPUT_LOCALE}"; then
            echo "targets=${INPUT_LOCALE}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::unsupported locale '${INPUT_LOCALE}'; expected one of: ${supported}"
            exit 1
          fi

      - name: Check pipeline configuration
        working-directory: apps/website
        run: pnpm i18n:check-config

      # Rebuilds en.json, the hash manifest, and each locale's pending list.
      # Also prunes machine entries whose English changed, so they are
      # retranslated rather than left stale.
      - name: Rebuild the content source
        working-directory: apps/website
        run: pnpm i18n:build-source

      - name: Translate, review, enforce and validate
        working-directory: apps/website
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # A different vendor from the translator on purpose. A model grading
          # its own output is a weak check; the point of the review step is an
          # independent second reader.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository variable, so the reviewer model can be changed and
          # reverted without a code change. Separate from the translator's knob:
          # swapping the model that writes the translations should not silently
          # swap the one that judges them. Unset falls back to the model named in
          # review-translations.ts.
          WEBSITE_I18N_REVIEW_MODEL: ${{ vars.WEBSITE_I18N_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          for locale in ${{ steps.locales.outputs.targets }}; do
            echo "::group::${locale}"
            WEBSITE_I18N_LOCALE="${locale}" pnpm i18n:translate
            # Judgement layer, between translate and enforce. The deterministic
            # checks answer "did the model break a rule we wrote down"; they
            # cannot answer "is this good Japanese", which is what marketing copy
            # actually fails. It reads the staged translations as well as the
            # published ones, so a string translated tonight is judged tonight
            # rather than going live unreviewed until tomorrow's run.
            #
            # `|| true`: the reviewer must never be able to break the translation
            # pipeline. Without the secret it already skips itself; on an API
            # outage this degrades to exactly the behaviour before it existed,
            # because it only writes verdicts and enforce prunes on whatever
            # verdicts exist.
            WEBSITE_I18N_LOCALE="${locale}" pnpm i18n:review || true
            # Drops anything failing a check rather than publishing it, including
            # the reviewer's critical and major findings; the resolver then shows
            # English for that key.
            WEBSITE_I18N_LOCALE="${locale}" pnpm i18n:enforce
            echo "::endgroup::"
          done
          # Belt and braces: enforce already dropped the failures, so a violation
          # surviving to here means the two disagree and the run must not ship.
          pnpm i18n:validate

      # `content/` is what the pipeline writes; `resolved/` is what the browser
      # reads. Translating without rebuilding left the run's own PR carrying new
      # Japanese that no page would serve, and red: `resolved.test.ts` compares
      # the dictionaries against the resolver and fails on exactly this drift.
      #
      # After `i18n:validate`, so a run that failed validation never rewrites
      # the dictionaries the site loads.
      - name: Rebuild the resolved dictionaries
        working-directory: apps/website
        run: pnpm i18n:build-resolved

      # Not every Japanese string lives in a dictionary. Three writers turn the
      # machine layer into generated content — `ja` properties in `src/data`,
      # and `.mdx` under `src/content/faq` and `src/content/customers` — and
      # nothing here ran them, so that content only ever changed when someone
      # ran them by hand.
      #
      # Withdrawal is why it matters. `i18n:enforce` dropping a key is what
      # tells a writer its generated file is no longer justified; with the
      # writers never invoked, a rejected translation stayed published and
      # enforcement was cosmetic for anything already written. Run after
      # enforcement and after `i18n:validate`, so they only ever act on a layer
      # that passed.
      - name: Reconcile generated Japanese content
        working-directory: apps/website
        run: |
          pnpm i18n:write-data
          pnpm i18n:write-faq
          pnpm i18n:write-story

      - name: Report coverage
        working-directory: apps/website
        run: pnpm i18n:report

      - name: Open a pull request
        # SHA-pinned at the version the rest of this repo uses. A floating tag
        # on a PR-opening action with write permissions is a supply-chain risk.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          branch: i18n/website-translations
          # Reuse one branch so consecutive nightly runs update a single PR
          # rather than opening one per night.
          title: 'chore(i18n): update marketing site translations'
          commit-message: 'chore(i18n): update marketing site translations'
          # The generated content directories are listed too, deletions
          # included: a withdrawal removes an `.mdx`, and a path missing from
          # here would leave that file in the tree while the dictionaries said
          # it was gone.
          add-paths: |
            apps/website/src/i18n/content
            apps/website/src/i18n/resolved
            apps/website/src/i18n/review
            apps/website/src/i18n/manifest.json
            apps/website/src/data
            apps/website/src/content/faq
            apps/website/src/content/customers
          body: |
            Generated by `i18n: Update Website Translations`.

            Machine translations only. Approved copy in `translations.ts` is
            untouched: nothing in this pipeline writes to that file, and the
            resolver prefers approved over machine in any case.

            Generated content moves with the dictionaries: `ja` properties in
            `src/data` and the `.mdx` under `src/content/faq` and
            `src/content/customers`. A file this run deletes is a withdrawal —
            its translation was rejected or went stale, so the page falls back
            to English until a later run writes it again.

            Anything that failed a deterministic check, or that the AI reviewer
            graded critical or major, was dropped rather than published, so those
            keys render English until a later run or a person fills them. The
            reviewer's verdicts, minor findings included, are in
            `src/i18n/review/` for anyone who wants to read what it thought.

            This does not make anything indexable. Flipping a page or a locale
            live is a separate, reviewed change to `INDEXABLE_PAGES`.
