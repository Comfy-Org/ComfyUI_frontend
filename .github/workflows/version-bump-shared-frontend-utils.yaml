name: Version Bump Shared Frontend Utils

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version increment type'
        required: true
        default: 'patch'
        type: 'choice'
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      pre_release:
        description: Pre-release ID (suffix)
        required: false
        default: ''
        type: string

jobs:
  bump-version-shared-frontend-utils:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Bump shared-frontend-utils version
        id: bump-version
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          PRE_RELEASE: ${{ github.event.inputs.pre_release }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C packages/shared-frontend-utils version "$VERSION_TYPE" --preid "$PRE_RELEASE" --no-git-tag-version
          NEW_VERSION=$(jq -r '.version' packages/shared-frontend-utils/package.json)
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ secrets.PR_GH_TOKEN }}
          commit-message: '[release] Increment shared-frontend-utils to ${{ steps.bump-version.outputs.NEW_VERSION }}'
          title: shared-frontend-utils ${{ steps.bump-version.outputs.NEW_VERSION }}
          body: |
            ${{ github.event.inputs.version_type }} version increment for @comfyorg/shared-frontend-utils to ${{ steps.bump-version.outputs.NEW_VERSION }}
          branch: shared-frontend-utils-version-bump-${{ steps.bump-version.outputs.NEW_VERSION }}
          base: main
          labels: |
            Release
