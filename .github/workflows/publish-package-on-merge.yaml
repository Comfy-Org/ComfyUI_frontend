name: Publish Package on PR Merge

on:
  pull_request:
    types: ['closed']
    branches: [main]
    paths:
      - 'packages/account-core/package.json'
      - 'packages/billing-contract/package.json'
      - 'packages/ingest-types/package.json'

env:
  # #product-design — the channel the design-system release notice posts to.
  SLACK_CHANNEL_ID: 'C09A24D4692'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Released Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'Release')
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      released: ${{ steps.collect.outputs.released }}
      summary: ${{ steps.collect.outputs.summary }}
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Collect packages whose version changed
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          INCLUDE='[]'
          SUMMARY=''
          for PACKAGE in account-core billing-contract ingest-types; do
            PACKAGE_JSON="packages/$PACKAGE/package.json"
            if ! git diff --quiet HEAD^1 HEAD -- "$PACKAGE_JSON"; then
              PREV_JSON=$(git show "HEAD^1:$PACKAGE_JSON" 2>/dev/null || true)
              if [ -z "$PREV_JSON" ]; then
                echo "::notice title=New package manifest::$PACKAGE_JSON did not exist before this merge; skipping publish."
                continue
              fi
              PREV_VERSION=$(printf '%s' "$PREV_JSON" | node -pe "JSON.parse(require('fs').readFileSync(0, 'utf8')).version ?? ''")
              VERSION=$(node -p "require('./$PACKAGE_JSON').version")
              if [ "$PREV_VERSION" = "$VERSION" ]; then
                continue
              fi
              if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
                DIST_TAG=next
              else
                DIST_TAG=latest
              fi
              INCLUDE=$(jq -c \
                --arg package "$PACKAGE" \
                --arg version "$VERSION" \
                --arg dist_tag "$DIST_TAG" \
                '. + [{package: $package, version: $version, dist_tag: $dist_tag}]' \
                <<<"$INCLUDE")
              SUMMARY="${SUMMARY}@comfyorg/${PACKAGE}@${VERSION} (${DIST_TAG}) "
            fi
          done
          COUNT=$(jq -r 'length' <<<"$INCLUDE")
          if [ "$COUNT" -eq 0 ]; then
            echo "::notice title=No version change::No releasable package changed its version in this merge."
          fi
          {
            echo "matrix=$(jq -c --argjson include "$INCLUDE" -n '{include: $include}')"
            echo "released=$COUNT"
            echo "summary=${SUMMARY% }"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.package }} to npm
    needs: resolve
    if: needs.resolve.outputs.released != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yaml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      dist_tag: ${{ matrix.dist_tag }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  comment_package_publish:
    name: Comment ${{ matrix.package }} Publish Summary
    needs:
      - resolve
      - publish
    if: success() && needs.resolve.outputs.released != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2

      - name: Post package release summary comment
        uses: ./.github/actions/comment-release-links
        with:
          issue-number: ${{ github.event.pull_request.number }}
          version_file: packages/${{ matrix.package }}/package.json

  notify_slack:
    name: Notify Slack
    needs:
      - resolve
      - publish
    if: success() && needs.resolve.outputs.released != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post to Slack
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SUMMARY: ${{ needs.resolve.outputs.summary }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          TEXT=":package: *${SUMMARY}* published to npm — <${PR_URL}|#${PR_NUMBER}> by ${PR_AUTHOR}."
          BODY=$(jq -n --arg ch "$SLACK_CHANNEL_ID" --arg text "$TEXT" '{channel: $ch, text: $text}')
          RESPONSE=$(curl -sS -X POST \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            https://slack.com/api/chat.postMessage)
          echo "$RESPONSE" | jq -e '.ok == true' >/dev/null
