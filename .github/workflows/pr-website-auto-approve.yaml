# Run the website package's configured delivery lane.
#
# Security boundary:
# - pull_request_target, workflow_run, and status load this workflow from the
#   default branch. Automation and policy are checked out from the protected
#   default branch; pull request code is never executed.
# - the script rejects other base branches and forks, re-fetches the live PR,
#   verifies the exact head SHA, requires every changed path to be under
#   apps/website/**, and verifies the PAT owner.
name: 'PR: Website Fast Lane'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      - 'CI: Lint Format'
      - 'CI: Tests Unit'
      - 'CI: Tests E2E'
      - 'CI: Website E2E'
    types: [completed]
  status:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # One serialized compensation boundary is safer than SHA-keyed runs that can
  # concurrently approve and withdraw the same pull request. The trial cohort
  # is intentionally small, so global serialization is acceptable here.
  group: website-fast-lane
  cancel-in-progress: false

jobs:
  approve:
    if: github.event_name == 'pull_request_target'
    environment: website-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base automation
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/fast-lanes/website.json
            scripts/cicd/fast-lane

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Approve and queue eligible website pull request
        env:
          FAST_LANE_CONFIG: .github/fast-lanes/website.json
          FAST_LANE_TOKEN: ${{ secrets.WEBSITE_APPROVAL_TOKEN }}
          FAST_LANE_BASE_REF: ${{ github.event.repository.default_branch }}
          FAST_LANE_EVENT_ACTION: ${{ github.event.action }}
          FAST_LANE_EVENT_ACTOR: ${{ github.actor }}
          FAST_LANE_EVENT_LABEL: ${{ github.event.label.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node --experimental-strip-types scripts/cicd/fast-lane/run.ts

  reconcile-after-check:
    if: github.event_name == 'status' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    environment: website-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base automation
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            .github/fast-lanes/website.json
            scripts/cicd/fast-lane

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Reconcile approval and native queue state
        env:
          FAST_LANE_CONFIG: .github/fast-lanes/website.json
          FAST_LANE_TOKEN: ${{ secrets.WEBSITE_APPROVAL_TOKEN }}
          FAST_LANE_BASE_REF: ${{ github.event.repository.default_branch }}
          FAST_LANE_EVENT_ACTION: ${{ github.event.action }}
          FAST_LANE_EVENT_ACTOR: ${{ github.actor }}
          FAST_LANE_EVENT_LABEL: ${{ github.event.label.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.sha || github.event.workflow_run.head_sha }}
        run: node --experimental-strip-types scripts/cicd/fast-lane/run.ts
