# Run the website package's configured delivery lane.
#
# Security boundary: pull_request_target and workflow_run load this workflow,
# the policy, and the engine from the default branch; pull request code is
# never executed. Eligibility rules: docs/architecture/package-delivery-lanes.md.
name: 'PR: Website Fast Lane'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled
  workflow_run:
    workflows:
      - 'CI: Tests E2E'
      - 'CI: Website E2E'
    types: [completed]

permissions:
  contents: read

jobs:
  fast-lane:
    if: github.event.pull_request || github.event.workflow_run.pull_requests[0]
    concurrency:
      group: website-fast-lane-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    environment: website-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base automation
        uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            tools/cicd/fast-lane

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Approve, queue, or withdraw the website pull request
        env:
          FAST_LANE: website
          FAST_LANE_TOKEN: ${{ secrets.WEBSITE_APPROVAL_TOKEN }}
          FAST_LANE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FAST_LANE_EVENT_ACTION: ${{ github.event.action }}
          FAST_LANE_EVENT_ACTOR: ${{ github.triggering_actor }}
          FAST_LANE_EVENT_LABEL: ${{ github.event.label.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
        run: node tools/cicd/fast-lane/src/run.ts
