# Auto-approve website-only pull requests from explicitly trusted authors or
# after an explicitly trusted operator applies the approval label.
#
# Security boundary:
# - pull_request_target loads this workflow from the trusted default branch.
# - automation is checked out from the repository's protected default branch;
#   pull request code is never executed.
# - the script rejects other base branches and forks, re-fetches the live PR,
#   verifies the exact head SHA, requires every changed path to be under
#   apps/website/**, and verifies the PAT owner.
name: 'PR: Website Auto-Approve'

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited
      - labeled
      - unlabeled
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows:
      - 'CI: Lint Format'
      - 'CI: Tests Unit'
      - 'CI: Tests E2E'
      - 'CI: Website E2E'
    types: [completed]
  status:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: website-auto-approve-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review'
    environment: website-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Approve and queue eligible website pull request
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WEBSITE_APPROVAL_BASE_REF: ${{ github.event.repository.default_branch }}
          WEBSITE_APPROVAL_TOKEN: ${{ secrets.WEBSITE_APPROVAL_TOKEN }}
          WEBSITE_APPROVER_LOGIN: christian-byrne
          # This is intentionally checked in: changing who can receive an
          # automatic approval must itself pass normal repository review.
          WEBSITE_AUTO_APPROVE_AUTHORS: '["bertfy"]'
          # The label is a second route for a non-allowlisted author. The script
          # verifies its latest event came from one of these operators.
          WEBSITE_AUTO_APPROVE_LABELERS: '["christian-byrne", "DrJKL", "benjcooley"]'
        run: node .github/scripts/website-auto-approve.mjs

  reconcile-after-check:
    if: github.event_name == 'status' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    environment: website-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Reconcile approval and native queue state
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.sha || github.event.workflow_run.head_sha }}
          WEBSITE_APPROVAL_BASE_REF: ${{ github.event.repository.default_branch }}
          WEBSITE_APPROVAL_TOKEN: ${{ secrets.WEBSITE_APPROVAL_TOKEN }}
          WEBSITE_APPROVER_LOGIN: christian-byrne
          WEBSITE_AUTO_APPROVE_AUTHORS: '["bertfy"]'
          WEBSITE_AUTO_APPROVE_LABELERS: '["christian-byrne", "DrJKL", "benjcooley"]'
        run: node .github/scripts/website-auto-approve.mjs
