name: PR Backport

on:
  pull_request_target:
    types: [closed, labeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to backport'
        required: true
        type: string
      force_rerun:
        description: 'Force rerun even if backports exist'
        required: false
        type: boolean
        default: false

concurrency:
  group: backport-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    if: >
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'needs-backport')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # `gh pr view <n>` fails with the auto-provided GITHUB_TOKEN even with
    # pull-requests: write, which is what silently broke manual dispatch.
    # Steps needing a different token still set GH_TOKEN themselves.
    env:
      GH_TOKEN: ${{ secrets.PR_GH_TOKEN || secrets.GH_TOKEN }}

    steps:
      - name: Validate inputs for manual triggers
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Validate PR number format
          if ! [[ "${{ inputs.pr_number }}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number format. Must be a positive integer."
            exit 1
          fi

          # Validate PR exists and is merged. The gh error is surfaced rather
          # than discarded: an auth failure and a genuinely missing PR are
          # indistinguishable once it is swallowed.
          if ! PR_VIEW_ERR=$(gh pr view "${{ inputs.pr_number }}" --json merged 2>&1 >/dev/null); then
            echo "::error::PR #${{ inputs.pr_number }} not found or inaccessible: ${PR_VIEW_ERR}"
            exit 1
          fi

          MERGED=$(gh pr view "${{ inputs.pr_number }}" --json merged --jq '.merged')
          if [ "$MERGED" != "true" ]; then
            echo "::error::PR #${{ inputs.pr_number }} is not merged. Only merged PRs can be backported."
            exit 1
          fi

          # Validate PR has needs-backport label
          if ! gh pr view "${{ inputs.pr_number }}" --json labels --jq '.labels[].name' | grep -q "needs-backport"; then
            echo "::error::PR #${{ inputs.pr_number }} does not have 'needs-backport' label."
            exit 1
          fi
        env:
          GH_REPO: ${{ github.repository }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Persist a token with `workflow` scope so the backport push can
          # include changes to .github/workflows/**. The default GITHUB_TOKEN
          # is refused by GitHub when a push creates/updates workflow files,
          # which silently aborted the whole job (see PR #12804 backport).
          token: ${{ secrets.PR_GH_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Collect backport targets
        id: targets
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          TARGETS=()
          declare -A SEEN=()

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LABELS=$(gh pr view ${{ inputs.pr_number }} --json labels | jq -r '.labels[].name')
          else
            LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")
          fi

          add_target() {
            local label="$1"
            local target="$2"

            if [ -z "$target" ]; then
              return
            fi

            target=$(echo "$target" | xargs)

            if [ -z "$target" ] || [ -n "${SEEN[$target]}" ]; then
              return
            fi

            if git ls-remote --exit-code origin "$target" >/dev/null 2>&1; then
              TARGETS+=("$target")
              SEEN["$target"]=1
            else
              echo "::warning::Label '${label}' references missing branch '${target}'"
            fi
          }

          while IFS= read -r label; do
            [ -z "$label" ] && continue

            if [[ "$label" =~ ^branch:(.+)$ ]]; then
              add_target "$label" "${BASH_REMATCH[1]}"
            elif [[ "$label" =~ ^backport:(.+)$ ]]; then
              add_target "$label" "${BASH_REMATCH[1]}"
            elif [[ "$label" =~ ^core\/([0-9]+)\.([0-9]+)$ ]]; then
              SAFE_MAJOR="${BASH_REMATCH[1]}"
              SAFE_MINOR="${BASH_REMATCH[2]}"
              add_target "$label" "core/${SAFE_MAJOR}.${SAFE_MINOR}"
            elif [[ "$label" =~ ^cloud\/([0-9]+)\.([0-9]+)$ ]]; then
              SAFE_MAJOR="${BASH_REMATCH[1]}"
              SAFE_MINOR="${BASH_REMATCH[2]}"
              add_target "$label" "cloud/${SAFE_MAJOR}.${SAFE_MINOR}"
            elif [[ "$label" =~ ^[0-9]+\.[0-9]+$ ]]; then
              add_target "$label" "core/${label}"
            fi
          done <<< "$LABELS"

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "::error::No backport targets found (use labels like '1.24' or 'branch:release/hotfix')"
            exit 1
          fi

          echo "targets=${TARGETS[*]}" >> $GITHUB_OUTPUT
          echo "Found backport targets: ${TARGETS[*]}"

      - name: Filter already backported targets
        id: filter-targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RERUN_INPUT: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.force_rerun
            || 'false' }}
          PR_NUMBER: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number
            || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          REQUESTED_TARGETS="${{ steps.targets.outputs.targets }}"
          if [ -z "$REQUESTED_TARGETS" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "pending-targets=" >> $GITHUB_OUTPUT
            exit 0
          fi

          FORCE_RERUN=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_RERUN_INPUT" = "true" ]; then
            FORCE_RERUN=true
          fi

          mapfile -t EXISTING_BRANCHES < <(
            git ls-remote --heads origin "backport-${PR_NUMBER}-to-*" || true
          )

          PENDING=()
          SKIPPED=()
          REUSED=()

          for target in $REQUESTED_TARGETS; do
            SAFE_TARGET=$(echo "$target" | tr '/' '-')
            BACKPORT_BRANCH="backport-${PR_NUMBER}-to-${SAFE_TARGET}"

            if [ "$FORCE_RERUN" = true ]; then
              PENDING+=("$target")
              continue
            fi

            if printf '%s\n' "${EXISTING_BRANCHES[@]:-}" |
              grep -Fq "refs/heads/${BACKPORT_BRANCH}"; then
              OPEN_PR=$(
                gh pr list \
                  --state open \
                  --head "${BACKPORT_BRANCH}" \
                  --json number \
                  --jq 'if length > 0 then .[0].number else "" end'
              )
              if [ -n "$OPEN_PR" ]; then
                SKIPPED+=("${target} (PR #${OPEN_PR})")
                continue
              fi

              REUSED+=("$BACKPORT_BRANCH")
            fi

            PENDING+=("$target")
          done

          SKIPPED_JOINED="${SKIPPED[*]:-}"
          PENDING_JOINED="${PENDING[*]:-}"

          echo "already-exists=${SKIPPED_JOINED}" >> $GITHUB_OUTPUT
          echo "pending-targets=${PENDING_JOINED}" >> $GITHUB_OUTPUT
          echo "reused-branches=${REUSED[*]:-}" >> $GITHUB_OUTPUT

          if [ -z "$PENDING_JOINED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            if [ -n "$SKIPPED_JOINED" ]; then
              echo "::warning::Backport branches exist: ${SKIPPED_JOINED}"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            if [ -n "$SKIPPED_JOINED" ]; then
              echo "::notice::Skipping backport targets: ${SKIPPED_JOINED}"
            fi
            if [ "${#REUSED[@]}" -gt 0 ]; then
              echo "::notice::Reusing backport branches: ${REUSED[*]}"
            fi
          fi

      - name: Backport commits
        if: steps.filter-targets.outputs.skip != 'true'
        id: backport
        env:
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          FAILED=""
          SUCCESS=""

          # Get PR data for manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_DATA=$(gh pr view ${{ inputs.pr_number }} --json title,mergeCommit)
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
            MERGE_COMMIT=$(echo "$PR_DATA" | jq -r '.mergeCommit.oid')
          else
            PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
            MERGE_COMMIT=$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")
          fi

          for target in ${{ steps.filter-targets.outputs.pending-targets }}; do
            TARGET_BRANCH="${target}"
            SAFE_TARGET=$(echo "$TARGET_BRANCH" | tr '/' '-')
            BACKPORT_BRANCH="backport-${PR_NUMBER}-to-${SAFE_TARGET}"
            REMOTE_BACKPORT_EXISTS=false

            if git ls-remote --exit-code origin "${BACKPORT_BRANCH}" >/dev/null 2>&1; then
              REMOTE_BACKPORT_EXISTS=true
              echo "::notice::Updating existing branch ${BACKPORT_BRANCH}"
            fi

            echo "::group::Backporting to ${TARGET_BRANCH}"

            # Fetch target branch (fail if doesn't exist)
            if ! git fetch origin "${TARGET_BRANCH}"; then
              echo "::error::Target branch ${TARGET_BRANCH} does not exist"
              FAILED="${FAILED}${TARGET_BRANCH}:branch-missing "
              echo "::endgroup::"
              continue
            fi

            # Check if commit already exists on target branch
            if git branch -r --contains "${MERGE_COMMIT}" | grep -q "origin/${TARGET_BRANCH}"; then
              echo "::notice::Commit ${MERGE_COMMIT} already exists on ${TARGET_BRANCH}, skipping backport"
              FAILED="${FAILED}${TARGET_BRANCH}:already-exists "
              echo "::endgroup::"
              continue
            fi

            # Create backport branch. A failure here (e.g. dirty state left
            # by a prior target) must not abort the loop and skip remaining
            # targets, so fall back to a clean checkout and record the error.
            if ! git checkout -B "${BACKPORT_BRANCH}" "origin/${TARGET_BRANCH}"; then
              echo "::error::Failed to create branch ${BACKPORT_BRANCH} for ${TARGET_BRANCH}"
              FAILED="${FAILED}${TARGET_BRANCH}:branch-create-failed "
              git checkout main || git checkout -f main
              echo "::endgroup::"
              continue
            fi

            # Try cherry-pick
            if git cherry-pick "${MERGE_COMMIT}"; then
              if [ "$REMOTE_BACKPORT_EXISTS" = true ]; then
                PUSH_CMD=(git push --force-with-lease origin "${BACKPORT_BRANCH}")
              else
                PUSH_CMD=(git push origin "${BACKPORT_BRANCH}")
              fi

              # A push failure for one target must not abort the loop and
              # prevent remaining targets from being attempted.
              if "${PUSH_CMD[@]}"; then
                SUCCESS="${SUCCESS}${TARGET_BRANCH}:${BACKPORT_BRANCH} "
                echo "Successfully created backport branch: ${BACKPORT_BRANCH}"
              else
                echo "::error::Failed to push ${BACKPORT_BRANCH} for ${TARGET_BRANCH}"
                FAILED="${FAILED}${TARGET_BRANCH}:push-failed "
              fi

              # Return to main (keep the branch, we need it for PR)
              git checkout main || git checkout -f main
            else
              # Get conflict info
              CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ',')
              git cherry-pick --abort || true

              echo "::error::Cherry-pick failed due to conflicts"
              FAILED="${FAILED}${TARGET_BRANCH}:conflicts:${CONFLICTS} "

              # Clean up the failed branch
              git checkout main || git checkout -f main
              git branch -D "${BACKPORT_BRANCH}" || true
            fi

            echo "::endgroup::"
          done

          echo "success=${SUCCESS}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED}" >> $GITHUB_OUTPUT

          # Do not exit non-zero when only some targets failed: the clean
          # backports must still get their PRs (next step) and the conflicts
          # must still be reported. A dedicated final step re-reds the run so
          # the failure stays visible and retryable.

      - name: Create PR for each successful backport
        if: steps.filter-targets.outputs.skip != 'true' && steps.backport.outputs.success
        env:
          GH_TOKEN: ${{ secrets.PR_GH_TOKEN }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
        run: |
          # Get PR data for manual triggers
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_DATA=$(gh pr view ${{ inputs.pr_number }} --json title,author)
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
            PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
            PR_AUTHOR_IS_BOT=$(echo "$PR_DATA" | jq -r '.author.is_bot')
          else
            PR_TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
            PR_AUTHOR=$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")
            PR_AUTHOR_IS_BOT=$(jq -r '.pull_request.user.type == "Bot"' "$GITHUB_EVENT_PATH")
          fi

          for backport in ${{ steps.backport.outputs.success }}; do
            IFS=':' read -r target branch <<< "${backport}"

            if PR_URL=$(gh pr create \
              --base "${target}" \
              --head "${branch}" \
              --title "[backport ${target}] ${PR_TITLE}" \
              --body "Backport of #${PR_NUMBER} to \`${target}\`"$'\n\n'"Automatically created by backport workflow." \
              --label "backport" 2>&1); then

              # Extract PR number from URL
              PR_NUM=$(echo "${PR_URL}" | grep -o '[0-9]*$')

              if [ -n "${PR_NUM}" ]; then
                if [ "${PR_AUTHOR_IS_BOT}" != "true" ]; then
                  gh pr edit "${PR_NUM}" --add-assignee "${PR_AUTHOR}" \
                    || echo "::warning::Failed to assign @${PR_AUTHOR} to PR #${PR_NUM}"
                fi
                gh pr merge "${PR_NUM}" --auto --squash --repo "${{ github.repository }}" \
                  || echo "::warning::Failed to enable auto-merge for PR #${PR_NUM}"
                gh pr comment "${PR_NUMBER}" --body "@${PR_AUTHOR} Successfully backported to #${PR_NUM}"
              fi
            else
              echo "::error::Failed to create PR for ${target}: ${PR_URL}"
              # Still try to comment on the original PR about the failure
              gh pr comment "${PR_NUMBER}" --body "@${PR_AUTHOR} Backport branch created but PR creation failed for \`${target}\`. Please create the PR manually from branch \`${branch}\`"
            fi
          done

      # Runs whenever a target failed, independent of whether the PR-creation
      # step for the clean targets succeeded — a hiccup there must not suppress
      # the conflict reports.
      - name: Comment on failures
        if: >-
          !cancelled() &&
          steps.filter-targets.outputs.skip != 'true' &&
          steps.backport.outputs.failed != ''
        env:
          BACKPORT_AGENT_PROMPT_TEMPLATE: |
            Backport PR #${PR_NUMBER} (${PR_URL}) to ${target}.
            Cherry-pick merge commit ${MERGE_COMMIT} onto new branch
            ${BACKPORT_BRANCH} from origin/${target}.
            Resolve conflicts in: ${CONFLICTS_INLINE}.

            ${STACK_HINT}

            For test snapshots (browser_tests/**/*-snapshots/), accept PR version if
            changed in original PR, else keep target. For package.json versions, keep
            target branch. For pnpm-lock.yaml, regenerate with pnpm install.
            Ask user for non-obvious conflicts.
            Create PR titled "[backport ${target}] <original title>" with label "backport".
            See .github/workflows/pr-backport.yaml for workflow details.
          COMMENT_BODY_TEMPLATE: |
            ### ⚠️ Backport to `${target}` failed

            **Reason:** Merge conflicts detected during cherry-pick of `${MERGE_COMMIT_SHORT}`

            The auto-backport could not be completed automatically. Please backport
            manually onto branch `${BACKPORT_BRANCH}` (from `origin/${target}`) and
            open a PR to `${target}`.

            ${STACK_HINT}

            <details>
            <summary>📄 Conflicting files</summary>

            ```
            ${CONFLICTS_BLOCK}
            ```

            </details>

            <details>
            <summary>🤖 Prompt for AI Agents</summary>

            ```
            ${AGENT_PROMPT}
            ```

            </details>

            ---
            cc @${PR_AUTHOR}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_DATA=$(gh pr view ${{ inputs.pr_number }} --json author,mergeCommit)
            PR_NUMBER="${{ inputs.pr_number }}"
            PR_AUTHOR=$(echo "$PR_DATA" | jq -r '.author.login')
            MERGE_COMMIT=$(echo "$PR_DATA" | jq -r '.mergeCommit.oid')
          else
            PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
            PR_AUTHOR=$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")
            MERGE_COMMIT=$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")
          fi

          # A merged PR can be locked (the CLA check locks merged PRs), which
          # makes `gh pr comment` fail and would otherwise swallow the failure
          # notice entirely. Fall back to a tracking issue that mentions the
          # author so a failed backport is never reported to nobody — the exact
          # gap that left PRs #14018-#14021 to be backported by hand.
          notify() {
            local body="$1"
            local context="$2"
            if gh pr comment "${PR_NUMBER}" --body "${body}"; then
              return
            fi
            echo "::warning::Could not comment on PR #${PR_NUMBER} (${context}); opening a tracking issue instead."
            local title="Backport of #${PR_NUMBER} to ${target} failed"
            gh issue create --title "${title}" --body "${body}" --label backport \
              || gh issue create --title "${title}" --body "${body}" \
              || echo "::warning::Also failed to open a tracking issue for #${PR_NUMBER} (${context})."
          }

          for failure in ${{ steps.backport.outputs.failed }}; do
            IFS=':' read -r target reason conflicts <<< "${failure}"

            SAFE_TARGET=$(echo "$target" | tr '/' '-')
            BACKPORT_BRANCH="backport-${PR_NUMBER}-to-${SAFE_TARGET}"

            if [ "${reason}" = "branch-missing" ]; then
              notify "@${PR_AUTHOR} Backport failed: Branch \`${target}\` does not exist" "missing branch ${target}"

            elif [ "${reason}" = "already-exists" ]; then
              notify "@${PR_AUTHOR} Commit \`${MERGE_COMMIT}\` already exists on branch \`${target}\`. No backport needed." "already-backported ${target}"

            elif [ "${reason}" = "branch-create-failed" ]; then
              notify "@${PR_AUTHOR} Backport to \`${target}\` failed: could not create the backport branch. Please retry or backport manually." "branch-create-failed ${target}"

            elif [ "${reason}" = "push-failed" ]; then
              notify "@${PR_AUTHOR} Backport to \`${target}\` cherry-picked cleanly but the push failed. Please retry or push the backport branch manually." "push-failed ${target}"

            elif [ "${reason}" = "conflicts" ]; then
              CONFLICTS_INLINE=$(echo "${conflicts}" | tr ',' ' ')
              PR_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"

              # Stacked PRs conflict here until the one below them merges into the target; note other open backports so the failure reads as that artifact, not a real conflict.
              STACK_HINT=""
              OPEN_BACKPORTS=$(
                gh pr list --repo "${GITHUB_REPOSITORY}" --state open \
                  --base "${target}" --label backport --json number \
                  --jq '[.[].number | "#\(.)"] | join(", ")' 2>/dev/null
              ) || OPEN_BACKPORTS=""
              if [ -n "${OPEN_BACKPORTS}" ]; then
                STACK_HINT="> **This may be a stacking conflict rather than a real one.** ${OPEN_BACKPORTS} are still open against \`${target}\`. If this PR sits on top of any of them, the conflict will disappear once they merge — wait for that, then remove and re-add the \`needs-backport\` label to re-run this workflow."
              fi

              export PR_NUMBER PR_URL MERGE_COMMIT target BACKPORT_BRANCH CONFLICTS_INLINE STACK_HINT

              # envsubst is provided by gettext-base
              if ! command -v envsubst >/dev/null 2>&1; then
                sudo apt-get update && sudo apt-get install -y gettext-base
              fi

              AGENT_PROMPT=$(envsubst '${PR_NUMBER} ${PR_URL} ${target} ${MERGE_COMMIT} ${BACKPORT_BRANCH} ${CONFLICTS_INLINE} ${STACK_HINT}' <<<"$BACKPORT_AGENT_PROMPT_TEMPLATE")

              # Use fenced code block for conflicts to handle special chars in filenames
              CONFLICTS_BLOCK=$(echo "${conflicts}" | tr ',' '\n')
              MERGE_COMMIT_SHORT="${MERGE_COMMIT:0:7}"

              export target MERGE_COMMIT_SHORT BACKPORT_BRANCH CONFLICTS_BLOCK AGENT_PROMPT PR_AUTHOR STACK_HINT
              COMMENT_BODY=$(envsubst '${target} ${MERGE_COMMIT_SHORT} ${BACKPORT_BRANCH} ${CONFLICTS_BLOCK} ${AGENT_PROMPT} ${PR_AUTHOR} ${STACK_HINT}' <<<"$COMMENT_BODY_TEMPLATE")

              notify "${COMMENT_BODY}" "cherry-pick conflict on ${target} (backport manually onto ${BACKPORT_BRANCH})"
            fi
          done

      # Only clear needs-backport once every target succeeded. If any target
      # failed, the label stays so a re-run retries the remainder (targets that
      # already landed are skipped by "Filter already backported targets").
      - name: Remove needs-backport label
        if: steps.filter-targets.outputs.skip != 'true' && steps.backport.outputs.failed == ''
        run: gh pr edit ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }} --remove-label "needs-backport"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-red the run for partial failures, after the clean backports have
      # been turned into PRs and the conflicts reported above.
      - name: Fail if any backport target failed
        if: >-
          !cancelled() &&
          steps.filter-targets.outputs.skip != 'true' &&
          steps.backport.outputs.failed != ''
        env:
          FAILED_TARGETS: ${{ steps.backport.outputs.failed }}
        run: |
          echo "::error::One or more backport targets failed: ${FAILED_TARGETS}"
          exit 1
