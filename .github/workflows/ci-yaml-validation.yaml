name: 'CI: YAML Validation'

on:
  push:
    branches:
      - main
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/scripts/test_telemetry_cost_patterns.py'
  pull_request:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/scripts/test_telemetry_cost_patterns.py'

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint

      - name: Validate YAML syntax and style
        run: ./tools/ci/src/cicd/check-yaml.sh

      - name: Test telemetry cost patterns
        run: python .github/scripts/test_telemetry_cost_patterns.py

      - name: Check ComfyUI container versions
        run: ./tools/ci/src/cicd/check-comfyui-container-version.sh
