---
name: 'Release: Website Rollback'

run-name: 'Website production ${{ inputs.operation }} to ${{ inputs.target_deployment }}'

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'rollback: serve an older production deployment and pause automatic production deploys. restore: promote a deployment and resume them'
        required: true
        type: choice
        options:
          - rollback
          - restore
      target_deployment:
        description: 'A production deployment of the website project: its dpl_ ID or immutable https://*.vercel.app URL, from the website-production deployment history'
        required: true
        type: string
      confirmation:
        description: 'Type the chosen operation in capitals followed by WEBSITE PRODUCTION, for example ROLLBACK WEBSITE PRODUCTION'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: website-production
      url: https://comfy.org
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_WEBSITE_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_TOKEN }}
      VERCEL_SCOPE: comfyui
      OPERATION: ${{ inputs.operation }}
      TARGET_DEPLOYMENT: ${{ inputs.target_deployment }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate the requested production mutation
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "::error title=Dispatch from main::Production was not changed. Run this workflow from main, not $GITHUB_REF."
            exit 1
          fi

          expected="${OPERATION^^} WEBSITE PRODUCTION"

          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "::error title=Confirmation mismatch::Type $expected exactly."
            exit 1
          fi

          if [[ ! "$TARGET_DEPLOYMENT" =~ ^(dpl_[A-Za-z0-9]+|https://[A-Za-z0-9.-]+\.vercel\.app)$ ]]; then
            echo '::error title=Invalid deployment target::Use an exact Vercel deployment ID or https://*.vercel.app URL.'
            exit 1
          fi

      - name: Require a production deployment of the website project
        run: |
          deployment=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${TARGET_DEPLOYMENT#https://}?teamId=$VERCEL_ORG_ID")
          if [[ "$(jq -r .projectId <<<"$deployment")" != "$VERCEL_PROJECT_ID" || "$(jq -r .target <<<"$deployment")" != production ]]; then
            echo '::error title=Ineligible deployment::The target must be a production deployment of the website project.'
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@64.0.1

      - name: Change the production deployment
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$OPERATION" == 'rollback' ]]; then
            vercel rollback "$TARGET_DEPLOYMENT" --scope="$VERCEL_SCOPE" --timeout=3m
          else
            vercel promote "$TARGET_DEPLOYMENT" --scope="$VERCEL_SCOPE" --timeout=3m
          fi

      - name: Record the production change
        run: |
          {
            echo "## Website production $OPERATION applied"
            echo
            echo "- Target: \`$TARGET_DEPLOYMENT\`"
            echo "- Actor: \`$GITHUB_ACTOR\`"
            if [[ "$OPERATION" == 'rollback' ]]; then
              echo '- Vercel no longer assigns new production deployments. Run restore once the fix is on main.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the canonical website responds
        run: curl --fail --silent --show-error --location --output /dev/null --max-time 30 https://comfy.org
