name: Publish Comfy Multi-Player

on:
  push:
    tags:
      - 'comfy-multi-player-v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-comfy-multi-player-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: verify / publish / release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup frontend workspace
        uses: ./.github/actions/setup-frontend
        with:
          node_cache: 'false'

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org

      - name: Require tag to match package version
        working-directory: packages/comfy-multi-player
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; console.log(packageJson.version)")"
          test "$RELEASE_TAG" = "comfy-multi-player-v$package_version"

      - name: Verify package
        run: |
          pnpm --filter @comfyorg/comfy-multi-player run typecheck
          pnpm --filter @comfyorg/comfy-multi-player run verify:corpus
          pnpm --filter @comfyorg/comfy-multi-player run check:purity
          pnpm --filter @comfyorg/comfy-multi-player run check:stateless
          pnpm --filter @comfyorg/comfy-multi-player run check:profile-claims
          pnpm --filter @comfyorg/comfy-multi-player run check:coderabbit
          pnpm --filter @comfyorg/comfy-multi-player run check:imports
          pnpm --filter @comfyorg/comfy-multi-player run check:pins
          # already covered as an explicit probe by check:stateless above
          pnpm --filter @comfyorg/comfy-multi-player test --exclude test/stateless.test.ts
          pnpm --filter @comfyorg/comfy-multi-player run test:clock-matrix

      - name: Verify package contents
        working-directory: packages/comfy-multi-player
        run: |
          pnpm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/comfy-multi-player-pack.json"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFile } from 'node:fs/promises'

          const packed = JSON.parse(
            await readFile(`${process.env.RUNNER_TEMP}/comfy-multi-player-pack.json`, 'utf8')
          )
          const files = new Set(packed.files.map(({ path }) => path))
          for (const required of ['dist/index.js', 'dist/index.d.ts']) {
            if (!files.has(required)) throw new Error(`package is missing ${required}`)
          }
          const source = [...files].find((path) => path.startsWith('src/'))
          if (source) throw new Error(`package unexpectedly includes ${source}`)

          const manifest = JSON.parse(
            execFileSync('tar', ['-xOf', packed.filename, 'package/package.json'], {
              encoding: 'utf8'
            })
          )
          if (manifest.main !== './dist/index.js') throw new Error('published main is not dist')
          if (manifest.types !== './dist/index.d.ts') throw new Error('published types are not dist')
          const rootExport = manifest.exports?.['.']
          if (rootExport?.import !== './dist/index.js' || rootExport?.types !== './dist/index.d.ts') {
            throw new Error('published exports are not dist')
          }
          NODE

      - name: Publish to npm with provenance
        working-directory: packages/comfy-multi-player
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          --title "@comfyorg/comfy-multi-player ${GITHUB_REF_NAME#comfy-multi-player-v}"
