name: Check AI Co-Authors

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-ai-co-authors:
    name: Check for AI agent co-author trailers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commits for AI co-author trailers
        # Preserve the imported comfy-multi-player history byte-for-byte while
        # continuing to reject AI trailers on commits authored in this repo.
        run: >-
          bash .github/scripts/check-ai-co-authors.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"
          "^2361050c3e3cc6d210086acdfdf6c35c44cf280c"
