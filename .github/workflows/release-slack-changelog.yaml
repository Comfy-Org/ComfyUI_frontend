# Announces a published release in Slack: a two-sentence headline in the
# channel, the full changelog in thread replies underneath it.
#
# Moved here from Comfy-Org/Comfy-PR's `gh-frontend-release-notification` task.
# That task polled this repo every five minutes and posted the whole body
# inline, which for v1.56.1 (623 PRs, 89KB of notes) meant a wall of text in
# #frontend. A release event is already a push, so neither the poll nor its
# MongoDB dedup collection moved across.
#
# DO NOT SET SLACK_FRONTEND_CHANNEL_ID WHILE THE COMFY-PR TASK IS STILL RUNNING
# — both post to the same channel and the release would be announced twice.
# With the variable unset this job is a no-op on `release: published`, which is
# the intended state until the Comfy-PR side is retired.
name: 'Release: Slack Changelog'

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to announce (e.g. v1.56.1)'
        required: true
        type: string

# Keyed by tag, and NOT cancel-in-progress: a cancelled run can leave a headline
# posted with only some of its thread replies underneath it. There is no
# persisted thread identity, so a re-run posts a second headline and a second
# full thread rather than resuming — re-dispatch only after a failed run, and
# expect to clean up whatever that run already posted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  announce:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Read back through the API for both triggers rather than using
      # github.event.release.*: it gives workflow_dispatch the same shape, and
      # release notes are attacker-influenced text (any contributor's PR title
      # lands in them) that should never be expanded into a shell script. The
      # body stays in this file and never enters the environment — at ~90KB it
      # is most of Linux's 128KB MAX_ARG_STRLEN budget, and overflowing that
      # breaks every later step with "Argument list too long".
      - name: Resolve release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > release.json
          echo "Resolved $(jq -r '.tag_name' release.json) ($(wc -c < release.json) bytes)"

      - name: Post changelog to Slack
        env:
          RELEASE_JSON: release.json
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_FRONTEND_CHANNEL_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_CHANNEL_ID}" ]; then
            # Hard failure on a manual run: someone testing the cutover should
            # not get a green check for a post that never happened. On the
            # release trigger it stays a warning, so an unconfigured variable
            # cannot fail a release.
            if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
              echo "::error::SLACK_FRONTEND_CHANNEL_ID is unset — nothing was posted."
              exit 1
            fi
            echo "::warning::SLACK_FRONTEND_CHANNEL_ID is unset — skipping the Slack post."
            exit 0
          fi
          pnpm exec tsx scripts/cicd/release-slack-changelog.ts

      # Renders what was (or would have been) posted, so a run with the channel
      # variable still unset shows the message rather than only saying it
      # skipped. Written to a file first: piping tsx straight into `head` kills
      # it with SIGPIPE partway through and silently truncates the render.
      - name: Job summary
        if: always()
        env:
          RELEASE_JSON: release.json
          DRY_RUN: 'true'
        run: |
          set -uo pipefail
          pnpm exec tsx scripts/cicd/release-slack-changelog.ts > preview.txt 2>&1 || true
          {
            echo '## Release Slack changelog'
            echo ''
            # Six backticks and a line limit: release notes legitimately contain
            # triple-backtick fences, and `head -c` would cut a multi-byte
            # character in half.
            echo '``````text'
            head -n 120 preview.txt
            echo '``````'
          } >> "$GITHUB_STEP_SUMMARY"
