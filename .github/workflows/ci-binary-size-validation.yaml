# Description: Blocks PRs that add or replace a binary file above the size
# limit. Bypass at your peril by adding the 'allow-large-binaries' label to the PR.
name: 'CI: Binary Size Validation'

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) &&
      github.event.label.name != 'allow-large-binaries' &&
      github.run_id ||
      'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  binary-size:
    if: >-
      ${{
        (
          !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) ||
          github.event.label.name == 'allow-large-binaries'
        ) &&
        !contains(github.event.pull_request.labels.*.name, 'allow-large-binaries')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Block oversized binary files
        run: ./scripts/cicd/check-binary-size.sh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
          MAX_BINARY_BYTES: '1048576'
