name: 'PR: Playwright Videos'

on:
  workflow_run:
    workflows: ['CI: Playwright Videos']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'Comfy-Org/ComfyUI_frontend' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve current PR
        id: pr
        uses: ./.github/actions/resolve-pr-from-workflow-run

      - name: Download video report
        id: download
        if: steps.pr.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: playwright-report-new-tests
          path: video-report
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.download.outcome == 'success'

      - name: Deploy video report
        id: deploy
        if: steps.download.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          OUTPUT=$(pnpm dlx wrangler@4.147.0 pages deploy video-report \
            --project-name=comfyui-playwright-chromium --branch="pr-${PR_NUMBER}-new-tests")
          echo "$OUTPUT"
          URL=$(printf '%s\n' "$OUTPUT" | { grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' || true; } | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Write video section
        id: section
        if: >-
          steps.pr.outputs.skip != 'true' &&
          (steps.download.outcome == 'success' ||
          github.event.workflow_run.conclusion != 'success')
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          REPORT_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          {
            echo '## Playwright video walkthroughs'
            echo
            printf 'Recording run: **%s**. [Run and downloadable reports](%s).\n' "$RESULT" "$RUN_URL"
            printf '\nRecorded head: %s%s%s.\n' '`' "$HEAD_SHA" '`'
            if [ -n "$REPORT_URL" ]; then
              printf '\n[View tests with embedded video](%s).\n' "$REPORT_URL"
            else
              printf '\nNo hosted video report is available. See the run for failures or artifacts.\n'
            fi
            echo
            echo 'Videos are supplementary and do not gate E2E. Reports may be incomplete if a recording shard failed or timed out.'
          } > video-section.md

      - name: Publish video section
        if: steps.section.outcome == 'success'
        uses: ./.github/actions/post-pr-report-comment
        with:
          pr-number: ${{ steps.pr.outputs.number }}
          report-file: video-section.md
          comment-marker: '<!-- playwright-video-new-tests -->'
          token: ${{ github.token }}
