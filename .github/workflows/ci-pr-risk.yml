name: Disposable feature flag verification for PR 17526

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: Comma-separated disposable PR numbers.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e17f329bc54a5cb56038e18a16a74c5fdcd3091e
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Verify real check publication under failing metadata
        uses: actions/github-script@v9
        env:
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const { execFileSync } = require('node:child_process')
            const { writeFileSync } = require('node:fs')
            const candidate = 'e17f329bc54a5cb56038e18a16a74c5fdcd3091e'
            const cases = {
              'codex/verify-17526-tooling': { verdict: 'not-applicable', path: null },
              'codex/verify-17526-mixed': { verdict: 'review-required', path: 'src/platform/keybindings/keybindingService.ts' },
              'codex/verify-17526-runtime': { verdict: 'needs-flag', path: 'src/platform/workspace/api/workspaceApi.ts' }
            }
            const prs = process.env.PR_NUMBERS.split(',').map(Number)
            if (prs.length !== 3 || new Set(prs).size !== 3 || prs.some(n => !Number.isInteger(n) || n < 1)) throw new Error('Expected three distinct fixture PRs')
            const results = []
            for (const pull_number of prs) {
              const { data: pull } = await github.rest.pulls.get({ ...context.repo, pull_number })
              const expected = cases[pull.head.ref]
              if (!expected || pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` || pull.base.ref !== 'main' || !pull.draft || pull.state !== 'open' || !pull.title.startsWith('[DISPOSABLE]')) throw new Error('Refusing to mutate a non-fixture PR')
              const sha = pull.head.sha
              const { data: failure } = await github.rest.checks.create({
                ...context.repo, name: 'disposable-metadata-failure', head_sha: sha,
                status: 'completed', conclusion: 'failure',
                output: { title: 'Intentional verification fixture', summary: 'Synthetic metadata failure for #17526. This is not a product test failure. Do not merge this disposable PR.' }
              })
              const phases = []
              for (const risk of ['high', 'medium']) {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({ ...context.repo, issue_number: pull_number, per_page: 100 })
                await github.rest.issues.setLabels({ ...context.repo, issue_number: pull_number, labels: [...labels.map(l => l.name).filter(n => !n.startsWith('risk:')), `risk:${risk}`] })
                const env = { ...process.env, PR_NUMBER: String(pull_number) }
                execFileSync('node', ['--experimental-strip-types', 'scripts/cicd/feature-flag-policy.ts'], { env, stdio: 'inherit' })
                const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: sha, check_name: 'feature-flag-policy', filter: 'latest', per_page: 100 })
                const check = data.check_runs[0]
                if (!check || check.head_sha !== sha || check.status !== 'completed' || check.conclusion !== 'neutral' || check.output.title !== `Feature flag advice: ${expected.verdict}`) throw new Error(`Unexpected published verdict for #${pull_number}`)
                if (expected.path && !check.output.summary.includes(expected.path)) throw new Error('Runtime path was silently excluded')
                const { data: stillFailed } = await github.rest.checks.get({ ...context.repo, check_run_id: failure.id })
                if (stillFailed.conclusion !== 'failure') throw new Error('Metadata failure fixture no longer fails')
                phases.push({ risk, conclusion: check.conclusion, title: check.output.title, url: check.html_url, summary: check.output.summary })
              }
              if (phases[0].summary !== phases[1].summary) throw new Error('Risk-label change altered policy advice')
              results.push({ pr: pull_number, sha, expected: expected.verdict, metadataFailure: failure.html_url, phases })
            }
            writeFileSync('verification-17526.json', JSON.stringify({ candidate, results }, null, 2))
            await core.summary.addHeading('PR #17526 disposable verification: PASS').addRaw(`Candidate: ${candidate}\n\n`).addTable([
              ['PR', 'Expected advice', 'risk:high + failed metadata', 'risk:medium + failed metadata'],
              ...results.map(r => [`#${r.pr}`, r.expected, r.phases[0].conclusion, r.phases[1].conclusion])
            ]).addRaw('\nAll policy checks were read back from GitHub on the fixture head SHA. No fixture was merged.\n').write()
      - uses: actions/upload-artifact@v6
        with:
          name: verification-17526
          path: verification-17526.json
          if-no-files-found: error
