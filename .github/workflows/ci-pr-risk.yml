name: CI - PR Risk Grade

# Thin caller for the shared ADVISORY PR risk grader (shadow check). Grades
# every PR R0 (safest) .. R3 (riskiest) against .github/risk.json (read from
# the BASE ref), syncs exactly one `risk:*` label and publishes the per-axis
# reasoning as a neutral `PR risk (advisory)` Check Run — nothing gates,
# routes, or merges on it. Disagree with a grade by adding the human-owned
# `risk-dispute` label plus a comment saying why.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Grade ONE pr by number (enrollment backfill, or a manual re-grade).
        required: false
      pr_numbers:
        description: Grade several, comma-separated (12,15,20). Wins over pr_number.
        required: false

concurrency:
  # Must carry the resolved target: on workflow_dispatch the event PR number is
  # empty, and on pull_request the inputs are empty — one expression serves
  # both. Trailing run_id keeps two no-input dispatches from cancelling each
  # other. Keep a dispatched batch under ~40 numbers (255-char group cap).
  group: ${{ github.workflow }}-${{ inputs.pr_numbers || inputs.pr_number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-risk:
    # Token guards, not risk judgements: fork and Dependabot pull_request runs
    # get a read-only GITHUB_TOKEN, so the label write would 403. Scoped to the
    # pull_request event — an unscoped head.repo check makes workflow_dispatch
    # skip silently. Fork PRs can still be graded on demand via pr_number.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read # the .github/risk.json override, read from the BASE ref
      issues: write # create the risk:* labels repo-side on first use
      pull-requests: write # the label write rides pull-requests, not issues
      # write, not read: newer upstream pins declare `checks: write` on their
      # opt-in publish-check job, and GitHub validates every nested job's
      # declaration against this block at startup — even jobs an `if:` skips.
      # A read grant startup-fails every run the moment the pin moves forward.
      checks: write # the rollup read + the opt-in Check Run publish
      actions: read # CheckRun -> checkSuite -> workflowRun for self-exclusion
      statuses: read
    # Pinned to github-workflows main (eaee6df); keep workflows_ref in
    # lock-step so the grader + risk map schema load from the same commit.
    # This permissions block must stay a superset of the UNION of every job
    # the reusable workflow declares, including jobs whose `if:` skips them.
    uses: Comfy-Org/github-workflows/.github/workflows/pr-risk.yml@eaee6df998c39943bc6133ea6fa7cee8d504c41f # github-workflows main (eaee6df)
    with:
      workflows_ref: eaee6df998c39943bc6133ea6fa7cee8d504c41f
      # Required: upstream defaults enabled to FALSE. The repository variable
      # RISK_CONFIG outranks this in both directions ({"enabled": false} is a
      # kill switch that needs no PR).
      enabled: true
      pr_number: ${{ inputs.pr_number }}
      pr_numbers: ${{ inputs.pr_numbers }}
      # The label is mutable and keeps no history; this publishes the tier AND
      # the per-axis reasoning behind it as a commit-attached record, which is
      # what makes a disputed grade answerable after the fact. The conclusion
      # is hardcoded `neutral` upstream, so a published check can never fail a
      # PR. The `checks: write` it needs is already granted above (every caller
      # owes that grant whether or not it opts in).
      #
      # Three limits, stated so nobody reads more into the artifact than it
      # carries:
      #   * ABSENCE, not conclusion, is the failure mode. This job's `if:`
      #     above skips fork and Dependabot PRs, and upstream's publish-check
      #     gates on the kill switch even for a manual dispatch while the grade
      #     job deliberately does not — so a dispatched re-grade with
      #     `RISK_CONFIG {"enabled": false}` still rewrites the label and
      #     publishes nothing. Never mark `PR risk (advisory)` required in
      #     branch protection: those PRs would block forever on a check that is
      #     never created.
      #   * NOT ONE PER COMMIT. Upstream only ever POSTs, never updates, so
      #     each re-grade of the same head sha (reopen, ready_for_review after
      #     opened, a re-run, a dispatch) APPENDS a check instead of revising
      #     the last one. A commit can carry several with differing tiers and
      #     nothing marking which is current; the newest wins, and the run log
      #     remains the tiebreak. Same reason a check cannot be attributed to a
      #     PR: it is commit-scoped, so two PRs sharing a head sha get two
      #     indistinguishable ones.
      #   * IT PERTURBS THE NEXT GRADE OF THE SAME SHA. An existing check makes
      #     the rollup non-empty, so the grader's 120s "checks have not
      #     registered yet" grace window stops applying to a re-grade, which
      #     can settle a poll early and floor the reversibility axis. Tier
      #     only, re-grades only, and advisory throughout.
      check_run: true
