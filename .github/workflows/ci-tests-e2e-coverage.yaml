name: 'CI: E2E Coverage'

on:
  workflow_run:
    workflows: ['CI: Tests E2E']
    types:
      - completed

concurrency:
  group: e2e-coverage-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  publish:
    if: >
      github.repository == 'Comfy-Org/ComfyUI_frontend' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has-coverage: ${{ steps.coverage.outputs.has-coverage }}

    steps:
      - name: Checkout trusted workflow actions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/resolve-pr-from-workflow-run
          persist-credentials: false

      - name: Resolve PR from workflow_run context
        id: pr-meta
        if: github.event.workflow_run.event == 'pull_request'
        uses: ./.github/actions/resolve-pr-from-workflow-run

      - name: Download packaged coverage data
        uses: dawidd6/action-download-artifact@0bd50d53a6d7fb5cb921e607957e9cc12b4ce392 # v12
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: e2e-coverage
          path: coverage/playwright
          if_no_artifact_found: warn

      - name: Detect packaged coverage data
        id: coverage
        run: |
          if [ -f coverage/playwright/coverage.lcov ]; then
            echo "has-coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-coverage=false" >> "$GITHUB_OUTPUT"
            echo "No packaged E2E coverage artifact found; treating this run as skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload merged coverage data
        if: steps.coverage.outputs.has-coverage == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage
          path: coverage/playwright/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload E2E coverage to Codecov
        if: >
          steps.coverage.outputs.has-coverage == 'true' &&
          (github.event.workflow_run.event != 'pull_request' ||
            steps.pr-meta.outputs.skip != 'true')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/playwright/coverage.lcov
          flags: e2e
          override_branch: ${{ github.event.workflow_run.head_branch }}
          override_commit: ${{ steps.pr-meta.outputs.head-sha || github.event.workflow_run.head_sha }}
          override_pr: ${{ steps.pr-meta.outputs.number }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Download packaged HTML report
        if: steps.coverage.outputs.has-coverage == 'true'
        uses: dawidd6/action-download-artifact@0bd50d53a6d7fb5cb921e607957e9cc12b4ce392 # v12
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: e2e-coverage-html
          path: coverage/html
          if_no_artifact_found: warn

      - name: Upload HTML report artifact
        if: steps.coverage.outputs.has-coverage == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-html
          path: coverage/html/
          retention-days: 30
          if-no-files-found: warn

  deploy:
    needs: publish
    if: >
      github.event.workflow_run.head_branch == 'main' &&
      needs.publish.outputs.has-coverage == 'true' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download HTML report
        uses: actions/download-artifact@v8
        with:
          name: e2e-coverage-html
          path: coverage/html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: coverage/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
