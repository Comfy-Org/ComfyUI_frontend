# Description: Lint and format verification for GitHub merge queue runs and
# post-merge pushes to the default and release branches.
# The push trigger catches merge-skew accumulation. Pre-merge checks only look
# at proposed state: pull_request evaluates a single PR's diff, and merge_group
# evaluates the temporary merge-queue ref (the projected post-merge result of
# the queued PRs). The push trigger instead validates the already-merged branch
# state, catching failures (e.g. unused exports) that accumulate on a branch and
# that no pre-merge check ever evaluates together.
name: 'CI: Lint Format'

on:
  workflow_call:
  push:
    branches:
      - main
      - 'cloud/**'
      - 'core/**'

concurrency:
  group: ${{ github.workflow }}-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LINT_CACHE_PATHS: |
    .eslintcache
    .stylelintcache
  TYPECHECK_CACHE_PATHS: |
    node_modules/.cache/tsbuildinfo
    packages/*/node_modules/.cache/tsbuildinfo

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Restore lint caches
        id: lint-cache
        uses: ./.github/actions/tool-cache-restore
        with:
          scope: lint
          path: ${{ env.LINT_CACHE_PATHS }}

      - name: Verify lint
        run: pnpm lint

      - name: Verify format
        run: pnpm format:check

      - name: Save lint caches
        if: always()
        uses: ./.github/actions/tool-cache-save
        with:
          cache-key: ${{ steps.lint-cache.outputs.cache-key }}
          path: ${{ env.LINT_CACHE_PATHS }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Restore incremental typecheck cache
        id: typecheck-cache
        uses: ./.github/actions/tool-cache-restore
        with:
          scope: typecheck
          path: ${{ env.TYPECHECK_CACHE_PATHS }}

      - name: Typecheck application and packages
        run: pnpm typecheck && pnpm typecheck:workspaces

      - name: Save incremental typecheck cache
        if: always()
        uses: ./.github/actions/tool-cache-save
        with:
          cache-key: ${{ steps.typecheck-cache.outputs.cache-key }}
          path: ${{ env.TYPECHECK_CACHE_PATHS }}

  typecheck-aux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Restore incremental typecheck cache
        id: typecheck-cache
        uses: ./.github/actions/tool-cache-restore
        with:
          scope: typecheck-aux
          path: ${{ env.TYPECHECK_CACHE_PATHS }}

      - name: Typecheck browser tests, scripts and tools
        uses: ./.github/actions/typecheck-aux

      - name: Save incremental typecheck cache
        if: always()
        uses: ./.github/actions/tool-cache-save
        with:
          cache-key: ${{ steps.typecheck-cache.outputs.cache-key }}
          path: ${{ env.TYPECHECK_CACHE_PATHS }}

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          # Blobless full history: pnpm locale:check fetches the English
          # source blobs recorded in src/locales/.source-manifest.json
          fetch-depth: 0
          filter: blob:none

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Verify knip, locale integrity and ADR index
        uses: ./.github/actions/repo-checks

  # Single stable branch-protection context over the parallel jobs above.
  lint-and-format:
    needs: [lint, typecheck, typecheck-aux, repo-checks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify every lint and format job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success")' > /dev/null ||
            { echo "::error::At least one lint/format job did not succeed."; exit 1; }
