name: 'Validation: Website Production Rollback'

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Immutable Vercel deployment ID captured before the canary deploy'
        required: true
        type: string
      expected_sha:
        description: 'Source SHA expected at the canonical hostname after rollback'
        required: true
        type: string
      perform_rollback:
        description: 'Change production after target validation; false performs a safe preflight only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: website-production-rollback
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_WEBSITE_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_TOKEN }}
  VERCEL_SCOPE: comfyui

jobs:
  rollback:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project information
        run: vercel pull --yes --environment=production

      - name: Verify the captured deployment
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          if [[ ! "$TARGET_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "::error::Invalid Vercel deployment ID"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected SHA must be a full lowercase Git commit SHA"
            exit 1
          fi
          DEPLOYMENT=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$TARGET_DEPLOYMENT?teamId=$VERCEL_ORG_ID")
          TARGET_URL=$(jq -er \
            --arg deploymentId "$TARGET_DEPLOYMENT" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            'select(.id == $deploymentId and (.projectId // .project.id) == $projectId) | .url' \
            <<< "$DEPLOYMENT")
          ACTUAL_SHA=$(curl -fsS \
            -H 'Cache-Control: no-cache' \
            "https://$TARGET_URL/__build.json?preflight=$GITHUB_RUN_ID" |
            jq -er '.sha')
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Deployment $TARGET_DEPLOYMENT serves $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          {
            echo "**Validated rollback target:** $TARGET_DEPLOYMENT"
            echo "**Validated rollback SHA:** $ACTUAL_SHA"
            echo "**Production mutation requested:** ${{ inputs.perform_rollback }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to the captured deployment
        if: inputs.perform_rollback
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          vercel rollback "$TARGET_DEPLOYMENT" \
            --timeout=10m \
            --non-interactive \
            --scope="$VERCEL_SCOPE"

      - name: Verify rollback at the canonical hostname
        if: inputs.perform_rollback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          for attempt in {1..60}; do
            ACTUAL_SHA=$(curl -fsS \
              -H 'Cache-Control: no-cache' \
              "https://comfy.org/__build.json?rollback=$GITHUB_RUN_ID-$attempt" |
              jq -r '.sha // empty') || true
            ALIAS_DEPLOYMENT_ID=$(curl -fsS --retry 3 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/comfy.org?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" |
              jq -r '.deploymentId // empty') || true
            if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" && "$ALIAS_DEPLOYMENT_ID" == "$TARGET_DEPLOYMENT" ]]; then
              curl -fsS -o /dev/null https://comfy.org/
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canonical production did not return to expected SHA $EXPECTED_SHA"
          exit 1

      - name: Preserve the rolled-back deployment and resume automatic promotion
        if: inputs.perform_rollback
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          vercel promote "$TARGET_DEPLOYMENT" \
            --timeout=10m \
            --non-interactive \
            --scope="$VERCEL_SCOPE"

      - name: Verify post-rollback promotion state
        if: inputs.perform_rollback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          ACTUAL_SHA=$(curl -fsS \
            -H 'Cache-Control: no-cache' \
            "https://comfy.org/__build.json?promote=$GITHUB_RUN_ID" |
            jq -r '.sha // empty')
          ALIAS_DEPLOYMENT_ID=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/comfy.org?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" |
            jq -er '.deploymentId')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ALIAS_DEPLOYMENT_ID" = "$TARGET_DEPLOYMENT"
          {
            echo "**Rollback target:** ${{ inputs.deployment_id }}"
            echo "**Verified canonical SHA:** $ACTUAL_SHA"
            echo "**Verified canonical deployment:** $ALIAS_DEPLOYMENT_ID"
          } >> "$GITHUB_STEP_SUMMARY"
