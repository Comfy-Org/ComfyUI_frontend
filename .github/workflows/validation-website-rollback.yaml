name: 'Validation: Website Production Rollback'

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Immutable Vercel deployment ID to validate or restore (from the transition artifact)'
        required: true
        type: string
      expected_sha:
        description: 'Source SHA the target deployment must serve in /__build.json'
        required: true
        type: string
      perform_rollback:
        description: 'Change production after target validation; false performs a safe preflight only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_WEBSITE_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_TOKEN }}
  VERCEL_SCOPE: comfyui

jobs:
  rollback:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project information
        run: vercel pull --yes --environment=production

      - name: Verify the captured deployment
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PERFORM_ROLLBACK: ${{ inputs.perform_rollback }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          if [[ ! "$TARGET_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "::error::Invalid Vercel deployment ID"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected SHA must be a full lowercase Git commit SHA"
            exit 1
          fi
          TARGET_URL=$(scripts/cicd/website-deployment.sh deployment "$TARGET_DEPLOYMENT" url)
          scripts/cicd/website-deployment.sh verify-identity --host "$TARGET_URL" --sha "$EXPECTED_SHA"
          {
            echo "**Validated rollback target:** $TARGET_DEPLOYMENT"
            echo "**Validated rollback SHA:** $EXPECTED_SHA"
            echo "**Production mutation requested:** $PERFORM_ROLLBACK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to the captured deployment
        if: inputs.perform_rollback
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          vercel rollback "$TARGET_DEPLOYMENT" \
            --timeout=10m \
            --non-interactive \
            --scope="$VERCEL_SCOPE"

      - name: Verify rollback at the canonical hostname
        if: inputs.perform_rollback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          scripts/cicd/website-deployment.sh verify-identity \
            --canonical-deployment "$TARGET_DEPLOYMENT" --sha "$EXPECTED_SHA" \
            --attempts 60 --interval 10

      - name: Preserve the rolled-back deployment and resume automatic promotion
        if: inputs.perform_rollback
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          vercel promote "$TARGET_DEPLOYMENT" \
            --timeout=10m \
            --non-interactive \
            --scope="$VERCEL_SCOPE"

      - name: Verify post-rollback promotion state
        if: inputs.perform_rollback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          scripts/cicd/website-deployment.sh verify-identity \
            --canonical-deployment "$TARGET_DEPLOYMENT" --sha "$EXPECTED_SHA"
          echo "**Verified canonical deployment:** $TARGET_DEPLOYMENT at $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain rollback evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PERFORM_ROLLBACK: ${{ inputs.perform_rollback }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          mkdir -p temp/website-rollback-result
          jq -n \
            --arg targetDeploymentId "$TARGET_DEPLOYMENT" \
            --arg expectedSha "$EXPECTED_SHA" \
            --argjson performRollback "$PERFORM_ROLLBACK" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{$targetDeploymentId, $expectedSha, $performRollback, $runId, $runAttempt, $workflowSha, $actor, $verifiedAt}' \
            > temp/website-rollback-result/result.json

      - name: Upload rollback evidence
        uses: actions/upload-artifact@v6
        with:
          name: website-rollback-result
          path: temp/website-rollback-result/result.json
          retention-days: 7
          if-no-files-found: error
