name: 'Validation: Website Production Rollback'

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Immutable Vercel deployment ID captured before the canary deploy'
        required: true
        type: string
      expected_sha:
        description: 'Source SHA expected at the canonical hostname after rollback'
        required: true
        type: string
      perform_rollback:
        description: 'Change production after target validation; false performs a safe preflight only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: website-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_WEBSITE_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEBSITE_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_WEBSITE_TOKEN }}
  VERCEL_SCOPE: comfyui

jobs:
  rollback:
    if: github.repository == 'Comfy-Org/ComfyUI_frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project information
        run: vercel pull --yes --environment=production

      - name: Verify the captured deployment
        id: verify-target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          if [[ ! "$TARGET_DEPLOYMENT" =~ ^dpl_[A-Za-z0-9]+$ ]]; then
            echo "::error::Invalid Vercel deployment ID"
            exit 1
          fi
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected SHA must be a full lowercase Git commit SHA"
            exit 1
          fi
          DEPLOYMENT=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$TARGET_DEPLOYMENT?teamId=$VERCEL_ORG_ID")
          TARGET_URL=$(jq -er \
            --arg deploymentId "$TARGET_DEPLOYMENT" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            'select(.id == $deploymentId and (.projectId // .project.id) == $projectId) | .url' \
            <<< "$DEPLOYMENT")
          ACTUAL_SHA=$(curl -fsS \
            -H 'Cache-Control: no-cache' \
            "https://$TARGET_URL/__build.json?preflight=$GITHUB_RUN_ID" |
            jq -er '.sha')
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "::error::Deployment $TARGET_DEPLOYMENT serves $ACTUAL_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          echo "actual-sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "**Validated rollback target:** $TARGET_DEPLOYMENT"
            echo "**Validated rollback SHA:** $ACTUAL_SHA"
            echo "**Production mutation requested:** ${{ inputs.perform_rollback }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to the captured deployment
        if: inputs.perform_rollback
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          vercel rollback "$TARGET_DEPLOYMENT" \
            --timeout=10m \
            --non-interactive \
            --scope="$VERCEL_SCOPE"

      - name: Verify rollback at the canonical hostname
        id: verify-canonical
        if: inputs.perform_rollback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          for attempt in {1..60}; do
            ACTUAL_SHA=$(curl -fsS \
              -H 'Cache-Control: no-cache' \
              "https://comfy.org/__build.json?rollback=$GITHUB_RUN_ID-$attempt" |
              jq -r '.sha // empty') || true
            ALIAS_DEPLOYMENT_ID=$(curl -fsS --retry 3 \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v4/aliases/comfy.org?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" |
              jq -r '.deploymentId // empty') || true
            if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" && "$ALIAS_DEPLOYMENT_ID" == "$TARGET_DEPLOYMENT" ]]; then
              curl -fsS -o /dev/null https://comfy.org/
              echo "actual-sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
              echo "deployment-id=$ALIAS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canonical production did not return to expected SHA $EXPECTED_SHA"
          exit 1

      - name: Preserve the rolled-back deployment and resume automatic promotion
        if: inputs.perform_rollback
        env:
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          vercel promote "$TARGET_DEPLOYMENT" \
            --timeout=10m \
            --non-interactive \
            --scope="$VERCEL_SCOPE"

      - name: Verify post-rollback promotion state
        id: verify-promotion
        if: inputs.perform_rollback
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          ACTUAL_SHA=$(curl -fsS \
            -H 'Cache-Control: no-cache' \
            "https://comfy.org/__build.json?promote=$GITHUB_RUN_ID" |
            jq -r '.sha // empty')
          ALIAS_DEPLOYMENT_ID=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v4/aliases/comfy.org?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID" |
            jq -er '.deploymentId')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$ALIAS_DEPLOYMENT_ID" = "$TARGET_DEPLOYMENT"
          echo "actual-sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"
          echo "deployment-id=$ALIAS_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          {
            echo "**Rollback target:** ${{ inputs.deployment_id }}"
            echo "**Verified canonical SHA:** $ACTUAL_SHA"
            echo "**Verified canonical deployment:** $ALIAS_DEPLOYMENT_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain rollback evidence
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PERFORM_ROLLBACK: ${{ inputs.perform_rollback }}
          POST_PROMOTION_DEPLOYMENT_ID: ${{ steps.verify-promotion.outputs.deployment-id }}
          POST_PROMOTION_SHA: ${{ steps.verify-promotion.outputs.actual-sha }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.verify-canonical.outputs.deployment-id }}
          ROLLBACK_SHA: ${{ steps.verify-canonical.outputs.actual-sha }}
          TARGET_DEPLOYMENT: ${{ inputs.deployment_id }}
          TARGET_VERIFIED_SHA: ${{ steps.verify-target.outputs.actual-sha }}
        run: |
          mkdir -p temp/website-rollback-result
          jq -n \
            --arg targetDeploymentId "$TARGET_DEPLOYMENT" \
            --arg expectedSha "$EXPECTED_SHA" \
            --arg targetVerifiedSha "$TARGET_VERIFIED_SHA" \
            --arg rollbackCanonicalSha "$ROLLBACK_SHA" \
            --arg rollbackCanonicalDeploymentId "$ROLLBACK_DEPLOYMENT_ID" \
            --arg postPromotionCanonicalSha "$POST_PROMOTION_SHA" \
            --arg postPromotionCanonicalDeploymentId "$POST_PROMOTION_DEPLOYMENT_ID" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg verifiedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson performRollback "$PERFORM_ROLLBACK" \
            '{targetDeploymentId: $targetDeploymentId, expectedSha: $expectedSha, targetVerifiedSha: $targetVerifiedSha, performRollback: $performRollback, rollbackCanonicalSha: $rollbackCanonicalSha, rollbackCanonicalDeploymentId: $rollbackCanonicalDeploymentId, postPromotionCanonicalSha: $postPromotionCanonicalSha, postPromotionCanonicalDeploymentId: $postPromotionCanonicalDeploymentId, runId: $runId, runAttempt: $runAttempt, workflowSha: $workflowSha, actor: $actor, verifiedAt: $verifiedAt}' \
            > temp/website-rollback-result/result.json

      - name: Upload rollback evidence
        uses: actions/upload-artifact@v6
        with:
          name: website-rollback-result
          path: temp/website-rollback-result/result.json
          retention-days: 7
          if-no-files-found: error
