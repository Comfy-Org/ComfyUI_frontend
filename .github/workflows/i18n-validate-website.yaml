name: 'i18n: Validate Website Translations'

on:
  pull_request:
    branches-ignore: [wip/*, draft/*, temp/*]
    paths:
      - 'apps/website/src/i18n/**'
      - 'apps/website/src/locales/**'
      - 'scripts/i18n/**'
      - 'apps/website/src/config/**'
      - 'apps/website/src/content/**'
      # The data files are a translation source too: their `en` feeds the
      # content-of-record and their machine-written `ja` is what the page reads.
      - 'apps/website/src/data/**'
      - 'apps/website/scripts/i18n/**'
      - '.github/workflows/i18n-validate-website.yaml'
      - '.github/workflows/i18n-update-website.yaml'
      - 'apps/website/package.json'
      - 'package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      # Reads src/i18n/content and the glossary, never dist, so no build is
      # needed: preserve terms, placeholders, URLs, line structure, target
      # script, banned words, and keys present in a translation but absent from
      # the English source.
      - name: Validate translations
        run: |
          pnpm --filter @comfyorg/website i18n:build-source
          pnpm locale:website:check
          pnpm --filter @comfyorg/website i18n:validate

      # The English source the validator checks against is generated. If it is
      # stale, the validator is answering a question about yesterday's copy.
      #
      # Scoped to the generated artifacts only. `src/i18n` also holds the
      # pipeline's own hand-written code, and diffing all of it would report
      # every ordinary change to the pipeline as staleness.
      - name: Check the content source is current
        run: |
          pnpm --filter @comfyorg/website i18n:build-source
          # `status --porcelain`, not `diff --quiet`: adding a locale makes the
          # build write a content file that does not exist at HEAD, and an
          # untracked file is invisible to `git diff`. The check would pass over
          # exactly the change most likely to need it.
          drift=$(git status --porcelain -- \
            apps/website/src/i18n/content \
            apps/website/src/locales)
          if [ -n "$drift" ]; then
            echo "::error::The content source is stale. Run 'pnpm --filter @comfyorg/website i18n:build-source' and commit the result."
            echo "$drift"
            exit 1
          fi

      - name: Check generated data content
        run: pnpm --filter @comfyorg/website i18n:write-data --check

      - name: Check generated faq content
        run: pnpm --filter @comfyorg/website i18n:write-faq --check

      - name: Check generated story content
        run: pnpm --filter @comfyorg/website i18n:write-story --check

      - name: Check resolved browser dictionaries
        run: |
          pnpm --filter @comfyorg/website i18n:build-resolved
          drift=$(git status --porcelain -- apps/website/src/i18n/resolved)
          if [ -n "$drift" ]; then
            echo "::error::Browser dictionaries are stale. Run pnpm --filter @comfyorg/website i18n:build-resolved and commit the result."
            echo "$drift"
            exit 1
          fi
