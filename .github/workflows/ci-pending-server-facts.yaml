# Description: Fails once a pendingServerFact bridge outlives its backend ticket (Done, Canceled, or unknown in Linear)
name: 'CI: Pending Server Facts'

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/*/src/**'
      - 'scripts/pending-server-facts.ts'
      - 'scripts/pendingServerFacts.ts'
      - '.github/workflows/ci-pending-server-facts.yaml'

permissions:
  contents: read

jobs:
  shape:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Check pendingServerFact ticket shape
        run: pnpm check:pending-server-facts --offline

  # PR heads can rewrite the checker, so only default-branch code receives the Linear app secrets.
  expiry:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Check pendingServerFact ticket expiry
        env:
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
        run: pnpm check:pending-server-facts
