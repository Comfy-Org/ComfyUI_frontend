# Description: Fails once a pendingServerFact bridge outlives its backend ticket (Done, Canceled, or unknown in Linear)
name: 'CI: Pending Server Facts'

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'apps/*/src/**'
      - 'scripts/pending-server-facts.ts'
      - 'scripts/pendingServerFacts.ts'
      - '.github/workflows/ci-pending-server-facts.yaml'

permissions:
  contents: read

jobs:
  pending-server-facts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ref
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend

      - name: Check pendingServerFact tickets
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: pnpm check:pending-server-facts
