# Weekly ecosystem matrix over a self-updating full-registry corpus.
#
# Maintains a cached mirror of the frontend JS of EVERY registry pack
# (~5,000 packs, ~1GB) that self-updates exactly when packs move: fetch
# --revalidate HEAD-checks every cached pack's tarball ETag against
# corpus.lock.json (HEAD-ref tarball ETags are commit-derived, so a changed
# ETag means the pack's default branch moved) and refetches only drifted
# packs. The cache saves under a key derived from the lockfile hash, so an
# unchanged corpus skips the save and a drifted one writes a new entry.
# Cold start (no cache) is the one expensive run: a full ~1GB fetch.
#
# The upstream static idiom scan (L1) is deliberately absent: its
# false-positive/negative rate was judged too high to act on. Packs are
# measured by executing their code - the ecosystem matrix - instead.
#
# Provenance: scripts/registry-census/ is vendored from
# Comfy-Org/ComfyUI_ECS_Compat_Check (private, migration-phase instrument
# slated for archival) - see scripts/registry-census/README.md.
name: 'CI: Ecosystem Matrix'

on:
  schedule:
    # Weekly, Monday 06:17 UTC - off the top-of-hour scheduler stampede.
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # Self-testing: a PR that changes the corpus tooling runs the refresh.
  # Also what registers the workflow so workflow_dispatch resolves before
  # the file ever lands on the default branch. PR-branch cache saves are
  # scoped to the PR and invisible to the weekly main run, which
  # cold-starts once post-merge.
  pull_request:
    paths:
      - 'scripts/registry-census/**'
      - '.github/workflows/ci-weekly-registry-census.yaml'

permissions:
  contents: read

concurrency:
  group: registry-corpus
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Restore the newest corpus regardless of key: the primary key never
      # hits (run-scoped), so restore-keys always serves the latest save.
      - name: Restore corpus cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .census
          key: registry-corpus-${{ github.run_id }}
          restore-keys: registry-corpus-

      # Re-pin the registry snapshot every run: it is the corpus's target
      # list, and new packs only enter the corpus through it.
      - name: Refresh registry snapshot
        run: python3 scripts/registry-census/refresh_registry.py

      - name: Fetch corpus and revalidate drifted packs
        id: fetch
        run: python3 scripts/registry-census/fetch_corpus.py --revalidate

      - name: Upload corpus lockfile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: corpus-lock
          path: .census/corpus.lock.json
          retention-days: 30
          if-no-files-found: warn

      # Key derived from the lockfile: unchanged corpus finds its key taken
      # and the server rejects the duplicate; any pack drift writes a new
      # entry. Gated on the FETCH step and a present lockfile: an early
      # failure must not save a partial .census - least of all under the
      # empty-hash key, which equals the restore-keys prefix and would
      # become the best match for every later run.
      - name: Save corpus cache
        if: always() && steps.fetch.outcome == 'success' && hashFiles('.census/corpus.lock.json') != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .census
          key: registry-corpus-${{ hashFiles('.census/corpus.lock.json') }}

  # The execution rung between the corpus (every pack fetched) and the E2E
  # gates (browser + backend): every JS-shipping pack's real extension code
  # is imported and driven against the real frontend runtime under vitest -
  # registration lifecycle, a user-operation battery, serialize/reload.
  # Sharded 4 ways; vitest additionally parallelizes per core within a
  # shard (~4.7s of test time per pack, measured).
  #
  # A shard checks harness integrity only: every built spec must write its
  # per-pack row. vitest's own exit code is ignored here because pack code
  # leaks unhandled rejections. The ecosystem PASS/FAIL verdict is applied
  # once, over all shards combined, by matrix-verdict below.
  ecosystem-matrix:
    needs: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The corpus job above saved the cache this run; same-run caches are
      # visible to later jobs. Restore-only - the matrix never writes it.
      - name: Restore corpus cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .census
          key: registry-corpus-${{ github.run_id }}-matrix
          restore-keys: registry-corpus-

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          include_build_step: false

      - name: Build shard fixture
        run: python3 scripts/registry-census/build_matrix.py --shard ${{ matrix.shard }}/4

      - name: Run the matrix
        run: |
          set -o pipefail
          built=$(ls src/__ecs_matrix__/*.matrix.test.ts 2>/dev/null | wc -l)
          if [ "$built" = 0 ]; then
            echo "::error::no pack specs built - corpus missing or empty"
            exit 1
          fi
          MATRIX_OUT="$PWD/matrix-rows" pnpm exec vitest run             --config vitest.matrix.config.mts 2>&1 | tail -25             || echo "vitest exited nonzero - tolerated, pack code may leak unhandled errors"
          rows=$(ls matrix-rows/*.json 2>/dev/null | wc -l)
          echo "specs=$built rows=$rows"
          if [ "$rows" -ne "$built" ]; then
            echo "::error::matrix wrote $rows rows for $built specs - harness failure, not pack noise"
            exit 1
          fi
          cp src/__ecs_matrix__/manifest.json "matrix-rows/_manifest-shard-${{ matrix.shard }}.json"

      - name: Upload rows
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecosystem-matrix-shard-${{ matrix.shard }}
          path: matrix-rows/
          retention-days: 30
          if-no-files-found: warn

  # The single combined result: all four shards' rows merge into one table
  # and one gating verdict - this job's exit code IS the ecosystem verdict.
  #
  # PASS criteria (summarize_matrix.py, all must hold over the combined
  # rows; each floor sits under the measured baseline so a handful of
  # broken pack HEADs cannot flip the verdict, while a frontend regression
  # that breaks pack integration craters all three at once):
  #   entry JS loads clean   >= 95%           (baseline 97.9%)
  #   registerNodeDef OK     >= 99%           (baseline 100%)
  #   every operation clean  >= 99% of packs  (baseline ~100%)
  matrix-verdict:
    needs: ecosystem-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Merge shard rows
        uses: actions/download-artifact@v8
        with:
          pattern: ecosystem-matrix-shard-*
          path: matrix-rows
          merge-multiple: true

      - name: Verdict
        run: MATRIX_OUT="$PWD/matrix-rows" python3 scripts/registry-census/summarize_matrix.py

      - name: Upload combined result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecosystem-matrix-combined
          path: matrix-rows/
          retention-days: 30
          if-no-files-found: warn

  # Counter-evidence: the matrix runs over a synthetic corpus where every
  # pack breaks exactly one measurement channel (detection-proof/corpus/),
  # then this job requires BOTH that every channel fired with its poison
  # message (verify_detection.py) AND that the combined verdict is FAIL.
  # A green weekly verdict is only meaningful while this stays green: a
  # runner or frontend change that blinds a channel reds THIS job instead
  # of silently hollowing out the weekly one. No corpus/cache dependency -
  # the poison fixture is checked in.
  matrix-detection-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          include_build_step: false

      - name: Build poison fixture
        run: CENSUS_ROOT=scripts/registry-census/detection-proof python3 scripts/registry-census/build_matrix.py

      - name: Run the matrix over the poison corpus
        run: |
          MATRIX_OUT="$PWD/matrix-proof" pnpm exec vitest run             --config vitest.matrix.config.mts 2>&1 | tail -15             || echo "vitest exited nonzero - tolerated, poison packs leak by design"

      - name: Every channel must fire
        run: MATRIX_OUT="$PWD/matrix-proof" python3 scripts/registry-census/verify_detection.py

      - name: Verdict must FAIL on poison
        run: |
          if MATRIX_OUT="$PWD/matrix-proof" python3 scripts/registry-census/summarize_matrix.py > proof-verdict.txt 2>&1; then
            cat proof-verdict.txt
            echo "::error::verdict PASSED on an all-poison corpus - the floors are not gating"
            exit 1
          fi
          tail -6 proof-verdict.txt
          echo "verdict correctly FAILED on the poison corpus"
