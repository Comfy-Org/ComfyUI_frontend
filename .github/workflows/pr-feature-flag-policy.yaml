name: 'PR: Feature Flag Policy'

on:
  workflow_run:
    workflows: ['CI: Feature Flag Policy', 'CI - PR Risk Grade']
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  policy:
    name: Publish feature flag advice
    if: >
      (github.event.workflow_run.event == 'pull_request' ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.name == 'CI - PR Risk Grade' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch)) &&
      (github.event.workflow_run.conclusion == 'success' ||
       (github.event.workflow_run.name == 'CI - PR Risk Grade' &&
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve pull request
        if: github.event.workflow_run.event == 'pull_request'
        id: pr
        uses: ./.github/actions/resolve-pr-from-workflow-run

      - name: Download request
        if: steps.pr.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: feature-flag-request
          path: ${{ runner.temp }}/feature-flag-request
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Node.js
        if: steps.pr.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Evaluate and publish advice
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          TRUSTED_DEFAULT_BRANCH_DISPATCH: ${{ github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.name == 'CI - PR Risk Grade' && github.event.workflow_run.head_branch == github.event.repository.default_branch }}
          POLICY_REQUEST_PATH: ${{ runner.temp }}/feature-flag-request/feature-flag-request.json
        run: node --experimental-strip-types scripts/cicd/feature-flag-policy.ts
