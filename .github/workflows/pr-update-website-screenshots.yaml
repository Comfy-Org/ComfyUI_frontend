name: 'PR: Update Website Screenshots'

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created, edited]

concurrency:
  group: >-
    ${{ github.workflow }}-${{ (
      github.event.label.name == 'Update Website Screenshots' ||
      (github.event.action == 'created' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && startsWith(github.event.comment.body, '/update-website-screenshots')) ||
      (github.event.comment.user.login == 'github-actions[bot]' && contains(github.event.comment.body, '- [x] Update website screenshots') && !contains(github.event.changes.body.from, '- [x] Update website screenshots'))
    ) && (github.event.issue.number || github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.label.name == 'Update Website Screenshots' ) ||
      ( github.event.issue.pull_request &&
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        startsWith(github.event.comment.body, '/update-website-screenshots') ) ||
      ( github.event.issue.pull_request &&
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login == 'github-actions[bot]' &&
        contains(github.event.comment.body, '<!-- WEBSITE_E2E_STATUS -->') &&
        contains(github.event.comment.body, '- [x] Update website screenshots') &&
        !contains(github.event.changes.body.from, '- [x] Update website screenshots') )
    uses: ./.github/workflows/snapshot-update-plan.yaml
    with:
      command: /update-website-screenshots
      e2e-workflow: ci-website-e2e.yaml
      artifact-prefix: website-snapshot-updates-
      job-prefix: website-e2e-shard
      section-name: screenshot-update
      title: 📸 Screenshot Update

  update-screenshots:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.head-sha }}

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_cache: 'false'

      - name: Build website
        env:
          NODE_ENV: production
          WORKSHOP_IN_BUILD: '1'
          PUBLIC_WORKSHOP_ROUTER_RUN: '1'
          PUBLIC_WORKSHOP_CLOUD_ENV: test
          WEBSITE_GITHUB_STARS_OVERRIDE: 110000
          PUBLIC_CUSTOMERIO_WRITE_KEY: test-e2e-write-key
        run: pnpm --filter @comfyorg/website build:e2e

      - name: Update screenshots
        run: pnpm --filter @comfyorg/website test:visual:update

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: website-screenshot-update-report
          path: apps/website/playwright-report/
          retention-days: 14

      - name: Checkout snapshot actions from the workflow's ref
        uses: actions/checkout@v7
        with:
          path: trusted
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Stage rewritten screenshots
        id: changed-snapshots
        uses: ./trusted/.github/actions/stage-rewritten-snapshots
        with:
          config-dir: apps/website

      - name: Upload rewritten screenshots
        if: steps.changed-snapshots.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: website-snapshot-updates-full
          path: ${{ steps.changed-snapshots.outputs.path }}
          retention-days: 1
          overwrite: true

  commit:
    needs: [plan, update-screenshots]
    if: ${{ !cancelled() && needs.plan.result != 'skipped' }}
    uses: ./.github/workflows/snapshot-update-commit.yaml
    with:
      ready: ${{ needs.plan.outputs.run-id != '' || needs.update-screenshots.result == 'success' }}
      unavailable: ${{ needs.plan.outputs.unavailable }}
      missing: ${{ needs.plan.outputs.missing }}
      pr-number: ${{ github.event.issue.number || github.event.pull_request.number }}
      branch: ${{ needs.plan.outputs.branch }}
      head-sha: ${{ needs.plan.outputs.head-sha }}
      run-id: ${{ needs.plan.outputs.run-id }}
      artifact-prefix: website-snapshot-updates-
      config-dir: apps/website
      label: Update Website Screenshots
      section-name: screenshot-update
      title: 📸 Screenshot Update
    secrets:
      PR_GH_TOKEN: ${{ secrets.PR_GH_TOKEN }}
