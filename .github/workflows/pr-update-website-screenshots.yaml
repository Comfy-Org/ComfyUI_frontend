# Updating screenshot baselines for apps/website.
#
# The PR's own `CI: Website E2E` run already captured the actual image of
# every failed screenshot assertion and uploaded them, laid out on their
# baseline paths, as `website-snapshot-updates-*` artifacts (see
# scripts/playwright/snapshotUpdatesReporter.ts). The `harvest` job commits
# those instead of rerunning Playwright. It falls back to a full
# `--update-snapshots` rerun when that run is missing, did not finish, or
# predates the harvest artifacts; `/update-website-screenshots full` forces
# the rerun.
#
# pr-update-playwright-expectations.yaml is the same pipeline for the
# frontend; both are built from the harvest-snapshot-updates,
# stage-rewritten-snapshots and commit-snapshot-updates actions.
name: 'PR: Update Website Screenshots'

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Trigger: (1) label, (2) /slash-command, or (3) checkbox in E2E status comment
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.label.name == 'Update Website Screenshots' ) ||
      ( github.event.issue.pull_request &&
        github.event_name == 'issue_comment' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        ) &&
        startsWith(github.event.comment.body, '/update-website-screenshots') ) ||
      ( github.event.issue.pull_request &&
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login == 'github-actions[bot]' &&
        github.actor != 'github-actions[bot]' &&
        contains(github.event.comment.body, '<!-- WEBSITE_E2E_STATUS -->') &&
        contains(github.event.comment.body, '- [x] Update website screenshots') )
    outputs:
      pr-number: ${{ steps.pr-info.outputs.pr-number }}
      branch: ${{ steps.pr-info.outputs.branch }}
      head-sha: ${{ steps.pr-info.outputs.head-sha }}
      requested-mode: ${{ steps.pr-info.outputs.requested-mode }}
    steps:
      - name: Verify sender permissions
        if: >
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '<!-- WEBSITE_E2E_STATUS -->')
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.actor
            })
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`User ${context.actor} does not have write access`)
            }

      - name: Get PR info
        id: pr-info
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ github.event.number || github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER)
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumber
            })
            core.setOutput('pr-number', prNumber)
            core.setOutput('branch', pr.head.ref)
            core.setOutput('head-sha', pr.head.sha)
            // `/update-website-screenshots full` skips the harvest and reruns the suite.
            const firstLine = (process.env.COMMENT_BODY ?? '').split('\n')[0]
            const full = /^\/update-website-screenshots\s+full(\s|$)/.test(firstLine)
            core.setOutput('requested-mode', full ? 'full' : 'auto')

  post-starting-comment:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    concurrency:
      group: website-pr-comment-${{ needs.setup.outputs.pr-number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/upsert-comment-section
        with:
          pr-number: ${{ needs.setup.outputs.pr-number }}
          section-name: screenshot-update
          comment-marker: '<!-- COMFYUI_FRONTEND_PR_REPORT -->'
          token: ${{ secrets.GITHUB_TOKEN }}
          section-content: |-
            ## 📸 Screenshot Update

            > [!NOTE]
            > Updating screenshots… [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  harvest:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.harvest.outputs.mode }}
      run-url: ${{ steps.harvest.outputs.run-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.branch }}

      - name: Harvest rewritten screenshots from the E2E run
        id: harvest
        uses: ./.github/actions/harvest-snapshot-updates
        with:
          e2e-workflow: ci-website-e2e.yaml
          head-sha: ${{ needs.setup.outputs.head-sha }}
          artifact-prefix: website-snapshot-updates-
          job-prefix: website-e2e-shard
          output-artifact: website-rewritten-snapshots-harvested
          requested-mode: ${{ needs.setup.outputs.requested-mode }}
          wait-minutes: '30'
          token: ${{ secrets.GITHUB_TOKEN }}

  update-screenshots:
    needs: [setup, harvest]
    if: needs.harvest.outputs.mode == 'full'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.branch }}

      - name: Setup frontend
        uses: ./.github/actions/setup-frontend
        with:
          node_cache: 'false'

      - name: Build website
        env:
          NODE_ENV: production
          WORKSHOP_IN_BUILD: '1'
          PUBLIC_WORKSHOP_ROUTER_RUN: '1'
          PUBLIC_WORKSHOP_CLOUD_ENV: test
          WEBSITE_GITHUB_STARS_OVERRIDE: 110000
          PUBLIC_CUSTOMERIO_WRITE_KEY: test-e2e-write-key
        run: pnpm --filter @comfyorg/website build:e2e

      - name: Update screenshots
        id: update-screenshots
        run: pnpm --filter @comfyorg/website test:visual:update
        continue-on-error: true

      - name: Upload test report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: website-screenshot-update-report
          path: apps/website/playwright-report/
          retention-days: 14

      - name: Stage rewritten screenshots
        if: steps.update-screenshots.outcome == 'success'
        uses: ./.github/actions/stage-rewritten-snapshots
        with:
          config-dir: apps/website
          artifact-name: website-rewritten-snapshots-full

      - name: Fail when the rerun did not pass
        if: steps.update-screenshots.outcome != 'success'
        run: |
          echo "::error::The --update-snapshots rerun failed; see the uploaded report. Nothing was committed."
          exit 1

  commit:
    needs: [setup, harvest, update-screenshots]
    if: >-
      ${{
        !cancelled() &&
        needs.setup.result == 'success' &&
        needs.harvest.result == 'success' &&
        (needs.update-screenshots.result == 'success' || needs.update-screenshots.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has-changes: ${{ steps.commit.outputs.has-changes }}
      changed-count: ${{ steps.commit.outputs.changed-count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.setup.outputs.branch }}
          token: ${{ secrets.PR_GH_TOKEN }}

      - name: Commit updated screenshots
        id: commit
        uses: ./.github/actions/commit-snapshot-updates
        with:
          artifact-pattern: website-rewritten-snapshots-*
          config-dir: apps/website
          snapshot-paths: apps/website/e2e/
          branch: ${{ needs.setup.outputs.branch }}
          head-sha: ${{ needs.setup.outputs.head-sha }}
          message: '[automated] Update website screenshot expectations'
          source-run-url: ${{ needs.harvest.outputs.mode == 'harvest' && needs.harvest.outputs.run-url || '' }}

      - name: Remove label
        if: always() && github.event_name == 'pull_request'
        # Label cleanup is best-effort; the restricted pull_request token may
        # lack permission to remove labels and must not fail the run.
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ needs.setup.outputs.pr-number }}
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: Number(process.env.PR_NUMBER),
                name: 'Update Website Screenshots'
              })
            } catch (e) {
              if (e.status !== 404) {
                throw e
              }
              core.info('Label "Update Website Screenshots" was already removed')
            }

  post-result-comment:
    needs: [setup, harvest, update-screenshots, commit]
    if: always() && !cancelled() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    concurrency:
      group: website-pr-comment-${{ needs.setup.outputs.pr-number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Build screenshot-update section content
        id: content
        uses: actions/github-script@v9
        env:
          HARVEST_MODE: ${{ needs.harvest.outputs.mode }}
          HARVEST_RUN_URL: ${{ needs.harvest.outputs.run-url }}
          COMMIT_RESULT: ${{ needs.commit.result }}
          HAS_CHANGES: ${{ needs.commit.outputs.has-changes }}
          CHANGED_COUNT: ${{ needs.commit.outputs.changed-count }}
        with:
          script: |
            const mode = process.env.HARVEST_MODE
            const harvestRunUrl = process.env.HARVEST_RUN_URL
            const committed = process.env.COMMIT_RESULT === 'success'
            const hasChanges = process.env.HAS_CHANGES === 'true'
            const changedCount = parseInt(process.env.CHANGED_COUNT) || 0
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            const lines = ['## 📸 Screenshot Update', '']

            if (!committed) {
              lines.push(
                '> [!CAUTION]',
                `> Screenshot update failed. [View workflow run](${runUrl})`
              )
            } else if (mode === 'none') {
              lines.push(
                '> [!TIP]',
                `> The [E2E run](${harvestRunUrl}) for this commit has no screenshot diffs; nothing to update.`
              )
            } else if (!hasChanges) {
              lines.push(
                '> [!TIP]',
                '> All screenshots are already up to date.'
              )
            } else {
              const s = changedCount === 1 ? '' : 's'
              const source = mode === 'harvest'
                ? ` taken from the [E2E run](${harvestRunUrl}) without rerunning Playwright`
                : ''
              lines.push(
                '> [!TIP]',
                `> Updated ${changedCount} screenshot${s}${source} and pushed to the branch.`
              )
            }

            core.setOutput('section-content', lines.join('\n'))

      - uses: ./.github/actions/upsert-comment-section
        with:
          pr-number: ${{ needs.setup.outputs.pr-number }}
          section-name: screenshot-update
          comment-marker: '<!-- COMFYUI_FRONTEND_PR_REPORT -->'
          token: ${{ secrets.GITHUB_TOKEN }}
          section-content: ${{ steps.content.outputs.section-content }}
