<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="330" viewBox="0 0 1060 330" role="img" aria-labelledby="title description">
  <title id="title">An augmentation edits through the existing input pipeline</title>
  <desc id="description">A selected completion or text action requests replacement text. Core checks editability, composition, current text and selection, and length. Accepted native insertion emits input into the existing widget update path. Refused edits leave the value unchanged.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#4169a1"/></marker>
    <marker id="refused" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="#687485"/></marker>
  </defs>
  <rect width="1060" height="330" rx="10" fill="#fff"/>
  <g font-family="system-ui, sans-serif" fill="#17212e">
    <text x="24" y="34" font-size="19" font-weight="600">The extension proposes text. Core decides whether to edit.</text>
    <rect x="24" y="94" width="200" height="76" rx="7" fill="#f5f7fa" stroke="#c1cad6"/>
    <text x="124" y="122" text-anchor="middle" font-size="15">Choose a completion</text>
    <text x="124" y="146" text-anchor="middle" font-size="14">or run a text action</text>
    <rect x="284" y="94" width="220" height="76" rx="7" fill="#edf3fd" stroke="#4169a1"/>
    <text x="394" y="122" text-anchor="middle" font-size="15">Guard the replacement</text>
    <text x="394" y="146" text-anchor="middle" font-size="12">useTextareaEdit.replace</text>
    <rect x="564" y="94" width="220" height="76" rx="7" fill="#f5f7fa" stroke="#c1cad6"/>
    <text x="674" y="122" text-anchor="middle" font-size="15">Native text insertion</text>
    <text x="674" y="146" text-anchor="middle" font-size="12">document.execCommand</text>
    <rect x="854" y="94" width="182" height="76" rx="7" fill="#f5f7fa" stroke="#c1cad6"/>
    <text x="945" y="122" text-anchor="middle" font-size="15">Existing widget update</text>
    <text x="945" y="146" text-anchor="middle" font-size="11">input / update:model-value</text>
    <g stroke="#4169a1" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <path d="M224 132 H282"/>
      <path d="M504 132 H562"/>
      <path d="M784 132 H852"/>
    </g>
    <text x="254" y="116" text-anchor="middle" font-size="10" fill="#526071">text</text>
    <text x="534" y="116" text-anchor="middle" font-size="10" fill="#526071">valid</text>
    <text x="819" y="116" text-anchor="middle" font-size="10" fill="#526071">input</text>
    <path d="M394 170 V225" stroke="#687485" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#refused)"/>
    <text x="407" y="204" font-size="11" fill="#526071">refused</text>
    <rect x="284" y="227" width="220" height="52" rx="7" fill="#f5f7fa" stroke="#c1cad6"/>
    <text x="394" y="258" text-anchor="middle" font-size="14">Keep the current value</text>
    <text x="564" y="239" font-size="12" fill="#526071">Read-only, disabled, composing,</text>
    <text x="564" y="260" font-size="12" fill="#526071">stale text or selection, or maxlength.</text>
    <text x="24" y="309" font-size="13" fill="#526071">Native undo stays with the focused editor. No second widget-value writer or direct-value fallback.</text>
  </g>
</svg>
