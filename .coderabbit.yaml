issue_enrichment:
  auto_enrich:
    enabled: true
reviews:
  profile: assertive
  high_level_summary: false
  request_changes_workflow: true
  # Without this, a review that never happened (rate limit, internal error)
  # still reports green, so an unreviewed PR is indistinguishable from a
  # cleanly reviewed one.
  fail_commit_status: true
  auto_review:
    drafts: true
    ignore_title_keywords:
      - '[release]'
      - '[backport'
    ignore_usernames:
      - comfy-pr-bot
      - github-actions
      - github-actions[bot]
  pre_merge_checks:
    override_requested_reviewers_only: true
    # Explicitly disable the built-in docstring coverage check, which is
    # enabled via organization-level settings. This repo opts out at the
    # repo level without affecting other org repos.
    docstrings:
      mode: 'off'
    custom_checks:
      - name: End-to-end test suggestion for user-facing changes
        mode: warning
        instructions: |
          Use only PR metadata already available in the review context:
            - the PR title
            - commit subjects in this PR
            - the files changed in this PR relative to the PR base (equivalent to `base...head`)
            - the diff content.
          Do not rely on shell commands.
          Do not inspect reverse diffs, files changed only on the base branch, or files outside this PR.
          If the changed-file list is unavailable, mark the check inconclusive instead of guessing.

          This check encourages a Playwright test; it never requires one.

          Fail if all of the following are true:
          1. The diff fixes a bug or adds or changes a feature in the main frontend application under `src/` or `packages/`. A `fix`-style title or commit subject is only a hint: confirm it against the diff.
          2. A reasonable person could describe, in one or two plain-language sentences, the feature or a user-visible way to trigger the bug.
          3. The PR does not add or update a spec under `browser_tests/` that exercises that feature or trigger.

          Pass when the change is exclusively in documentation, tests, tooling, or CI. Also pass when the bug can only be reached through contrived fixtures or internal state a user cannot produce.

          When failing, say this is a suggestion, not a merge requirement. Describe the feature or trigger in one sentence, then outline the test as bullets with exactly one action or expectation per bullet. Suggest extending an existing spec under `browser_tests/` when the changed files point to one.

      - name: ADR compliance for entity/litegraph changes
        mode: warning
        instructions: |
          Use only PR metadata already available in the review context: the changed-file list relative to the PR base, the PR description, and the diff content. Do not rely on shell commands.

          This check applies ONLY when the PR modifies files under `src/lib/litegraph/`, `src/ecs/`, or files related to graph entities (nodes, links, widgets, slots, reroutes, groups, subgraphs).

          If none of those paths appear in the changed files, pass immediately.

          When applicable, check for:
          1. **Command pattern (ADR-LAYOUT)**: Entity state mutations must be serializable, idempotent, deterministic commands — not imperative fire-and-forget side effects. Flag direct spatial mutation (`node.pos =`, `node.size =`, `group.pos =`) outside of a store or command, and any new void-returning mutation API that should produce a command object.
          2. **God-object growth (ADR-ECS)**: New methods/properties added to `LGraphNode`, `LGraphCanvas`, `LGraph`, or `Subgraph` that add responsibilities rather than extracting/migrating existing ones.
          3. **ECS data/behavior separation (ADR-ECS)**: Component-like data structures that contain methods or back-references to parent entities. ECS components must be plain data. New OOP instance patterns (`node.someProperty`, `node.someMethod()`) for data that should be a World component.
          4. **Extension ecosystem (ADR-ECS)**: Changes to extension-facing callbacks (`onConnectionsChange`, `onRemoved`, `onAdded`, `onConfigure`, `onConnectInput/Output`, `onWidgetChanged`), `node.widgets` access, `node.serialize` overrides, or `graph._version++` without migration guidance. These affect 40+ custom node repos.

          Pass if none of these patterns are found in the diff.

          When warning, reference the specific ADR by identifier and link to `docs/adr/` for context. Frame findings as directional guidance since ADR-LAYOUT and ADR-ECS are in Proposed status.

  path_instructions:
    - path: '**/*.ts'
      instructions: |
        Treat `docs/guidance/typescript.md` as required review context.
    - path: '**/*.vue'
      instructions: |
        Treat `docs/guidance/typescript.md` and
        `docs/guidance/vue-components.md` as required review context. For
        changed components or views under `src/components/` or `src/views/`,
        also apply `docs/guidance/design-standards.md` and assess accessibility.
    - path: '**/*.stories.ts'
      instructions: |
        Treat `docs/guidance/storybook.md` as required review context.
    - path: 'src/lib/litegraph/**'
      instructions: |
        Treat the ADRs in `docs/adr/` as required review context. For widget
        serialization changes, also read
        `docs/WIDGET_SERIALIZATION.md`.
    - path: 'src/workbench/extensions/agent/**'
      instructions: |
        Treat `.agents/checks/follower-boundary.md` and
        `docs/adr/CRDT-FOLLOWER-0025-in-app-agent-crdt-follower-and-distribution-resolved-boundaries.md` as
        required review context. Flag: the follower writing the shared doc,
        client-sent raw Yjs `update_b64`, layout/presence fields in the shared
        semantic doc, an optimistic overlay merged back as a Yjs update,
        `op_id` regeneration on retry, a second applier reimplemented instead
        of importing `@comfyorg/comfy-multi-player`, `DISTRIBUTION`/`isCloud`/
        `isDesktop` checks scattered outside the agent connection boundary, and
        auth reduced to `isCloud` instead of `authStore.getAuthHeader()`.
    - path: '**/*.test.ts'
      instructions: |
        Treat `.agents/checks/test-quality.md`, `docs/testing/README.md`,
        `docs/guidance/vitest.md`, and `docs/testing/vitest-patterns.md` as
        required review context for every changed Vitest test file.
    - path: 'src/lib/litegraph/**/*.test.ts'
      instructions: |
        Treat `.agents/checks/test-quality.md`, `docs/testing/README.md`,
        `docs/guidance/vitest.md`, `docs/testing/vitest-patterns.md`, and
        `docs/testing/litegraph-testing.md` as required review context for
        every changed LiteGraph Vitest test file.
    - path: 'browser_tests/**/*.spec.ts'
      instructions: |
        Treat `.agents/checks/test-quality.md`, `docs/testing/README.md`,
        and `docs/guidance/playwright.md` as required review context for every
        changed Playwright test file. For
        `browser_tests/`, also read `browser_tests/README.md` and
        `browser_tests/AGENTS.md`, and apply
        `.agents/checks/playwright-e2e.md`.
