        into a denylist, skipping the corpus SHA check, or making a gate
        non-fatal) are correctness issues. Keep the purity gate a positive
        yjs-only assertion, not merely a denylist (issue #22).
    - path: "{package.json,tsconfig*.json,stryker.config.mjs}"
      # source: .agents/checks/purity.md
      instructions: >-
        Guard the build and package contract. The production dependency set
        must stay yjs-only (KA-3/FC-3) — flag any new runtime dependency. Cite
        the frozen vocabulary/catalog by SHA, never a moving branch (FC-10). Do
        not remove or make non-fatal the verify:corpus, build, check:purity,
