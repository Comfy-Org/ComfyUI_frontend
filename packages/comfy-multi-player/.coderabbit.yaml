reviews:
  path_instructions:
    - path: "src/**"
      instructions: >-
        Review against docs/INVARIANTS.md and every applicable profile in
        .agents/checks/. Cite stable KA-* and FC-* IDs. Treat purity,
        convergence/idempotency, op identity, catalog pinning, and follower
        boundary violations as correctness issues. Any op-layer path that can
        mutate the Yjs doc and then throw (leaving a partial mutation and a
        skipped op_id record) is a blocking KA-4 issue (see issue #10); require
        validate-before-mutate. Any second op-to-document implementation is a
        blocking FC-3 issue.
    - path: "test/**"
      instructions: >-
        Apply .agents/checks/test-quality.md. Rejection tests must assert the
        document state, not only failed.code: compare a project(doc) snapshot
        before and after applyOps (unchanged on reject, KA-4) and verify a
        trailing valid op after a rejected one does not apply (abort-remainder).
        Op-semantics tests need both arrival orders (convergence) and a
        double-apply no-op (idempotency). No `any` in tests; cast invalid inputs
        narrowly at the single line under test. Tests use Vitest under test/.
    - path: "scripts/**"
      instructions: >-
        These scripts are the machine-enforced guards for the invariants
        (check-purity, verify-corpus). Changes that weaken a guard (turning a
        positive assertion into a denylist, skipping the corpus SHA check, or
        making a gate non-fatal) are correctness issues. Keep the purity gate a
        positive yjs-only assertion, not merely a denylist (issue #22).
    - path: "{package.json,package-lock.json,tsconfig.json,.github/**,stryker.conf.*}"
      instructions: >-
        Guard the build and CI contract. The production dependency set must stay
        yjs-only (KA-3/FC-3) — flag any new runtime dependency. Cite the
        frozen vocabulary/catalog by SHA, never a moving branch (FC-10). Do not
        remove or make non-fatal the build, purity, corpus-verify, or test CI
        steps.
    - path: "{fixtures/**,.agents/checks/catalog-pinning.md}"
      instructions: >-
        Apply .agents/checks/catalog-pinning.md (KA-12, FC-10). The widget
        catalog (fixtures/catalog.json) is pinned by sha256 at mint; the golden
        conformance corpus and lww-vectors are SHA-pinned and one-way. Flag any
        change that edits a pinned fixture without a corresponding manifest/SHA
        update, cites the catalog/vocabulary by a moving branch instead of a SHA,
        or would let the corpus drift without being regenerated in CI
        (verify:corpus).
