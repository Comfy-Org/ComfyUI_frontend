name: Mutation testing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Mutation tests
        run: npm run test:mutation

      # Stryker scores a `Timeout` as killed, so a loaded runner inflates the
      # score. `stryker.config.mjs` pins timeoutMS/concurrency; this re-derives
      # the score from the JSON report, reports Timeout as its own outcome, and
      # exits 2 INCONCLUSIVE when timeouts are material. Runs even when Stryker
      # broke the threshold, so the failure is explained rather than just red.
      - name: Check mutation report
        if: always()
        run: npm run check:mutation-report

      # Without this the run discards reports/mutation/ and even a failure
      # leaves nothing to inspect.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
          if-no-files-found: error
