name: Detect Unreviewed Merge

# SOC 2 compliance — reusable workflow lives in Comfy-Org/github-workflows,
# tracking issues are filed in Comfy-Org/unreviewed-merges.
#
# `latest-per-reviewer` (not cloud's `any-approval`): this repo's branch
# protection follows the same OSS default as ComfyUI_frontend — dismiss stale
# reviews on new commits — so a dismissed approval must not count.
#
# Bumping the pin below is manual: this caller has no bump-*-callers fleet
# upstream and .github/dependabot.yml (if this repo adds one) would need to
# ignore this reusable, same as cloud/frontend. To bump it:
#   gh api repos/Comfy-Org/github-workflows/git/ref/tags/v1 --jq .object.sha
# and update the `uses:` SHA below if it differs.

on:
  push:
    branches: [main]

concurrency:
  group: detect-unreviewed-merge-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    uses: Comfy-Org/github-workflows/.github/workflows/detect-unreviewed-merge.yml@ffcc3f5b4dfc568e846e769c4f4df4f749c7887b # v1
    with:
      approval-mode: latest-per-reviewer
    secrets:
      UNREVIEWED_MERGES_TOKEN: ${{ secrets.UNREVIEWED_MERGES_TOKEN }}
