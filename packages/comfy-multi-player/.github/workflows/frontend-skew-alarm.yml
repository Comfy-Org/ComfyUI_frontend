name: Frontend compatibility skew alarm

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-frontend:
    name: latest frontend follower against cmp main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out comfy-multi-player main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: comfy-multi-player
          persist-credentials: false

      - name: Check out latest frontend main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/ComfyUI_frontend
          ref: main
          path: frontend
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: comfy-multi-player/package-lock.json

      - name: Enable frontend package manager
        run: corepack enable

      - name: Pack current comfy-multi-player
        id: pack
        working-directory: comfy-multi-player
        run: |
          npm ci
          package_name=$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[0].filename));')
          echo "package=$RUNNER_TEMP/$package_name" >> "$GITHUB_OUTPUT"

      - name: Inject current package into latest frontend
        working-directory: frontend
        env:
          CMP_PACKAGE: ${{ steps.pack.outputs.package }}
        run: |
          # shellcheck disable=SC2016
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.dependencies["@comfyorg/comfy-multi-player"] = `file:${process.env.CMP_PACKAGE}`; fs.writeFileSync("package.json", `${JSON.stringify(p, null, 2)}\n`);'
          pnpm install --no-frozen-lockfile

      - name: Run frontend follower contract tests
        working-directory: frontend
        run: pnpm exec vitest run src/workbench/extensions/agent/crdt
