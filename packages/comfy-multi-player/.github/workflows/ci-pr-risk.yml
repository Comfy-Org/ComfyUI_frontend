name: CI - PR Risk Grade

# Thin caller for the shared reusable ADVISORY PR risk grader (shadow check).
# Grades every PR event R0 (safest) .. R3 (riskiest) and syncs exactly one
# `risk:*` label; the label is the entire product — nothing gates, routes,
# comments, or merges on it. Disagree with a grade by adding the human-owned
# `risk-dispute` label (which the grader never touches) plus a comment saying
# why.
#
# The grading logic loads from Comfy-Org/github-workflows at the pinned SHA
# below — never from the graded PR's checkout. This repo carries no
# `.github/risk.json` override, so grading falls back to the reusable's
# generic default map (present-but-invalid would fail loudly; absent falls
# back cleanly, which is the case here).
#
# Deliberately its own workflow, not a job in an existing CI workflow: the
# grader excludes its own RUN from the check rollup its reversibility axis
# reads, so a sibling job sharing a run with the rest of CI would exclude
# those checks too and every grade would floor at R2.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # On-demand grading. Use `pr_number` for a single re-grade (after a base-branch
  # retarget, or to re-judge a PR whose grade is disputed) and `pr_numbers` to
  # backfill a batch. Neither exists on the `pull_request` path, where `inputs`
  # is empty — one caller shape serves both.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Grade ONE pr by number (enrollment backfill, or a manual re-grade).
        required: false
      pr_numbers:
        description: Grade several, comma-separated (12,15,20). Wins over pr_number.
        required: false

concurrency:
  # THE KEY MUST CARRY THE RESOLVED TARGET, not just the event PR. On a
  # workflow_dispatch `github.event.pull_request.number` is empty, so an
  # event-only key collapses to ONE constant group for every dispatch.
  group: ${{ github.workflow }}-${{ inputs.pr_numbers || inputs.pr_number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-risk:
    # Fork guard is a TOKEN guard, not a risk judgement: a fork's pull_request
    # run gets a read-only GITHUB_TOKEN, so the label write would 403. Scoped
    # behind the event check so workflow_dispatch (where there is no
    # github.event.pull_request) isn't skipped silently. There is
    # deliberately no dependabot exclusion — the permissions block below
    # elevates Dependabot's token and this reusable declares no secrets, so
    # excluding it would just leave the org's highest-volume automated PR
    # producer ungraded.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read # the .github/risk.json override, read from the BASE ref (absent here)
      issues: write # create the risk:* labels repo-side on first use
      # The label write itself rides pull-requests, not issues: the labels
      # endpoint is dual-mapped by what the "issue" is, and labeling a PR with
      # issues:write alone 403s ("Resource not accessible by integration").
      pull-requests: write
      # Declared even though this repo doesn't opt into the Check Run publish
      # (check_run stays false below): GitHub validates every nested job's
      # permissions declaration against this block at startup, even a job an
      # `if:` will skip, so a narrower grant here fails the whole run.
      checks: write
      # The rollup query walks CheckRun -> checkSuite -> workflowRun for the
      # grader's self-exclusion; workflow runs are an Actions resource.
      actions: read
      statuses: read
    # Pinned to github-workflows main (ffcc3f5). Bump this SHA to pick up
    # upstream changes; keep `workflows_ref` matching so the grader + default
    # map load from the same commit. The permissions block above must stay a
    # superset of the UNION of what every job in the reusable workflow
    # declares at this pin — re-check both whenever this SHA moves.
    uses: Comfy-Org/github-workflows/.github/workflows/pr-risk.yml@ffcc3f5b4dfc568e846e769c4f4df4f749c7887b # github-workflows main (ffcc3f5)
    with:
      # Keep the grader/map ref in lock-step with the `uses:` ref above.
      workflows_ref: ffcc3f5b4dfc568e846e769c4f4df4f749c7887b
      # REQUIRED FROM THIS PIN ON — upstream defaults `enabled` to FALSE.
      enabled: true
      # Both are empty on a `pull_request` run, which is exactly the no-input
      # event path.
      pr_number: ${{ inputs.pr_number }}
      pr_numbers: ${{ inputs.pr_numbers }}
