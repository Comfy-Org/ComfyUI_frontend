name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: build / purity / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify conformance corpus
        run: npm run verify:corpus

      - name: Build
        run: npm run build

      - name: Purity gate
        run: npm run check:purity

      - name: Profile-claim staleness gate
        run: npm run check:profile-claims

      # Module-graph gate. Exits 2 (INCONCLUSIVE) rather than green when it
      # cruises too few modules to mean anything — see .agents/checks/import-graph.md.
      - name: Import-graph gate
        run: npm run check:imports

      - name: Tests
        run: npm test
