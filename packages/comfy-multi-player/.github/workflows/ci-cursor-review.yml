name: CI - Cursor Review

# Thin caller for the shared reusable cursor-review workflow in
# Comfy-Org/github-workflows. The review logic (panel matrix, judge
# consolidation, prompts, extract/post/notify scripts) is the single source of
# truth there, so this repo carries only the caller — no copies, no drift.
#
# Manually label a PR `cursor-review` to run the panel. This repo is public,
# so the access control is the same two layers ComfyUI_frontend relies on:
#   1. Only users with triage permission or higher can apply a label on a
#      public repo, so an outside contributor cannot trigger a run.
#   2. The reusable workflow's secret-bearing jobs do not run on fork PRs
#      (forks get no secrets), so CURSOR_API_KEY stays unreachable there.
# Auto-labeling on PR open/assignment (as cloud does via a bot-app token) is
# intentionally not added here — this repo has no equivalent GitHub App
# identity/secret wired up, so the manual label matches what's actually
# available.

on:
  pull_request:
    types: [labeled, unlabeled]

# Cancel an earlier in-flight review for the same PR when cursor-review is
# removed or re-applied. Scoping by label name means removing an unrelated
# label does not kill a running cursor review.
concurrency:
  group: cursor-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  cursor-review:
    if: github.event.action == 'labeled' && github.event.label.name == 'cursor-review'
    # Scope the GITHUB_TOKEN to this calling job; the reusable workflow further
    # restricts per-job — only its `consolidate` job uses `pull-requests: write`
    # to post the review.
    permissions:
      contents: read
      pull-requests: write
    # SHA-pinned per zizmor `unpinned-uses: hash-pin`. Bump this SHA to pick up
    # upstream changes; keep `workflows_ref` matching so the prompts/scripts load
    # from the same commit as the workflow definition.
    uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@ffcc3f5b4dfc568e846e769c4f4df4f749c7887b # github-workflows main (ffcc3f5)
    with:
      workflows_ref: ffcc3f5b4dfc568e846e769c4f4df4f749c7887b
      # This repo has no build output or vendored trees committed (dist/ is
      # gitignored, and there's no node_modules/vendor in the tree), so the
      # only addition to the reusable's own lockfile excludes is the
      # generated corpus/report artifacts under reports/.
      diff_excludes: >-
        :!**/package-lock.json
        :!**/yarn.lock
        :!**/pnpm-lock.yaml
        :!**/node_modules/**
        :!**/dist/**
        :!**/*.generated.*
        :!**/*.min.js
        :!**/*.min.css
        :!reports/**
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      # Optional — enables start/complete Slack DMs to the triggerer.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
